<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق الاقتباسات الذكي</title>

<!-- PDF.js -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<!-- Tesseract.js للـ OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
  :root{
    --bg:#0f1115; --panel:#1a1d24; --border:#2a2f3a;
    --text:#e8eaed; --muted:#9aa0a6; --accent:#6c8cff;
    --ok:#22c55e; --err:#ef4444;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:'Segoe UI',Tahoma,system-ui,sans-serif;
    background:var(--bg);color:var(--text);padding:16px;
  }
  h1{font-size:20px;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
  input,select,textarea,button{
    width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);
    background:#12151b;color:var(--text);font-family:inherit;font-size:14px;
  }
  textarea{min-height:90px;resize:vertical;line-height:1.6}
  button{background:var(--accent);border:none;cursor:pointer;font-weight:600;margin-top:8px}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.sec{background:#2a2f3a}
  .row{display:flex;gap:8px;margin-top:8px}
  .row button{margin-top:0}
  .status{font-size:13px;margin-top:8px;padding:8px;border-radius:6px;display:none}
  .status.ok{display:block;background:#0d2a17;color:#86efac}
  .status.err{display:block;background:#2a0d0d;color:#fca5a5}
  .status.info{display:block;background:#0d1a2a;color:#93c5fd}

  #quoteCanvas{
    width:100%;height:auto;border-radius:12px;
    border:1px solid var(--border);background:#000;display:block;
  }
  .styles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
  .style-btn{
    padding:8px 4px;font-size:11px;border-radius:6px;cursor:pointer;
    border:2px solid transparent;background:#12151b;color:var(--text);text-align:center;
  }
  .style-btn.active{border-color:var(--accent)}
  .quote-preview{
    margin-top:12px;padding:12px;background:#12151b;border-radius:8px;
    font-size:14px;line-height:1.7;min-height:60px;
  }
</style>
</head>
<body>

<h1>📖 تطبيق الاقتباسات الذكي</h1>

<div class="grid">
  <!-- ============ اللوحة اليمنى: الإدخال ============ -->
  <div class="card">
    <label>1) ارفع ملف PDF</label>
    <input type="file" id="pdfFile" accept="application/pdf">

    <div class="row">
      <button id="extractBtn" class="sec">استخراج النص</button>
      <button id="clearBtn" class="sec">مسح</button>
    </div>
    <div id="extractStatus" class="status"></div>

    <label>2) نص الكتاب (يمكنك التعديل عليه)</label>
    <textarea id="bookText" placeholder="سيظهر النص هنا بعد الاستخراج..."></textarea>

    <label>3) مفتاح OpenRouter</label>
    <input type="password" id="apiKey" placeholder="sk-or-v1-...">

    <label>4) الموديل</label>
    <select id="model">
      <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B (مجاني)</option>
      <option value="mistralai/mistral-7b-instruct:free">Mistral 7B (مجاني)</option>
      <option value="google/gemma-2-9b-it:free">Gemma 2 9B (مجاني)</option>
      <option value="qwen/qwen-2.5-7b-instruct:free">Qwen 2.5 7B (مجاني)</option>
    </select>

    <label>5) عدد الاقتباسات</label>
    <input type="number" id="quoteCount" value="3" min="1" max="10">

    <button id="generateBtn">✨ توليد الاقتباسات</button>
    <div id="genStatus" class="status"></div>

    <label>6) اختر اقتباسًا</label>
    <div id="quotesList"></div>

    <label>7) نمط العرض</label>
    <div class="styles" id="stylesGrid"></div>

    <label>8) الاتجاه</label>
    <select id="orientation">
      <option value="portrait">طولي (1080×1350)</option>
      <option value="landscape">عرضي (1350×1080)</option>
    </select>

    <div class="row">
      <button id="pngBtn" class="sec">⬇️ PNG</button>
      <button id="mp4Btn">🎬 فيديو MP4</button>
    </div>
    <div id="exportStatus" class="status"></div>
  </div>

  <!-- ============ اللوحة اليسرى: المعاينة ============ -->
  <div class="card">
    <label>معاينة الاقتباس</label>
    <canvas id="quoteCanvas"></canvas>
    <div class="quote-preview" id="quotePreview">لم يتم اختيار اقتباس بعد.</div>
  </div>
</div>

<script>
/* =========================================================
   1) إعداد PDF.js
========================================================= */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

const CMAP_URL   = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/';
const FONT_URL   = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/';

/* =========================================================
   2) استخراج النص من PDF (مع OCR احتياطي)
========================================================= */
async function extractTextFromPDF(file, onStatus) {
  const data = await file.arrayBuffer();

  let pdf;
  try {
    pdf = await pdfjsLib.getDocument({
      data,
      cMapUrl: CMAP_URL,
      cMapPacked: true,
      standardFontDataUrl: FONT_URL,
      useSystemFonts: true,
      // بعض الملفات العربية تحتاج هذا:
      disableFontFace: false,
    }).promise;
  } catch (e) {
    if (e.name === 'PasswordException') {
      throw new Error('الملف محمي بكلمة مرور. أزل الحماية ثم أعد المحاولة.');
    }
    throw new Error('تعذّر فتح الملف: ' + e.message);
  }

  let fullText = '';
  let ocrPages = 0;

  for (let i = 1; i <= pdf.numPages; i++) {
    onStatus(`⏳ معالجة الصفحة ${i} من ${pdf.numPages}...`);

    const page = await pdf.getPage(i);
    const textContent = await page.getTextContent({
      normalizeWhitespace: true,
      disableCombineTextItems: false,
    });

    // إعادة بناء النص مع الحفاظ على الأسطر
    let pageText = '';
    let lastY = null;
    for (const item of textContent.items) {
      if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) {
        pageText += '\n';
      }
      pageText += item.str;
      lastY = item.transform[5];
    }

    // إذا كانت الصفحة فارغة تقريبًا → OCR
    if (pageText.replace(/\s/g, '').length < 20) {
      ocrPages++;
      onStatus(`🔍 الصفحة ${i} مصوّرة — تشغيل OCR...`);

      const viewport = page.getViewport({ scale: 2.0 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');

      await page.render({ canvasContext: ctx, viewport }).promise;

      const { data: { text } } = await Tesseract.recognize(canvas, 'ara+eng', {
        logger: m => {
          if (m.status === 'recognizing text') {
            onStatus(`🔍 OCR الصفحة ${i}: ${Math.round(m.progress * 100)}%`);
          }
        }
      });
      pageText = text;
    }

    fullText += pageText.trim() + '\n\n';
  }

  if (ocrPages > 0) {
    fullText = `[تم تشغيل OCR على ${ocrPages} صفحة مصوّرة]\n\n` + fullText;
  }

  return fullText.trim();
}

/* =========================================================
   3) أنماط العرض (8 أنماط)
========================================================= */
const STYLES = [
  { id:'classic',  name:'كلاسيكي',  bg:'#f5f1e8', fg:'#1a1a1a', accent:'#8b6f47', font:'Georgia, serif' },
  { id:'dark',     name:'داكن',     bg:'#0f1115', fg:'#e8eaed', accent:'#6c8cff', font:'Segoe UI, sans-serif' },
  { id:'sunset',   name:'غروب',     bg:'linear-gradient(135deg,#ff6b6b,#feca57)', fg:'#ffffff', accent:'#ffffff', font:'Tahoma, sans-serif' },
  { id:'ocean',    name:'محيط',     bg:'linear-gradient(135deg,#1e3c72,#2a5298)', fg:'#ffffff', accent:'#7dd3fc', font:'Segoe UI, sans-serif' },
  { id:'forest',   name:'غابة',     bg:'linear-gradient(135deg,#134e4a,#065f46)', fg:'#ecfdf5', accent:'#34d399', font:'Georgia, serif' },
  { id:'royal',    name:'ملكي',     bg:'linear-gradient(135deg,#4c1d95,#7c3aed)', fg:'#f5f3ff', accent:'#fbbf24', font:'Georgia, serif' },
  { id:'paper',    name:'ورق',      bg:'#faf8f3', fg:'#2d2d2d', accent:'#d97706', font:'Times New Roman, serif' },
  { id:'midnight', name:'منتصف الليل', bg:'#000000', fg:'#fbbf24', accent:'#fbbf24', font:'Georgia, serif' },
];

let currentStyle = STYLES[0];
let currentQuote = '';
let currentAuthor = '';

/* =========================================================
   4) رسم الاقتباس على Canvas
========================================================= */
function drawQuote() {
  const canvas = document.getElementById('quoteCanvas');
  const ctx = canvas.getContext('2d');
  const orientation = document.getElementById('orientation').value;

  const W = orientation === 'portrait' ? 1080 : 1350;
  const H = orientation === 'portrait' ? 1350 : 1080;

  canvas.width = W;
  canvas.height = H;

  // خلفية
  const bg = currentStyle.bg;
  if (bg.startsWith('linear-gradient')) {
    const colors = bg.match(/#[a-f0-9]{6}/gi) || ['#000','#333'];
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, colors[0]);
    grad.addColorStop(1, colors[1] || colors[0]);
    ctx.fillStyle = grad;
  } else {
    ctx.fillStyle = bg;
  }
  ctx.fillRect(0, 0, W, H);

  // إطار
  const pad = 60;
  ctx.strokeStyle = currentStyle.accent;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 3;
  ctx.strokeRect(pad, pad, W - pad * 2, H - pad * 2);
  ctx.globalAlpha = 1;

  // علامة اقتباس
  ctx.fillStyle = currentStyle.accent;
  ctx.font = `bold ${Math.round(W * 0.16)}px Georgia, serif`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.globalAlpha = 0.3;
  ctx.fillText('"', W - pad - 20, pad + 10);
  ctx.globalAlpha = 1;

  // نص الاقتباس
  const text = currentQuote || 'اكتب أو اختر اقتباسًا...';
  const fontSize = Math.round(W * 0.052);
  ctx.font = `600 ${fontSize}px ${currentStyle.font}`;
  ctx.fillStyle = currentStyle.fg;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'rtl';

  const maxWidth = W - pad * 2 - 60;
  const lines = wrapText(ctx, text, maxWidth);
  const lineHeight = fontSize * 1.55;
  const totalHeight = lines.length * lineHeight;
  const startY = H / 2 - totalHeight / 2 + lineHeight / 2;

  lines.forEach((line, i) => {
    ctx.fillText(line, W / 2, startY + i * lineHeight);
  });

  // المؤلف
  if (currentAuthor) {
    const authorFont = Math.round(W * 0.032);
    ctx.font = `500 ${authorFont}px ${currentStyle.font}`;
    ctx.fillStyle = currentStyle.accent;
    ctx.textAlign = 'center';
    ctx.fillText('— ' + currentAuthor, W / 2, H - pad - authorFont * 1.5);
  }
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(/\s+/);
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

/* =========================================================
   5) OpenRouter - توليد الاقتباسات
========================================================= */
async function generateQuotes(text, apiKey, model, count) {
  const snippet = text.slice(0, 12000); // حماية من تجاوز الرموز

  const prompt = `أنت خبير في استخراج الاقتباسات الأدبية من الكتب.
استخرج ${count} اقتباسات مؤثرة وقصيرة (كل اقتباس لا يزيد عن 30 كلمة) من النص التالي.
أعد النتيجة بصيغة JSON فقط بدون أي شرح، بهذا الشكل:
[
  {"text": "نص الاقتباس", "author": "المؤلف أو المصدر"},
  ...
]

النص:
"""
${snippet}
"""`;

  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${apiKey}`,
      'Content-Type': 'application/json',
      'HTTP-Referer': location.origin,
      'X-Title': 'Smart Quotes App',
    },
    body: JSON.stringify({
      model: model,
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.7,
      max_tokens: 1500,
    }),
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(`API ${res.status}: ${err.error?.message || res.statusText}`);
  }

  const data = await res.json();
  let content = data.choices?.[0]?.message?.content || '';

  // تنظيف استجابة JSON المحتملة
  content = content.replace(/```json|```/g, '').trim();
  const start = content.indexOf('[');
  const end = content.lastIndexOf(']');
  if (start === -1 || end === -1) throw new Error('لم يتم العثور على اقتباسات في الرد.');
  content = content.slice(start, end + 1);

  try {
    return JSON.parse(content);
  } catch {
    throw new Error('تعذّر تحليل رد الموديل. جرّب موديلًا آخر.');
  }
}

/* =========================================================
   6) الواجهة والتفاعل
========================================================= */
const $ = id => document.getElementById(id);

function showStatus(el, msg, type = 'info') {
  el.textContent = msg;
  el.className = 'status ' + type;
}
function hideStatus(el) { el.className = 'status'; el.textContent = ''; }

// توليد أزرار الأنماط
const stylesGrid = $('stylesGrid');
STYLES.forEach((s, i) => {
  const btn = document.createElement('div');
  btn.className = 'style-btn' + (i === 0 ? ' active' : '');
  btn.textContent = s.name;
  btn.onclick = () => {
    currentStyle = s;
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    drawQuote();
  };
  stylesGrid.appendChild(btn);
});

// زر استخراج النص
$('extractBtn').onclick = async () => {
  const file = $('pdfFile').files[0];
  if (!file) return showStatus($('extractStatus'), 'اختر ملف PDF أولًا.', 'err');

  const btn = $('extractBtn');
  btn.disabled = true;
  showStatus($('extractStatus'), '⏳ جاري الاستخراج...', 'info');

  try {
    const text = await extractTextFromPDF(file, msg => {
      showStatus($('extractStatus'), msg, 'info');
    });
    $('bookText').value = text;
    showStatus($('extractStatus'), `✅ تم استخراج ${text.length} حرف.`, 'ok');
  } catch (e) {
    showStatus($('extractStatus'), '❌ ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
};

// مسح
$('clearBtn').onclick = () => {
  $('pdfFile').value = '';
  $('bookText').value = '';
  $('quotesList').innerHTML = '';
  $('quotePreview').textContent = 'لم يتم اختيار اقتباس بعد.';
  currentQuote = ''; currentAuthor = '';
  hideStatus($('extractStatus'));
  hideStatus($('genStatus'));
  drawQuote();
};

// توليد الاقتباسات
$('generateBtn').onclick = async () => {
  const text = $('bookText').value.trim();
  const apiKey = $('apiKey').value.trim();
  const model = $('model').value;
  const count = parseInt($('quoteCount').value) || 3;

  if (!text) return showStatus($('genStatus'), 'لا يوجد نص. استخرج من PDF أولًا.', 'err');
  if (!apiKey) return showStatus($('genStatus'), 'أدخل مفتاح OpenRouter.', 'err');

  const btn = $('generateBtn');
  btn.disabled = true;
  showStatus($('genStatus'), '⏳ جاري التوليد...', 'info');

  try {
    const quotes = await generateQuotes(text, apiKey, model, count);
    renderQuotes(quotes);
    showStatus($('genStatus'), `✅ تم توليد ${quotes.length} اقتباس.`, 'ok');
  } catch (e) {
    showStatus($('genStatus'), '❌ ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
};

function renderQuotes(quotes) {
  const list = $('quotesList');
  list.innerHTML = '';
  quotes.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'sec';
    btn.style.textAlign = 'right';
    btn.style.fontSize = '13px';
    btn.style.whiteSpace = 'normal';
    btn.style.lineHeight = '1.5';
    btn.textContent = (idx + 1) + '. ' + q.text;
    btn.onclick = () => {
      currentQuote = q.text;
      currentAuthor = q.author || '';
      $('quotePreview').textContent = q.text + (q.author ? ' — ' + q.author : '');
      drawQuote();
    };
    list.appendChild(btn);
  });

  // اختيار الأول تلقائيًا
  if (quotes[0]) {
    currentQuote = quotes[0].text;
    currentAuthor = quotes[0].author || '';
    $('quotePreview').textContent = currentQuote + (currentAuthor ? ' — ' + currentAuthor : '');
    drawQuote();
  }
}

// تغيير الاتجاه
$('orientation').onchange = drawQuote;

// تصدير PNG
$('pngBtn').onclick = () => {
  const canvas = $('quoteCanvas');
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'quote.png';
    a.click();
    URL.revokeObjectURL(url);
    showStatus($('exportStatus'), '✅ تم تنزيل الصورة.', 'ok');
  }, 'image/png');
};

// تصدير MP4 / WebM
$('mp4Btn').onclick = async () => {
  const canvas = $('quoteCanvas');

  if (!canvas.captureStream || typeof MediaRecorder === 'undefined') {
    return showStatus($('exportStatus'), '❌ متصفحك لا يدعم تسجيل الفيديو.', 'err');
  }

  // اختر أفضل صيغة مدعومة
  const candidates = [
    'video/mp4;codecs=avc1',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
  ];
  const mimeType = candidates.find(m => MediaRecorder.isTypeSupported(m));
  if (!mimeType) return showStatus($('exportStatus'), '❌ لا توجد صيغة فيديو مدعومة.', 'err');

  const stream = canvas.captureStream(30);
  const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 5_000_000 });
  const chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = mimeType.includes('mp4') ? 'quote.mp4' : 'quote.webm';
    a.click();
    URL.revokeObjectURL(url);
    showStatus($('exportStatus'), '✅ تم تنزيل الفيديو.', 'ok');
  };

  showStatus($('exportStatus'), '🎬 جاري التسجيل (5 ثوان)...', 'info');
  recorder.start();

  // حركة بسيطة: تكبير تدريجي للاقتباس لمدة 5 ثوان
  const originalQuote = currentQuote;
  const start = performance.now();
  const duration = 5000;

  function animate() {
    const t = Math.min((performance.now() - start) / duration, 1);
    // تأثير fade-in بسيط عبر تكرار الرسم
    drawQuote();
    if (t < 1) requestAnimationFrame(animate);
    else setTimeout(() => recorder.stop(), 200);
  }
  animate();
};

// رسم أولي
drawQuote();
</script>
</body>
</html>

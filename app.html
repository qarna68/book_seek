<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الاقتباسات">
<title>مستخرج الاقتباسات الذكي</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, 'SF Arabic', system-ui, sans-serif;
  background: #f8f9fa;
  color: #1a1a1a;
  padding: 16px;
  padding-top: max(16px, env(safe-area-inset-top));
  padding-bottom: max(16px, env(safe-area-inset-bottom));
  min-height: 100vh;
}
.hidden { display: none !important; }
h1 { font-size: 18px; text-align: center; margin-bottom: 16px; font-weight: 700; }

.field {
  width: 100%;
  padding: 12px 14px;
  font-size: 14px;
  border: 1px solid #cbd5e0;
  border-radius: 10px;
  background: #fff;
  margin-bottom: 10px;
  font-family: inherit;
  direction: rtl;
}
.field:focus { outline: 2px solid #2b6cb0; border-color: transparent; }

.row { display: flex; gap: 8px; margin-bottom: 10px; }
.btn {
  flex: 1;
  padding: 12px;
  font-size: 14px;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  color: #fff;
  font-family: inherit;
  cursor: pointer;
  transition: transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; }
.btn-dark { background: #4a5568; }
.btn-blue { background: #2b6cb0; }
.btn-purple { background: #805ad5; }
.btn-green { background: #2f855a; }
.btn-red { background: #c53030; }
.btn-gray { background: #718096; }

.status { text-align: center; font-size: 12px; color: #718096; padding: 8px; min-height: 30px; }
.status.ok { color: #2f855a; font-weight: 700; }
.status.err { color: #c53030; font-weight: 700; }

.quotes { margin-top: 12px; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.star { font-size: 24px; background: none; border: none; cursor: pointer; color: #a0aec0; padding: 0; line-height: 1; }
.star.on { color: #d69e2e; }
.q-num { font-weight: 700; font-size: 14px; color: #2b6cb0; }
.q-text { font-size: 15px; line-height: 1.9; text-align: right; color: #1a1a1a; margin-bottom: 12px; white-space: pre-wrap; }
.card-actions { display: flex; gap: 6px; }
.card-actions .btn { font-size: 12px; padding: 8px; }

.modal { position: fixed; inset: 0; background: #f8f9fa; z-index: 100; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); overflow-y: auto; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-head h2 { font-size: 18px; }
.filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
.filter-row .btn { padding: 10px; font-size: 13px; }

.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.9); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px; z-index: 200; transition: transform 0.3s; max-width: 90%; text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); }

.progress { background: #e2e8f0; border-radius: 8px; height: 6px; overflow: hidden; margin: 8px 0; }
.progress-bar { background: #2b6cb0; height: 100%; width: 0; transition: width 0.3s; }

.img-preview { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 16px; flex-direction: column; gap: 16px; }
.img-preview img { max-width: 100%; max-height: 70vh; border-radius: 12px; }
.img-preview .btn { max-width: 200px; }
</style>
</head>
<body>

<div id="main">
  <h1>✨ استخراج اقتباسات ذكي</h1>

  <input id="apiKey" class="field" type="password" placeholder="مفتاح OpenRouter (sk-or-v1-...)">
  <input id="bookName" class="field" type="text" placeholder="اسم الكتاب (اختياري)">
  <input id="authorName" class="field" type="text" placeholder="اسم المؤلف (اختياري)">

  <button id="pickPdfBtn" class="btn btn-dark" style="width:100%; margin-bottom:10px;">
    📕 اختيار ملف PDF
  </button>
  <input id="pdfInput" type="file" accept=".pdf" style="display:none;">

  <div class="row">
    <button id="countBtn" class="btn btn-gray">🔢 10 اقتباسات</button>
    <button id="libBtn" class="btn btn-purple">📚 المكتبة</button>
  </div>

  <button id="genBtn" class="btn btn-blue" style="width:100%;">استخراج ✨</button>

  <div id="status" class="status">ارفع ملف PDF للبدء</div>

  <div id="progressWrap" class="progress hidden">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <div id="quotes" class="quotes"></div>
</div>

<div id="library" class="modal hidden">
  <div class="modal-head">
    <h2>📚 مكتبة الاقتباسات</h2>
    <button onclick="closeLibrary()" style="background:none;border:none;font-size:16px;color:#2b6cb0;cursor:pointer;">إغلاق</button>
  </div>
  <div class="filter-row">
    <button id="filterAll" class="btn btn-purple">الكل</button>
    <button id="filterFav" class="btn btn-gray">⭐ المفضلة</button>
  </div>
  <div id="libCount" style="text-align:center;font-size:12px;color:#718096;margin-bottom:12px;"></div>
  <div id="libList"></div>
</div>

<div id="imgPreview" class="img-preview hidden">
  <img id="previewImg" alt="preview">
  <div class="row" style="width:100%;max-width:400px;">
    <button id="shareImgBtn" class="btn btn-blue">📤 مشاركة</button>
    <button onclick="closePreview()" class="btn btn-red">إغلاق</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
'use strict';

const STORAGE_KEY = 'quotes_library_v1';
const API_KEY_STORAGE = 'quotes_api_key';
const AUTHOR_STORAGE = 'quotes_author';

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let state = {
  pdfFile: null,
  pdfText: '',
  pdfName: '',
  authorName: '',
  quotes: [],
  quoteCount: 10,
  library: [],
  currentHeader: '',
  busy: false,
};

function loadLibrary() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    state.library = data ? JSON.parse(data) : [];
  } catch (e) { state.library = []; }
}

function saveLibrary() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.library)); } catch (e) {}
}

function toast(msg, ms) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms || 2200);
}

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

function showProgress(show, percent) {
  const wrap = document.getElementById('progressWrap');
  const bar = document.getElementById('progressBar');
  wrap.classList.toggle('hidden', !show);
  if (percent !== undefined) bar.style.width = percent + '%';
}

function loadApiKey() {
  try {
    const k = localStorage.getItem(API_KEY_STORAGE);
    if (k) document.getElementById('apiKey').value = k;
    const a = localStorage.getItem(AUTHOR_STORAGE);
    if (a) {
      document.getElementById('authorName').value = a;
      state.authorName = a;
    }
  } catch (e) {}
}

function saveApiKey(key) {
  try { localStorage.setItem(API_KEY_STORAGE, key); } catch (e) {}
}

function saveAuthor(a) {
  try { localStorage.setItem(AUTHOR_STORAGE, a); } catch (e) {}
}

async function extractPdfText(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const totalPages = pdf.numPages;
  const MAX = 30;
  let start = 1;
  if (totalPages > MAX) start = Math.floor(Math.random() * (totalPages - MAX)) + 1;
  const end = Math.min(start + MAX - 1, totalPages);

  let text = '';
  for (let i = start; i <= end; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(item => item.str).join(' ');
    text += `[صفحة ${i}]\n${pageText.trim()}\n\n`;
    showProgress(true, Math.round(((i - start + 1) / (end - start + 1)) * 100));
  }
  showProgress(false);
  return { text, totalPages };
}

function cleanPdfText(text) {
  text = text.replace(/[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]+/g, '');
  text = text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
  text = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '');
  text = text.replace(/[ \t]+/g, ' ');
  text = text.replace(/\n{3,}/g, '\n\n');
  return text.trim();
}

function cleanOutputText(text) {
  text = text.replace(/<unk>/g, '').replace(/\[UNK\]/g, '');
  if (text.includes('```')) text = text.replace(/```[a-zA-Z]*\n/g, '').replace(/```/g, '');
  text = text.replace(/[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]+/g, '');
  text = text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
  const lines = text.split('\n');
  const filtered = [];
  for (const line of lines) {
    const s = line.trim();
    if (!s) { filtered.push(''); continue; }
    const hasArabic = /[\u0600-\u06FF]/.test(s);
    const isMarker = /^\[?صفحة|^\d+\s*[\-\.\]\)]|^\d+$/.test(s);
    if (hasArabic || isMarker) filtered.push(line);
  }
  return filtered.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function parseQuotes(text) {
  text = text.trim();
  if (!text) return [];
  const parts = ('\n' + text).split(/\n(?=\s*\d+\s*[\.\-–—\)])/);
  const quotes = [];
  for (let p of parts) {
    p = p.trim();
    if (!p) continue;
    p = p.replace(/^\s*\d+\s*[\.\-–—\)]\s*/, '');
    if (p && p.length > 20) quotes.push(p);
  }
  if (quotes.length <= 1 && text.length > 400) {
    const chunks = text.split(/\n\n+/).map(c => c.trim()).filter(c => c);
    if (chunks.length > 1) return chunks;
  }
  return quotes.length ? quotes : [text];
}

function truncateAtLine(text, maxChars) {
  if (text.length <= maxChars) return text;
  const cut = text.lastIndexOf('\n', maxChars);
  return text.substring(0, cut > 0 ? cut : maxChars);
}

const MODELS = [
  'openai/gpt-oss-120b',
  'google/gemini-2.5-flash',
  'meta-llama/llama-3.3-70b-instruct',
  'qwen/qwen-2.5-72b-instruct',
];

async function callOpenRouter(apiKey, bookName, bookText, count) {
  const seed = Math.floor(Math.random() * 9000) + 1000;
  const prompt =
`أنت مساعد متخصص في استخراج الاقتباسات الحرفية من الكتب العربية.

تحذيرات مهمة جداً:
- النص المرفق قد يحتوي على رموز غريبة، أو أحرف صينية، أو <unk>.
- تجاهل تماماً أي محتوى غير عربي.
- اكتب بالعربية الفصحى فقط.

اسم الكتاب: ${bookName || 'غير مذكور'}
رمز التنويع: ${seed}

المطلوب: استخرج ${count} اقتباسات قصيرة وعميقة ومختلفة.

تعليمات الإخراج الصارمة:
1. ابدأ القائمة مباشرة بالاقتباس الأول.
2. عربي فقط — يمنع أي كلمة إنجليزية.
3. طابق النص حرفياً بدون اختلاق.
4. رقّم من 1 إلى ${count}.
5. اذكر رقم الصفحة بعد كل اقتباس بصيغة [صفحة X].

نص الكتاب:
${bookText}`;

  const errors = [];
  for (const model of MODELS) {
    setStatus(`(${model.split('/').pop()}) جاري الاتصال...`);
    try {
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + apiKey,
          'Content-Type': 'application/json',
          'HTTP-Referer': location.origin,
          'X-Title': 'Arabic Quotes Extractor'
        },
        body: JSON.stringify({
          model: model,
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.85,
          max_tokens: 2500,
        }),
      });

      if (res.status === 200) {
        const data = await res.json();
        let answer = data.choices?.[0]?.message?.content || '';
        answer = cleanOutputText(answer);
        const arabic = (answer.match(/[\u0600-\u06FF]/g) || []).length;
        if (arabic < 50) { errors.push(`${model}: مخرجات غير عربية`); continue; }
        return { text: answer, model: model };
      }

      const errData = await res.json().catch(() => ({}));
      const msg = errData.error?.message || `HTTP ${res.status}`;
      errors.push(`${model}: ${msg.substring(0, 100)}`);

      if ([429, 500, 502, 503].includes(res.status)) {
        await new Promise(r => setTimeout(r, 3000));
      }
    } catch (e) {
      errors.push(`${model}: ${e.message}`);
    }
  }
  throw new Error('فشلت جميع المحاولات:\n' + errors.join('\n'));
}

// ============== أدوات رسم الزخارف ==============
function drawDiamond(ctx, x, y, size, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - size);
  ctx.lineTo(x + size, y);
  ctx.lineTo(x, y + size);
  ctx.lineTo(x - size, y);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawOrnamentDivider(ctx, cx, y, width, color) {
  const half = width / 2;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  // خط يسار
  ctx.beginPath();
  ctx.moveTo(cx - half, y);
  ctx.lineTo(cx - 20, y);
  ctx.stroke();
  // خط يمين
  ctx.beginPath();
  ctx.moveTo(cx + 20, y);
  ctx.lineTo(cx + half, y);
  ctx.stroke();
  // معين في الوسط
  drawDiamond(ctx, cx, y, 8, color);
  // نقاط صغيرة على الجانبين
  drawDiamond(ctx, cx - half + 8, y, 3, color);
  drawDiamond(ctx, cx + half - 8, y, 3, color);
  ctx.restore();
}

function drawCornerOrnaments(ctx, W, H) {
  const color = 'rgba(60, 50, 35, 0.22)';
  const size = 30;
  const pad = 60;

  // 4 زوايا صغيرة
  const corners = [
    { x: pad, y: pad, sx: 1, sy: 1 },          // top-left
    { x: W - pad, y: pad, sx: -1, sy: 1 },     // top-right
    { x: pad, y: H - pad, sx: 1, sy: -1 },     // bottom-left
    { x: W - pad, y: H - pad, sx: -1, sy: -1 },// bottom-right
  ];

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  for (const c of corners) {
    // خط أفقي
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x + size * c.sx, c.y);
    ctx.stroke();
    // خط عمودي
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x, c.y + size * c.sy);
    ctx.stroke();
    // نقطة صغيرة عند التقاء
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(c.x + 6 * c.sx, c.y + 6 * c.sy, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ============== توليد الصورة (المحسّن) ==============
async function generateQuoteImage(rawText, bookName, authorName) {
  // 1) إزالة رقم الصفحة من نص الصورة
  let text = rawText.replace(/\s*\[صفحة\s*\d+\]\s*/g, ' ');
  // إزالة الأقواس المربعة الفارغة إن بقيت
  text = text.replace(/\[\s*\]/g, '');
  // تنظيف مسافات زائدة
  text = text.replace(/\s+/g, ' ').trim();

  const W = 1080, H = 1350;
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  // ===== 1) الخلفية الكريمية =====
  ctx.fillStyle = '#fdfaf2';
  ctx.fillRect(0, 0, W, H);

  // ===== 2) البروز الداخلي =====
  const edge = 130;
  const shadowColor = '60, 50, 35';
  let g = ctx.createLinearGradient(0, 0, 0, edge);
  g.addColorStop(0, `rgba(${shadowColor}, 0.12)`);
  g.addColorStop(1, `rgba(${shadowColor}, 0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, edge);

  g = ctx.createLinearGradient(0, H, 0, H - edge);
  g.addColorStop(0, `rgba(${shadowColor}, 0.12)`);
  g.addColorStop(1, `rgba(${shadowColor}, 0)`);
  ctx.fillStyle = g; ctx.fillRect(0, H - edge, W, edge);

  g = ctx.createLinearGradient(W, 0, W - edge, 0);
  g.addColorStop(0, `rgba(${shadowColor}, 0.12)`);
  g.addColorStop(1, `rgba(${shadowColor}, 0)`);
  ctx.fillStyle = g; ctx.fillRect(W - edge, 0, edge, H);

  g = ctx.createLinearGradient(0, 0, edge, 0);
  g.addColorStop(0, `rgba(${shadowColor}, 0.12)`);
  g.addColorStop(1, `rgba(${shadowColor}, 0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, edge, H);

  // ===== 3) الإطار الخارجي =====
  ctx.strokeStyle = 'rgba(60, 50, 35, 0.18)';
  ctx.lineWidth = 3;
  ctx.strokeRect(28, 28, W - 56, H - 56);

  // ===== 4) زوايا زخرفية =====
  drawCornerOrnaments(ctx, W, H);

  // ===== 5) علامة الاقتباس (أعلى يسار) =====
  ctx.direction = 'ltr';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#2b6cb0';
  ctx.font = 'bold 200px -apple-system, "SF Arabic", system-ui, sans-serif';
  ctx.fillText('\u201C', 60, 20);

  // ===== 6) فاصل زخرفي تحت علامة الاقتباس =====
  drawOrnamentDivider(ctx, W / 2, 260, 260, 'rgba(43, 108, 176, 0.55)');

  // ===== 7) حساب حجم الخط المتكيّف =====
  let fontSize = 64;
  if (text.length > 180) fontSize = 58;
  if (text.length > 280) fontSize = 52;
  if (text.length > 380) fontSize = 46;
  if (text.length > 480) fontSize = 42;

  const lineHeight = Math.round(fontSize * 1.7);
  ctx.direction = 'rtl';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#1a1a1a';
  ctx.font = `${fontSize}px -apple-system, "SF Arabic", system-ui, sans-serif`;

  const maxWidth = W - 200;
  const lines = wrapTextArabic(ctx, text, maxWidth);

  // ===== 8) التوسيط العمودي =====
  // نطاق النص: من y=320 إلى y=H-360
  const textTop = 330;
  const textBottom = H - 360;
  const totalTextHeight = lines.length * lineHeight;
  const availableHeight = textBottom - textTop;
  const startY = textTop + Math.max(0, (availableHeight - totalTextHeight) / 2);

  let y = startY;
  for (const line of lines) {
    if (y + lineHeight > textBottom + lineHeight) break;
    ctx.fillText(line, W - 100, y);
    y += lineHeight;
  }

  // ===== 9) فاصل زخرفي أسفل الاقتباس =====
  const bottomDividerY = Math.max(y + 40, H - 320);
  drawOrnamentDivider(ctx, W / 2, bottomDividerY, 200, 'rgba(60, 50, 35, 0.28)');

  // ===== 10) الكتاب والمؤلف (أسفل يسار) =====
  ctx.textAlign = 'left';
  ctx.direction = 'rtl';

  if (bookName) {
    ctx.fillStyle = '#4a5568';
    ctx.font = 'bold 28px -apple-system, "SF Arabic", system-ui, sans-serif';
    ctx.fillText('📖 ' + bookName, 90, H - 200);
  }

  if (authorName) {
    ctx.fillStyle = '#718096';
    ctx.font = '24px -apple-system, "SF Arabic", system-ui, sans-serif';
    ctx.fillText('✍ ' + authorName, 90, H - 155);
  }

  // ===== 11) العلامة المائية =====
  ctx.save();
  ctx.globalAlpha = 0.07;
  ctx.fillStyle = '#000';
  ctx.font = 'bold 34px -apple-system, system-ui, sans-serif';
  ctx.direction = 'ltr';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const watermarkPositions = [
    { x: W * 0.25, y: H * 0.22, rot: -22 },
    { x: W * 0.75, y: H * 0.42, rot: -22 },
    { x: W * 0.28, y: H * 0.62, rot: -22 },
    { x: W * 0.72, y: H * 0.82, rot: -22 },
  ];

  for (const p of watermarkPositions) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.fillText('تصميم / sab3-77', 0, 0);
    ctx.restore();
  }
  ctx.restore();

  return new Promise(resolve => {
    canvas.toBlob(blob => resolve(blob), 'image/png');
  });
}

function wrapTextArabic(ctx, text, maxWidth) {
  const lines = [];
  const paragraphs = text.split('\n');
  for (const para of paragraphs) {
    if (!para.trim()) { lines.push(''); continue; }
    const words = para.split(/\s+/);
    let current = '';
    for (const word of words) {
      const test = current ? current + ' ' + word : word;
      const w = ctx.measureText(test).width;
      if (w > maxWidth && current) {
        lines.push(current);
        current = word;
      } else {
        current = test;
      }
    }
    if (current) lines.push(current);
  }
  return lines;
}

// ============== عرض البطاقات ==============
function renderQuotes() {
  const container = document.getElementById('quotes');
  container.innerHTML = '';
  if (!state.quotes.length) return;

  const header = document.createElement('div');
  header.style.cssText = 'font-size:13px;color:#4a5568;text-align:right;padding:8px;margin-bottom:8px;line-height:1.7;';
  header.textContent = state.currentHeader;
  container.appendChild(header);

  state.quotes.forEach((quote, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const isFav = isFavorite(quote, state.pdfName);
    card.innerHTML = `
      <div class="card-head">
        <button class="star ${isFav ? 'on' : ''}" data-idx="${i}">${isFav ? '★' : '☆'}</button>
        <span class="q-num">❝ اقتباس ${i + 1}</span>
      </div>
      <div class="q-text">${escapeHtml(quote)}</div>
      <div class="card-actions">
        <button class="btn btn-green" data-action="copy" data-idx="${i}">📋 نسخ</button>
        <button class="btn btn-blue" data-action="share" data-idx="${i}">📤 مشاركة</button>
        <button class="btn btn-purple" data-action="image" data-idx="${i}">📸 صورة</button>
      </div>
    `;
    container.appendChild(card);
  });

  container.querySelectorAll('.star').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      toggleFavorite(state.quotes[idx], state.pdfName);
      renderQuotes();
    });
  });

  container.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      const action = btn.dataset.action;
      const text = state.quotes[idx];
      if (action === 'copy') copyQuote(text);
      else if (action === 'share') shareQuote(text);
      else if (action === 'image') showQuoteImage(text);
    });
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function copyQuote(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('✅ تم نسخ الاقتباس');
  } catch (e) { toast('❌ فشل النسخ'); }
}

async function shareQuote(text) {
  if (navigator.share) {
    try { await navigator.share({ text: text }); }
    catch (e) { if (e.name !== 'AbortError') copyQuote(text); }
  } else copyQuote(text);
}

async function showQuoteImage(text) {
  setStatus('جاري توليد الصورة...');
  try {
    const blob = await generateQuoteImage(text, state.pdfName, state.authorName);
    const url = URL.createObjectURL(blob);
    document.getElementById('previewImg').src = url;
    document.getElementById('imgPreview').classList.remove('hidden');
    document.getElementById('shareImgBtn').onclick = () => shareImage(blob);
    setStatus('تم توليد الصورة ✨', 'ok');
  } catch (e) {
    setStatus('فشل توليد الصورة', 'err');
    toast('❌ ' + e.message);
  }
}

function closePreview() {
  document.getElementById('imgPreview').classList.add('hidden');
}

async function shareImage(blob) {
  const file = new File([blob], 'quote.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); }
    catch (e) { if (e.name !== 'AbortError') toast('تعذرت المشاركة'); }
  } else {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'quote.png';
    a.click();
    toast('تم تحميل الصورة');
  }
}

function findQuote(text, book) {
  return state.library.find(q => q.text === text && q.book === book);
}

function isFavorite(text, book) {
  const q = findQuote(text, book);
  return !!(q && q.favorite);
}

function ensureInLibrary(text, book) {
  let q = findQuote(text, book);
  if (!q) {
    q = {
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
      text: text,
      book: book,
      favorite: false,
      date: new Date().toISOString(),
    };
    state.library.push(q);
    saveLibrary();
  }
  return q;
}

function toggleFavorite(text, book) {
  const q = ensureInLibrary(text, book);
  q.favorite = !q.favorite;
  saveLibrary();
}

function openLibrary() {
  document.getElementById('library').classList.remove('hidden');
  renderLibrary('all');
}

function closeLibrary() {
  document.getElementById('library').classList.add('hidden');
}

function renderLibrary(filter) {
  const list = document.getElementById('libList');
  list.innerHTML = '';
  let items = filter === 'fav'
    ? state.library.filter(q => q.favorite)
    : [...state.library];
  items.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  document.getElementById('libCount').textContent = items.length + ' اقتباس';
  document.getElementById('filterAll').className = 'btn ' + (filter === 'all' ? 'btn-purple' : 'btn-gray');
  document.getElementById('filterFav').className = 'btn ' + (filter === 'fav' ? 'btn-purple' : 'btn-gray');

  if (!items.length) {
    list.innerHTML = '<div style="text-align:center;color:#a0aec0;padding:30px;">لا توجد اقتباسات بعد</div>';
    return;
  }

  items.forEach(q => {
    const card = document.createElement('div');
    card.className = 'card';
    const dateStr = (q.date || '').substring(0, 10);
    card.innerHTML = `
      <div class="card-head">
        <button class="star ${q.favorite ? 'on' : ''}">${q.favorite ? '★' : '☆'}</button>
        <span style="font-size:11px;color:#4a5568;">📕 ${escapeHtml(q.book || '')} · ${dateStr}</span>
      </div>
      <div class="q-text">${escapeHtml(q.text)}</div>
      <div class="card-actions">
        <button class="btn btn-green" data-act="copy">📋 نسخ</button>
        <button class="btn btn-blue" data-act="share">📤 مشاركة</button>
        <button class="btn btn-purple" data-act="image">📸 صورة</button>
        <button class="btn btn-red" data-act="del">🗑</button>
      </div>
    `;
    card.querySelector('.star').addEventListener('click', () => {
      q.favorite = !q.favorite;
      saveLibrary();
      renderLibrary(filter);
    });
    card.querySelector('[data-act="copy"]').addEventListener('click', () => copyQuote(q.text));
    card.querySelector('[data-act="share"]').addEventListener('click', () => shareQuote(q.text));
    card.querySelector('[data-act="image"]').addEventListener('click', () => showQuoteImage(q.text));
    card.querySelector('[data-act="del"]').addEventListener('click', () => {
      if (confirm('حذف هذا الاقتباس؟')) {
        state.library = state.library.filter(x => x.id !== q.id);
        saveLibrary();
        renderLibrary(filter);
      }
    });
    list.appendChild(card);
  });
}

async function generate() {
  if (state.busy) return;
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { toast('❌ أدخل مفتاح OpenRouter'); return; }
  if (!state.pdfFile) { toast('❌ اختر ملف PDF أولاً'); return; }

  saveApiKey(apiKey);
  state.busy = true;
  const genBtn = document.getElementById('genBtn');
  genBtn.disabled = true;
  genBtn.textContent = '⏳ جاري الاستخراج...';

  try {
    setStatus('جاري قراءة PDF...');
    showProgress(true, 0);

    const { text } = await extractPdfText(state.pdfFile);
    let cleaned = cleanPdfText(text);
    cleaned = truncateAtLine(cleaned, 12000);

    if (!cleaned.trim()) {
      setStatus('لم يُعثر على نص في PDF', 'err');
      toast('❌ الملف قد يكون صوراً ممسوحة');
      return;
    }

    setStatus('جاري الاتصال بالنموذج...');
    const { text: answer, model } = await callOpenRouter(
      apiKey, state.pdfName, cleaned, state.quoteCount
    );

    const quotes = parseQuotes(answer);
    state.quotes = quotes;
    state.currentHeader = '📕 ' + state.pdfName + '\n🤖 ' + model.split('/').pop();

    quotes.forEach(q => ensureInLibrary(q, state.pdfName));

    renderQuotes();
    setStatus(`✓ ${quotes.length} اقتباسات — اضغط مجدداً للمزيد`, 'ok');
    genBtn.textContent = '🔄 اقتباسات جديدة';
  } catch (e) {
    console.error(e);
    setStatus('حدث خطأ', 'err');
    document.getElementById('quotes').innerHTML =
      '<div class="card" style="color:#c53030;text-align:center;padding:20px;">حدث خطأ:<br><br>' +
      escapeHtml(e.message) + '</div>';
  } finally {
    state.busy = false;
    genBtn.disabled = false;
    showProgress(false);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadLibrary();
  loadApiKey();

  document.getElementById('pickPdfBtn').addEventListener('click', () => {
    document.getElementById('pdfInput').click();
  });

  document.getElementById('pdfInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    state.pdfFile = file;
    state.pdfName = file.name;
    if (!document.getElementById('bookName').value) {
      document.getElementById('bookName').value = file.name.replace(/\.pdf$/i, '');
      state.pdfName = file.name.replace(/\.pdf$/i, '');
    }
    setStatus('✓ ' + file.name, 'ok');
    state.quotes = [];
    document.getElementById('quotes').innerHTML = '';
  });

  document.getElementById('genBtn').addEventListener('click', generate);

  document.getElementById('countBtn').addEventListener('click', function() {
    const opts = [5, 10, 15];
    let idx = opts.indexOf(state.quoteCount);
    idx = (idx + 1) % opts.length;
    state.quoteCount = opts[idx];
    this.textContent = '🔢 ' + state.quoteCount + ' اقتباسات';
  });

  document.getElementById('libBtn').addEventListener('click', openLibrary);
  document.getElementById('filterAll').addEventListener('click', () => renderLibrary('all'));
  document.getElementById('filterFav').addEventListener('click', () => renderLibrary('fav'));

  document.getElementById('bookName').addEventListener('input', (e) => {
    state.pdfName = e.target.value || 'كتاب';
  });

  document.getElementById('authorName').addEventListener('input', (e) => {
    state.authorName = e.target.value;
    saveAuthor(e.target.value);
  });
});

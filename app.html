<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الاقتباسات">
<title>مستخرج الاقتباسات الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'SF Arabic', system-ui, sans-serif; background: #f8f9fa; color: #1a1a1a; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); min-height: 100vh; }
.hidden { display: none !important; }
#errBanner { position: fixed; top: 0; left: 0; right: 0; background: #c53030; color: #fff; padding: 10px; font-size: 12px; z-index: 9999; display: none; white-space: pre-wrap; max-height: 200px; overflow-y: auto; font-family: monospace; direction: ltr; text-align: left; }
h1 { font-size: 18px; text-align: center; margin-bottom: 16px; font-weight: 700; }
.field { width: 100%; padding: 12px 14px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 10px; background: #fff; margin-bottom: 10px; font-family: inherit; direction: rtl; }
.field:focus { outline: 2px solid #2b6cb0; border-color: transparent; }
.row { display: flex; gap: 8px; margin-bottom: 10px; }
.btn { flex: 1; padding: 12px; font-size: 14px; font-weight: 700; border: none; border-radius: 10px; color: #fff; font-family: inherit; cursor: pointer; transition: transform 0.1s; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; }
.btn-dark { background: #4a5568; }
.btn-blue { background: #2b6cb0; }
.btn-purple { background: #805ad5; }
.btn-green { background: #2f855a; }
.btn-red { background: #c53030; }
.btn-gray { background: #718096; }
.btn-gold { background: #b8945a; }
.btn-pink { background: #b83280; }
.btn-teal { background: #2c7a7b; }
.btn-orange { background: #c05621; }
.btn-indigo { background: #4338ca; }
.status { text-align: center; font-size: 12px; color: #718096; padding: 8px; min-height: 30px; }
.status.ok { color: #2f855a; font-weight: 700; }
.status.err { color: #c53030; font-weight: 700; }
.quotes { margin-top: 12px; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.star { font-size: 24px; background: none; border: none; cursor: pointer; color: #a0aec0; padding: 0; line-height: 1; }
.star.on { color: #d69e2e; }
.q-num { font-weight: 700; font-size: 14px; color: #2b6cb0; }
.q-text { font-size: 15px; line-height: 1.9; text-align: right; color: #1a1a1a; margin-bottom: 12px; white-space: pre-wrap; }
.card-actions { display: flex; gap: 6px; }
.card-actions .btn { font-size: 12px; padding: 8px; }
.modal { position: fixed; inset: 0; background: #f8f9fa; z-index: 100; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); overflow-y: auto; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-head h2 { font-size: 18px; }
.filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
.filter-row .btn { padding: 10px; font-size: 13px; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.9); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px; z-index: 999; transition: transform 0.3s; max-width: 90%; text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); }
.progress { background: #e2e8f0; border-radius: 8px; height: 6px; overflow: hidden; margin: 8px 0; }
.progress-bar { background: #2b6cb0; height: 100%; width: 0; transition: width 0.3s; }
.img-preview { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 12px; flex-direction: column; gap: 12px; overflow-y: auto; }
.img-preview img { max-width: 100%; max-height: 50vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }

/* ✅ شبكة أنماط موسّعة (16 نمط) */
.style-picker {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  width: 100%;
  max-width: 440px;
}
.style-chip {
  padding: 9px 4px; border-radius: 10px; font-size: 10.5px;
  border: 2px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.08); color: #fff;
  cursor: pointer; font-family: inherit; font-weight: 700;
  -webkit-appearance: none; appearance: none;
  min-height: 38px; line-height: 1.2;
}
.style-chip.active { background: #b8945a; border-color: #b8945a; color: #fff; box-shadow: 0 0 0 2px rgba(184,148,90,0.4); }
.style-chip:disabled { opacity: 0.5; cursor: wait; }

#editPanel { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
#editTextarea { width: 100%; height: 110px; padding: 12px; border-radius: 10px; border: 1px solid #4a5568; background: #1a202c; color: #fff; font-size: 15px; font-family: inherit; direction: rtl; line-height: 1.7; resize: vertical; }
.preview-actions { display: flex; gap: 8px; width: 100%; max-width: 440px; flex-wrap: wrap; justify-content: center; }
.preview-actions .btn { padding: 10px; font-size: 13px; flex: 1; min-width: 90px; }
.toggle-row { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; }

.toggle-btn {
  flex: 1; padding: 12px 6px; border-radius: 10px;
  border: 2px solid #718096; background: rgba(255,255,255,0.1);
  color: #cbd5e0; font-family: inherit; font-size: 12px; font-weight: 700;
  cursor: pointer; -webkit-appearance: none; appearance: none;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(255,255,255,0.2);
  transition: all 0.15s; position: relative; z-index: 10;
  min-height: 48px; min-width: 100px;
}
.toggle-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.2); }
.toggle-btn.on { background: #2f855a; border-color: #2f855a; color: #fff; box-shadow: 0 0 0 2px rgba(47,133,90,0.3); }
.toggle-btn.off { background: #718096; border-color: #718096; color: #fff; }
.toggle-btn:disabled { opacity: 0.5; }

.video-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 400; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
.video-box { background: #1a202c; color: #fff; padding: 20px; border-radius: 16px; max-width: 420px; width: 100%; text-align: center; }
.video-box h3 { font-size: 16px; margin-bottom: 12px; }
.video-box p { font-size: 13px; opacity: 0.8; margin-bottom: 16px; line-height: 1.7; }
.video-style-info { margin: 8px 0 12px; font-size: 12.5px; opacity: 0.9; color: #b8945a; font-weight: 700; }
.video-progress { background: rgba(255,255,255,0.1); border-radius: 10px; height: 10px; overflow: hidden; margin: 16px 0; }
.video-progress-bar { background: linear-gradient(90deg, #b83280, #b8945a); height: 100%; width: 0; transition: width 0.3s; }
.video-percent { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #b8945a; }
.video-status { font-size: 12px; opacity: 0.7; }
#videoPlayer { width: 100%; max-height: 50vh; border-radius: 12px; margin-bottom: 14px; background: #000; }
#videoFallback { width: 100%; max-height: 50vh; border-radius: 12px; margin-bottom: 14px; object-fit: contain; }
.video-hint { font-size: 11px; opacity: 0.75; margin-top: 14px; line-height: 1.7; color: #cbd5e0; }
.video-btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.video-btn-row .btn { flex: 1; min-width: 110px; max-width: none; padding: 12px; font-size: 13px; }
.format-badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; margin-bottom: 10px; }
.format-badge.ok { background: rgba(47,133,90,0.2); color: #68d391; }
.format-badge.warn { background: rgba(214,158,46,0.2); color: #f6e05e; }
.duration-info { font-size: 12px; opacity: 0.75; margin-bottom: 12px; color: #cbd5e0; }
</style>
</head>
<body>

<div id="errBanner" onclick="this.style.display='none'">⚠️ خطأ: <span id="errText"></span></div>

<div id="main">
  <h1>✨ استخراج اقتباسات ذكي</h1>
  <input id="apiKey" class="field" type="password" placeholder="مفتاح OpenRouter (sk-or-v1-...)">
  <input id="bookName" class="field" type="text" placeholder="اسم الكتاب (اختياري)">
  <input id="authorName" class="field" type="text" placeholder="اسم المؤلف (اختياري)">
  <button id="pickPdfBtn" class="btn btn-dark" style="width:100%; margin-bottom:10px;">📕 اختيار ملف PDF</button>
  <input id="pdfInput" type="file" accept=".pdf" style="display:none;">
  <div class="row">
    <button id="countBtn" class="btn btn-gray">🔢 5</button>
    <button id="styleBtn" class="btn btn-gold">🎨 نسخي</button>
    <button id="libBtn" class="btn btn-purple">📚 المكتبة</button>
  </div>
  <button id="genBtn" class="btn btn-blue" style="width:100%;">استخراج ✨</button>
  <div id="status" class="status">ارفع ملف PDF للبدء</div>
  <div id="progressWrap" class="progress hidden"><div id="progressBar" class="progress-bar"></div></div>
  <div id="quotes" class="quotes"></div>
</div>

<div id="library" class="modal hidden">
  <div class="modal-head">
    <h2>📚 مكتبة الاقتباسات</h2>
    <button onclick="closeLibrary()" style="background:none;border:none;font-size:16px;color:#2b6cb0;cursor:pointer;">إغلاق</button>
  </div>
  <div class="filter-row">
    <button id="filterAll" class="btn btn-purple">الكل</button>
    <button id="filterFav" class="btn btn-gray">⭐ المفضلة</button>
  </div>
  <div id="libCount" style="text-align:center;font-size:12px;color:#718096;margin-bottom:12px;"></div>
  <div id="libList"></div>
</div>

<div id="imgPreview" class="img-preview hidden">
  <div class="style-picker">
    <button type="button" class="style-chip" data-style="naskh">📜 نسخي</button>
    <button type="button" class="style-chip" data-style="oriental">🌙 شرقي</button>
    <button type="button" class="style-chip" data-style="classic">🏛️ كلاسيكي</button>
    <button type="button" class="style-chip" data-style="modern">⚡ حديث</button>
    <button type="button" class="style-chip" data-style="islamic">🕌 إسلامي</button>
    <button type="button" class="style-chip" data-style="night">🌌 ليلي</button>
    <button type="button" class="style-chip" data-style="news">📰 خبر</button>
    <button type="button" class="style-chip" data-style="emerald">💡 نصيحة</button>
    <button type="button" class="style-chip" data-style="royal">👑 ملكي</button>
    <button type="button" class="style-chip" data-style="sunset">🌅 غروب</button>
    <button type="button" class="style-chip" data-style="ocean">🌊 محيطي</button>
    <button type="button" class="style-chip" data-style="rose">🌹 وردي</button>
    <button type="button" class="style-chip" data-style="desert">🏜️ صحراوي</button>
    <button type="button" class="style-chip" data-style="plum">🍇 عنابي</button>
    <button type="button" class="style-chip" data-style="lavender">💜 بنفسجي</button>
    <button type="button" class="style-chip" data-style="copper">🟤 نحاسي</button>
  </div>
  <img id="previewImg" alt="preview">
  <div id="editPanel" class="hidden">
    <textarea id="editTextarea" placeholder="عدّل النص هنا..."></textarea>
    <div class="toggle-row">
      <button type="button" id="toggleQuoteBtn" class="toggle-btn on">❝ علامة</button>
      <button type="button" id="toggleBookBtn" class="toggle-btn on">📖 الكتاب</button>
      <button type="button" id="toggleAuthorBtn" class="toggle-btn on">✍ المؤلف</button>
    </div>
  </div>
  <div class="preview-actions">
    <button type="button" id="editQuoteBtn" class="btn btn-purple">✏️ تعديل</button>
    <button type="button" id="formatBtn" class="btn btn-indigo">📱 طولي</button>
    <button type="button" id="durationBtn" class="btn btn-teal">⏱️ 10 ث</button>
    <button type="button" id="animationBtn" class="btn btn-orange">✍️ كلمة</button>
    <button type="button" id="videoBtn" class="btn btn-pink">🎬 فيديو</button>
    <button type="button" id="regenBtn" class="btn btn-green hidden">🎨 توليد</button>
    <button type="button" id="shareImgBtn" class="btn btn-blue">📤 مشاركة</button>
    <button type="button" onclick="closePreview()" class="btn btn-red">إغلاق</button>
  </div>
</div>

<div id="videoOverlay" class="video-overlay hidden">
  <div class="video-box">
    <h3>🎬 جاري توليد الفيديو...</h3>
    <div id="videoStyleInfo" class="video-style-info"></div>
    <p id="videoDurationInfo" class="duration-info"></p>
    <div class="video-percent" id="videoPercent">0%</div>
    <div class="video-progress"><div class="video-progress-bar" id="videoProgressBar"></div></div>
    <div class="video-status" id="videoStatus">بدء...</div>
  </div>
</div>

<div id="videoPreview" class="video-overlay hidden">
  <div class="video-box">
    <h3>🎬 الفيديو جاهز</h3>
    <div id="formatBadge" class="format-badge ok"></div>
    <video id="videoPlayer" controls playsinline style="display:none;"></video>
    <img id="videoFallback" alt="preview" style="display:none;">
    <div class="video-btn-row">
      <button type="button" id="shareVideoBtn" class="btn btn-blue">📤 مشاركة</button>
      <button type="button" id="downloadVideoBtn" class="btn btn-gold">💾 حفظ في الملفات</button>
      <button type="button" id="closeVideoBtn" class="btn btn-red">إغلاق</button>
    </div>
    <p class="video-hint" id="videoHint"></p>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
function showErr(msg) {
  try {
    document.getElementById('errText').textContent = String(msg).substring(0, 500);
    document.getElementById('errBanner').style.display = 'block';
  } catch (e) {}
}
window.addEventListener('error', function(ev) { showErr((ev.message || 'unknown') + ' @ ' + (ev.filename || '') + ':' + (ev.lineno || '')); });
window.addEventListener('unhandledrejection', function(ev) { showErr('Promise: ' + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason)); });

'use strict';

let pdfjsReady = false;
try {
  if (typeof pdfjsLib !== 'undefined' && pdfjsLib.GlobalWorkerOptions) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfjsReady = true;
  }
} catch (e) { showErr('pdfjs init: ' + e.message); }

const STORAGE_KEY = 'quotes_library_v1';
const API_KEY_STORAGE = 'quotes_api_key';
const AUTHOR_STORAGE = 'quotes_author';
const STYLE_STORAGE = 'quotes_style';
const VARIANT_STORAGE = 'quotes_variant_index';
const DURATION_STORAGE = 'quotes_video_duration';
const ANIMATION_STORAGE = 'quotes_video_animation';
const FORMAT_STORAGE = 'quotes_image_format';

const STYLE_NAMES = {
  naskh: '📜 نسخي فاخر', oriental: '🌙 شرقي', classic: '🏛️ كلاسيكي', modern: '⚡ حديث',
  islamic: '🕌 إسلامي مزخرف', night: '🌌 ليلي بنجوم', news: '📰 خبر عاجل', emerald: '💡 نصيحة زمردي',
  royal: '👑 ملكي', sunset: '🌅 غروب', ocean: '🌊 محيطي', rose: '🌹 وردي',
  desert: '🏜️ صحراوي', plum: '🍇 عنابي', lavender: '💜 بنفسجي', copper: '🟤 نحاسي',
};
const STYLE_ORDER = [
  'naskh', 'oriental', 'classic', 'modern', 'islamic', 'night', 'news', 'emerald',
  'royal', 'sunset', 'ocean', 'rose', 'desert', 'plum', 'lavender', 'copper',
];

const DURATION_OPTIONS = [5, 10, 15, 20, 30];

const ANIM_WORD = 'word';
const ANIM_LINE = 'line';
const ANIM_FADE = 'fade';
const ANIMATION_OPTIONS = [ANIM_WORD, ANIM_LINE, ANIM_FADE];
const ANIMATION_LABELS = {
  [ANIM_WORD]: '✍️ كلمة',
  [ANIM_LINE]: '📝 سطر',
  [ANIM_FADE]: '✨ تدريجي',
};
const ANIMATION_NAMES = {
  [ANIM_WORD]: 'كلمة بكلمة',
  [ANIM_LINE]: 'سطر بسطر',
  [ANIM_FADE]: 'تدريجي كامل',
};

const FORMAT_PORTRAIT = 'portrait';
const FORMAT_LANDSCAPE = 'landscape';
const FORMAT_OPTIONS = [FORMAT_PORTRAIT, FORMAT_LANDSCAPE];
const FORMAT_LABELS = {
  [FORMAT_PORTRAIT]: '📱 طولي',
  [FORMAT_LANDSCAPE]: '🖼️ عرضي',
};
const FORMAT_NAMES = {
  [FORMAT_PORTRAIT]: 'طولي 9:16',
  [FORMAT_LANDSCAPE]: 'عرضي 16:9',
};

const FONT_FAMILY = "Amiri, 'Noto Naskh Arabic', 'Scheherazade New', Georgia, serif";
const FONT_FAMILY_B = "'Aref Ruqaa', Amiri, 'Scheherazade New', Georgia, serif";
const FONT_FAMILY_C = "'Scheherazade New', Amiri, Georgia, serif";

let variantCounter = 0;
try { variantCounter = parseInt(localStorage.getItem(VARIANT_STORAGE) || '0', 10); } catch (e) {}
function nextVariant(total) {
  variantCounter = (variantCounter + 1) % (total * 1000);
  try { localStorage.setItem(VARIANT_STORAGE, String(variantCounter)); } catch (e) {}
  return variantCounter % total;
}

let generateLock = false;
let generateId = 0;
let videoLock = false;

let state = {
  pdfFile: null, pdfText: '', pdfName: '', authorName: '',
  quotes: [], quoteCount: 5, library: [], currentHeader: '',
  busy: false, imageStyle: 'naskh',
  currentImageText: '', currentImageBlob: null,
  editMode: false, editedText: '',
  showQuote: true, showBook: true, showAuthor: true,
  currentVariantIdx: null,
  currentVideoBlob: null, currentVideoMime: '', currentVideoUrl: '',
  lastFrameDataUrl: '',
  videoDuration: 10,
  animationType: ANIM_WORD,
  imageFormat: FORMAT_PORTRAIT,
};

let fontsReady = false;
async function ensureFonts() {
  if (fontsReady) return;
  try {
    if (typeof document.fonts === 'undefined' || !document.fonts.load) { fontsReady = true; return; }
    await Promise.all([
      document.fonts.load('400 40px Amiri').catch(() => null),
      document.fonts.load('700 40px Amiri').catch(() => null),
      document.fonts.load('400 40px "Noto Naskh Arabic"').catch(() => null),
      document.fonts.load('700 40px "Noto Naskh Arabic"').catch(() => null),
      document.fonts.load('400 40px "Aref Ruqaa"').catch(() => null),
      document.fonts.load('700 40px "Aref Ruqaa"').catch(() => null),
      document.fonts.load('400 40px "Scheherazade New"').catch(() => null),
      document.fonts.load('700 40px "Scheherazade New"').catch(() => null),
    ]);
    try { await document.fonts.ready; } catch (e) {}
    await new Promise(r => setTimeout(r, 300));
    fontsReady = true;
  } catch (e) { fontsReady = true; }
}

function loadLibrary() { try { const d = localStorage.getItem(STORAGE_KEY); state.library = d ? JSON.parse(d) : []; } catch (e) { state.library = []; } }
function saveLibrary() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.library)); } catch (e) {} }
function toast(msg, ms) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms || 2200); }
function setStatus(t, c) { const el = document.getElementById('status'); el.textContent = t; el.className = 'status' + (c ? ' ' + c : ''); }
function showProgress(s, p) { const w = document.getElementById('progressWrap'); const b = document.getElementById('progressBar'); w.classList.toggle('hidden', !s); if (p !== undefined) b.style.width = p + '%'; }

function loadApiKey() {
  try {
    const k = localStorage.getItem(API_KEY_STORAGE); if (k) document.getElementById('apiKey').value = k;
    const a = localStorage.getItem(AUTHOR_STORAGE); if (a) { document.getElementById('authorName').value = a; state.authorName = a; }
    const s = localStorage.getItem(STYLE_STORAGE);
    if (s && STYLE_NAMES[s]) { state.imageStyle = s; document.getElementById('styleBtn').textContent = '🎨 ' + STYLE_NAMES[s].split(' ').slice(1).join(' '); }
    const d = parseInt(localStorage.getItem(DURATION_STORAGE) || '0', 10);
    if (DURATION_OPTIONS.includes(d)) { state.videoDuration = d; }
    const an = localStorage.getItem(ANIMATION_STORAGE);
    if (an && ANIMATION_OPTIONS.includes(an)) { state.animationType = an; }
    const fm = localStorage.getItem(FORMAT_STORAGE);
    if (fm && FORMAT_OPTIONS.includes(fm)) { state.imageFormat = fm; }
    updateDurationButton();
    updateAnimationButton();
    updateFormatButton();
  } catch (e) {}
}
function saveApiKey(k) { try { localStorage.setItem(API_KEY_STORAGE, k); } catch (e) {} }

async function extractPdfText(file) {
  if (!pdfjsReady) throw new Error('pdf.js لم يُحمّل');
  setStatus('جاري فتح PDF...');
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const totalPages = pdf.numPages;
  if (totalPages === 0) throw new Error('PDF فارغ');

  const TARGET = 30;
  let start = 1;
  if (totalPages > TARGET) {
    start = Math.floor(Math.random() * (totalPages - TARGET)) + 1;
  }

  const order = [];
  for (let i = start; i <= totalPages; i++) order.push(i);
  for (let i = 1; i < start; i++) order.push(i);

  const collected = [];
  let scannedPages = 0;

  for (let i = 0; i < order.length; i++) {
    if (collected.length >= TARGET) break;
    const p = order[i];
    scannedPages++;
    try {
      const page = await pdf.getPage(p);
      const c = await page.getTextContent();
      const raw = c.items.map(x => x.str || '').join(' ');
      const t = raw.replace(/\s+/g, ' ').trim();
      if (t.length > 3) collected.push({ page: p, text: t });
    } catch (e) {}
    showProgress(true, 5 + (collected.length / TARGET) * 90);
  }

  if (collected.length === 0) {
    showProgress(false);
    throw new Error(
      'هذا الـ PDF لا يحتوي على نص قابل للاستخراج.\n\n'
      + 'عدد الصفحات: ' + totalPages + '\n'
      + 'الصفحات المفحوصة: ' + scannedPages + '\n\n'
      + 'السبب المحتمل:\n'
      + '• الملف صور ممسوحة ضوئيًا (Scanned PDF)\n'
      + '• الملف محمي بكلمة مرور\n'
      + '• الملف لا يحتوي على نص حقيقي'
    );
  }

  collected.sort((a, b) => a.page - b.page);
  const text = collected.map(x => '[صفحة ' + x.page + ']\n' + x.text).join('\n\n');
  showProgress(false);
  return { text, totalPages, collectedPages: collected.length, scannedPages };
}

function cleanPdfText(text) {
  text = text.replace(/[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]+/g, '');
  text = text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
  text = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '');
  text = text.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n');
  return text.trim();
}

function cleanOutputText(text) {
  text = text.replace(/<unk>/g, '').replace(/\[UNK\]/g, '');
  if (text.includes('```')) text = text.replace(/```[a-zA-Z]*\n/g, '').replace(/```/g, '');
  text = text.replace(/[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]+/g, '');
  text = text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
  const lines = text.split('\n');
  const out = [];
  for (const line of lines) {
    const s = line.trim();
    if (!s) { out.push(''); continue; }
    if (/[\u0600-\u06FF]/.test(s) || /^\[?صفحة|^\d+\s*[\-\.\]\)]|^\d+$/.test(s)) out.push(line);
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function parseQuotes(text) {
  text = text.trim();
  if (!text) return [];
  const parts = ('\n' + text).split(/\n(?=\s*\d+\s*[\.\-–—\)])/);
  const quotes = [];
  for (let p of parts) {
    p = p.trim(); if (!p) continue;
    p = p.replace(/^\s*\d+\s*[\.\-–—\)]\s*/, '');
    if (p && p.length > 20) quotes.push(p);
  }
  if (quotes.length <= 1 && text.length > 400) {
    const chunks = text.split(/\n\n+/).map(c => c.trim()).filter(c => c);
    if (chunks.length > 1) return chunks;
  }
  return quotes.length ? quotes : [text];
}

function truncateAtLine(text, maxChars) {
  if (text.length <= maxChars) return text;
  const cut = text.lastIndexOf('\n', maxChars);
  return text.substring(0, cut > 0 ? cut : maxChars);
}

function prepareQuoteText(text) {
  let t = String(text || '');
  t = t.replace(/\s*\[صفحة\s*\d+\]\s*/g, ' ');
  t = t.replace(/\[\s*\]/g, ' ');
  t = t.replace(/[\s،؛:\.\!\?؟\u060C\u061B\u061F\u066A-\u066D]+$/g, '');
  t = t.replace(/\s+/g, ' ').trim();
  if (t.length) t = t + '.';
  return t;
}

  const errors = [];
  for (const model of MODELS) {
    setStatus(`(${model.split('/').pop()}) جاري الاتصال...`);
    try {

      if (res.status === 200) {

// ============== SVG Helpers ==============
function escapeXml(s) {
  return String(s).replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]));
}

// ✅ قياس نص موثوق عبر Canvas (أدق بكثير من SVG المخفي على iOS)
const _measureCanvas = document.createElement('canvas');
const _measureCtx = _measureCanvas.getContext('2d');
let _cachedFont = '';

function measureSvgTextWidth(text, fontSize, fontWeight, fontFamily) {
  const family = fontFamily || FONT_FAMILY;
  const weight = String(fontWeight || 700);
  const fontStr = `${weight} ${fontSize}px ${family}`;
  if (_cachedFont !== fontStr) {
    try { _measureCtx.font = fontStr; _cachedFont = fontStr; } catch (e) {}
  }
  let w = 0;
  try { w = _measureCtx.measureText(text).width; } catch (e) { w = 0; }
  if (!w || !isFinite(w) || w < 1) {
    // احتياطي: تقدير عربي محافظ
    w = text.length * fontSize * 0.62;
  }
  return w;
}

function wrapArabicText(text, maxWidth, fontSize, fontFamily) {
  const lines = [];
  const paragraphs = text.split('\n');
  for (const para of paragraphs) {
    if (!para.trim()) { lines.push(''); continue; }
    const words = para.split(/\s+/);
    let current = '';
    for (const word of words) {
      const test = current ? current + ' ' + word : word;
      const w = measureSvgTextWidth(test, fontSize, 700, fontFamily);
      if (w > maxWidth && current) { lines.push(current); current = word; }
      else { current = test; }
    }
    if (current) lines.push(current);
  }
  return lines;
}

// ✅ حدود آمنة داخل إطار النمط
function getFrameSafeBounds(W, H, config) {
  const fp = getFormatParams();
  const isSpecial = config.isModern || config.isNews;
  const topDivider = isSpecial ? fp.topDiv2 : fp.topDiv1;
  const bottomDivider = isSpecial ? fp.bottomDiv2 : fp.bottomDiv1;

  let maxFrameInset = 0;
  if (config.frames && config.frames.length) {
    for (const f of config.frames) {
      if (f.inset > maxFrameInset) maxFrameInset = f.inset;
    }
  }

  let sideMargin = Math.max(maxFrameInset + 55, 85);
  if (config.isModern) sideMargin = Math.max(sideMargin, 105);

  return {
    left: sideMargin,
    right: W - sideMargin,
    top: topDivider + 40,
    bottom: bottomDivider - 40,
  };
}

function computeOptimalLayout(text, W, H, config, variant) {
  const bounds = getFrameSafeBounds(W, H, config);
  const availW = Math.max(200, bounds.right - bounds.left);
  const availH = Math.max(200, bounds.bottom - bounds.top);

  const maxTextWidth = Math.floor(availW * 0.94);
  const availableHeight = Math.floor(availH * 0.96);

  const len = text.length;
  let fontSize;
  if (len < 120) fontSize = 70;
  else if (len < 180) fontSize = 62;
  else if (len < 260) fontSize = 56;
  else if (len < 360) fontSize = 50;
  else if (len < 480) fontSize = 44;
  else fontSize = 40;

  if (W > H) fontSize = Math.round(fontSize * 0.95);

  let lineHeight = Math.round(fontSize * 1.85);
  let lines = wrapArabicText(text, maxTextWidth, fontSize, variant.font);

  function anyLineOverflows(lns, fs) {
    for (const ln of lns) {
      const w = measureSvgTextWidth(ln, fs, 700, variant.font);
      if (w > maxTextWidth + 4) return true;
    }
    return false;
  }

  let safety = 0;
  while (safety < 80) {
    const tooTall = (lines.length * lineHeight) > availableHeight;
    const tooWide = anyLineOverflows(lines, fontSize);
    if (!tooTall && !tooWide) break;
    fontSize -= 2;
    if (fontSize <= 24) break;
    lineHeight = Math.round(fontSize * 1.85);
    lines = wrapArabicText(text, maxTextWidth, fontSize, variant.font);
    safety++;
  }

  safety = 0;
  while (lines.length < 4 && fontSize < 90 && safety < 20) {
    const nextFs = fontSize + 3;
    const testLines = wrapArabicText(text, maxTextWidth, nextFs, variant.font);
    if (anyLineOverflows(testLines, nextFs)) break;
    if (testLines.length * Math.round(nextFs * 1.85) > availableHeight) break;
    fontSize = nextFs;
    lineHeight = Math.round(fontSize * 1.85);
    lines = testLines;
    safety++;
  }

  const fp = getFormatParams();
  const isSpecial = config.isModern || config.isNews;
  const topDivider = isSpecial ? fp.topDiv2 : fp.topDiv1;
  const bottomDivider = isSpecial ? fp.bottomDiv2 : fp.bottomDiv1;

  return {
    fontSize, maxTextWidth, lines, lineHeight,
    topDivider, bottomDivider,
    availableHeight,
    bounds,
  };
}

function buildCornerSVG(cx, cy, dirX, dirY, size, color) {
  const L = size;
  let g = `<g stroke="${color}" fill="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">`;
  g += `<line x1="${cx}" y1="${cy}" x2="${cx + L*dirX}" y2="${cy}"/>`;
  g += `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy + L*dirY}"/>`;
  g += `<circle cx="${cx + L*dirX}" cy="${cy}" r="3"/>`;
  g += `<circle cx="${cx}" cy="${cy + L*dirY}" r="3"/>`;
  g += `<path d="M ${cx + 40*dirX} ${cy} C ${cx + 70*dirX} ${cy + 25*dirY}, ${cx + 100*dirX} ${cy + 10*dirY}, ${cx + 85*dirX} ${cy + 35*dirY}" fill="none"/>`;
  g += `<path d="M ${cx + 55*dirX} ${cy + 5*dirY} Q ${cx + 75*dirX} ${cy - 15*dirY} ${cx + 90*dirX} ${cy + 5*dirY} Q ${cx + 75*dirX} ${cy + 15*dirY} ${cx + 55*dirX} ${cy + 5*dirY} Z" stroke="none"/>`;
  g += `<path d="M ${cx} ${cy + 40*dirY} C ${cx + 25*dirX} ${cy + 70*dirY}, ${cx + 10*dirX} ${cy + 100*dirY}, ${cx + 35*dirX} ${cy + 85*dirY}" fill="none"/>`;
  g += `<path d="M ${cx + 5*dirX} ${cy + 55*dirY} Q ${cx - 15*dirX} ${cy + 75*dirY} ${cx + 5*dirX} ${cy + 90*dirY} Q ${cx + 15*dirX} ${cy + 75*dirY} ${cx + 5*dirX} ${cy + 55*dirY} Z" stroke="none"/>`;
  g += '</g>';
  return g;
}

function buildDividerSVG(cx, y, width, color) {
  if (!width) return '';
  const half = width / 2;
  let g = `<g stroke="${color}" fill="${color}" stroke-width="1.5">`;
  g += `<line x1="${cx - half}" y1="${y}" x2="${cx - 15}" y2="${y}"/>`;
  g += `<line x1="${cx + 15}" y1="${y}" x2="${cx + half}" y2="${y}"/>`;
  g += `<polygon points="${cx},${y-6} ${cx+6},${y} ${cx},${y+6} ${cx-6},${y}" stroke="none"/>`;
  g += `<polygon points="${cx-half-6},${y-3} ${cx-half},${y} ${cx-half-6},${y+3} ${cx-half-12},${y}" stroke="none"/>`;
  g += `<polygon points="${cx+half+6},${y-3} ${cx+half},${y} ${cx+half+6},${y+3} ${cx+half+12},${y}" stroke="none"/>`;
  g += '</g>';
  return g;
}

function buildKhatimPatternSVG(W, H, color, opacity) {
  const spacing = 110;
  let s = `<g stroke="${color}" fill="none" stroke-width="1.5" opacity="${opacity}">`;
  for (let y = -spacing; y < H + spacing; y += spacing) {
    for (let x = -spacing; x < W + spacing; x += spacing) {
      s += `<rect x="${x-32}" y="${y-32}" width="64" height="64"/>`;
      s += `<rect x="${x-32}" y="${y-32}" width="64" height="64" transform="rotate(45 ${x} ${y})"/>`;
      const ox = x + spacing/2, oy = y + spacing/2;
      s += `<rect x="${ox-32}" y="${oy-32}" width="64" height="64"/>`;
      s += `<rect x="${ox-32}" y="${oy-32}" width="64" height="64" transform="rotate(45 ${ox} ${oy})"/>`;
    }
  }
  s += `</g>`;
  return s;
}

function buildStarsLayerSVG(W, H, count) {
  let s = '<g>';
  for (let i = 0; i < count; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H * 0.9;
    const r = Math.random() * 2 + 0.8;
    const opacity = Math.random() * 0.6 + 0.3;
    s += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(1)}" fill="#ffffff" opacity="${opacity.toFixed(2)}"/>`;
  }
  s += '</g>';
  return s;
}

function buildDiamondPatternSVG(W, H, color, opacity) {
  const spacing = 130;
  let s = `<g stroke="${color}" fill="none" stroke-width="0.8" opacity="${opacity}">`;
  for (let y = 0; y < H + spacing; y += spacing) {
    for (let x = 0; x < W + spacing; x += spacing) {
      s += `<polygon points="${x},${y-22} ${x+22},${y} ${x},${y+22} ${x-22},${y}"/>`;
      const ox = x + spacing/2, oy = y + spacing/2;
      s += `<polygon points="${ox},${oy-15} ${ox+15},${oy} ${ox},${oy+15} ${ox-15},${oy}"/>`;
    }
  }
  s += `</g>`;
  return s;
}

function buildNewsBracketsSVG(W, H, color, thickness) {
  const isLandscape = W > H;
  const pad = isLandscape ? 100 : 130;
  const armLen = isLandscape ? 220 : 300;
  let s = `<g stroke="${color}" fill="none" stroke-width="${thickness}" stroke-linecap="square">`;
  s += `<line x1="${pad}" y1="${pad}" x2="${pad + armLen}" y2="${pad}"/>`;
  s += `<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${pad + armLen}"/>`;
  s += `<line x1="${W - pad}" y1="${H - pad}" x2="${W - pad - armLen}" y2="${H - pad}"/>`;
  s += `<line x1="${W - pad}" y1="${H - pad}" x2="${W - pad}" y2="${H - pad - armLen}"/>`;
  s += '</g>';
  return s;
}

function buildQuoteSVG(opts) {
  const { W, H, lines, fontSize, lineHeight, startY, topDivider, bottomDivider, bookName, authorName, config, variant, showQuote, showBook, showAuthor, textOpacity } = opts;
  const fp = getFormatParams();
  const op = (typeof textOpacity === 'number') ? textOpacity : 1;
  const NS = 'xmlns="http://www.w3.org/2000/svg"';
  const font = variant.font;
  const textColor = variant.textColor;
  const textShadow = variant.textShadow;
  const textHighlight = variant.textHighlight;
  const cx = W / 2;
  const widthScale = W / 1080;

  let s = `<svg ${NS} width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;

  s += `<defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      ${config.bgColors.map((c, i) => `<stop offset="${(i / (config.bgColors.length - 1) * 100).toFixed(1)}%" stop-color="${c}"/>`).join('')}
    </linearGradient>
    <radialGradient id="vgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="${config.vignette[0]}"/>
      <stop offset="100%" stop-color="${config.vignette[1]}"/>
    </radialGradient>
  </defs>`;

  s += `<rect width="${W}" height="${H}" fill="url(#bgGrad)"/>`;
  s += `<rect width="${W}" height="${H}" fill="url(#vgGrad)"/>`;

  if (config.khatimPattern) s += buildKhatimPatternSVG(W, H, config.khatimColor, 0.07);
  if (config.starsLayer) s += buildStarsLayerSVG(W, H, config.starsCount || 100);
  if (config.diamondPattern) s += buildDiamondPatternSVG(W, H, config.diamondColor, 0.06);

  if (config.stars && !config.starsLayer) {
    s += `<g fill="${config.starsColor}" opacity="0.18">`;
    for (let i = 0; i < 300; i++) {
      const x = (Math.random() * W).toFixed(0);
      const y = (Math.random() * H).toFixed(0);
      s += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
    s += `</g>`;
  }

  for (const f of config.frames) {
    s += `<rect x="${f.inset}" y="${f.inset}" width="${W - f.inset*2}" height="${H - f.inset*2}" fill="none" stroke="${f.color}" stroke-width="${f.width}"/>`;
  }

  if (config.cornerColor) {
    const c = config.cornerInset || 66;
    const cs = fp.cornerSize;
    s += buildCornerSVG(c, c, 1, 1, cs, config.cornerColor);
    s += buildCornerSVG(W - c, c, -1, 1, cs, config.cornerColor);
    s += buildCornerSVG(c, H - c, 1, -1, cs, config.cornerColor);
    s += buildCornerSVG(W - c, H - c, -1, -1, cs, config.cornerColor);
  }

  if (config.newsBrackets) {
    s += buildNewsBracketsSVG(W, H, config.bracketColor || '#1a1a1a', config.bracketThickness || 28);
  }

  const openG = op < 1 ? `<g opacity="${op.toFixed(3)}">` : '';
  const closeG = op < 1 ? '</g>' : '';

  s += openG;

  if (showQuote) {
    s += `<text x="${fp.quoteMarkX}" y="${fp.quoteMarkY}" font-family="Aref Ruqaa, Georgia, serif" font-weight="bold" font-size="${fp.quoteMarkSize}" fill="${config.quoteMarkColor}" text-anchor="start">&#8220;</text>`;
  }

  const topDivW = Math.round((config.topDividerWidth || 300) * widthScale);
  const bottomDivW = Math.round((config.bottomDividerWidth || 240) * widthScale);
  s += buildDividerSVG(cx, topDivider, topDivW, config.ornamentColor);

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line) continue;
    const baselineY = startY + i * lineHeight + fontSize * 0.85;
    const common = `font-family="${font}" font-weight="700" font-size="${fontSize}" text-anchor="middle" direction="rtl"`;
    s += `<text x="${cx + 2}" y="${baselineY + 3}" ${common} fill="${textShadow}">${escapeXml(line)}</text>`;
    s += `<text x="${cx - 1}" y="${baselineY - 1}" ${common} fill="${textHighlight}">${escapeXml(line)}</text>`;
    s += `<text x="${cx}" y="${baselineY}" ${common} fill="${textColor}">${escapeXml(line)}</text>`;
  }

  s += buildDividerSVG(cx, bottomDivider, bottomDivW, config.ornamentColor);

  if (showBook && bookName) {
    const bookText = '\u{1F4D6} \uFD3F ' + bookName + ' \uFD3E';
    const bookFontSize = W > H ? 32 : 36;
    s += `<text x="${cx}" y="${fp.bookY}" font-family="${FONT_FAMILY}" font-weight="700" font-size="${bookFontSize}" fill="${config.bookColor}" text-anchor="middle" direction="rtl">${escapeXml(bookText)}</text>`;
  }
  if (showAuthor && authorName) {
    const authorText = '\u270D ' + authorName;
    const authorFontSize = W > H ? 24 : 28;
    s += `<text x="${cx}" y="${fp.authorY}" font-family="${FONT_FAMILY}" font-weight="400" font-style="italic" font-size="${authorFontSize}" fill="${config.authorColor}" text-anchor="middle" direction="rtl">${escapeXml(authorText)}</text>`;
  }

  const wmPositions = [
    { x: W * 0.25, y: H * 0.16 },
    { x: W * 0.75, y: H * 0.34 },
    { x: W * 0.28, y: H * 0.56 },
    { x: W * 0.72, y: H * 0.76 },
  ];
  const wmFontSize = W > H ? 28 : 34;
  for (const p of wmPositions) {
    s += `<text transform="translate(${p.x.toFixed(0)} ${p.y.toFixed(0)}) rotate(-22)" font-family="${FONT_FAMILY}" font-weight="700" font-size="${wmFontSize}" fill="${config.watermarkColor}" opacity="0.12" text-anchor="middle" direction="rtl">تصميم / sab3-77</text>`;
  }

  s += closeG;
  s += `</svg>`;
  return s;
}

async function generateQuoteImage(rawText, bookName, authorName, style, forceVariantIdx) {
  await ensureFonts();
  const text = prepareQuoteText(rawText);
  const fp = getFormatParams();
  const W = fp.W, H = fp.H;
  const isLandscape = W > H;
  const config = STYLE_CONFIGS[style] || STYLE_CONFIGS.naskh;
  const totalVariants = config.variants.length;

  let variantIdx;
  if (typeof forceVariantIdx === 'number') variantIdx = forceVariantIdx % totalVariants;
  else if (typeof state.currentVariantIdx === 'number' && state.currentVariantIdx !== null) variantIdx = state.currentVariantIdx % totalVariants;
  else variantIdx = nextVariant(totalVariants);
  state.currentVariantIdx = variantIdx;
  const variant = config.variants[variantIdx];

  const layout = computeOptimalLayout(text, W, H, config, variant);
  const fontSize = layout.fontSize;
  const lines = layout.lines;
  const lineHeight = layout.lineHeight;
  const topDivider = layout.topDivider;
  const bottomDivider = layout.bottomDivider;
  const bounds = layout.bounds;

  // ✅ حساب startY داخل الحدود الآمنة
  const totalH = lines.length * lineHeight;
  const centerY = (bounds.top + bounds.bottom) / 2;
  let startY = centerY - totalH / 2;
  if (startY < bounds.top) startY = bounds.top;
  if (startY + totalH > bounds.bottom) startY = bounds.bottom - totalH;
  if (startY < bounds.top) startY = bounds.top;

  const cx = W / 2;
  let svg;
  if (config.isModern) {
    const qmX = isLandscape ? fp.quoteMarkXModern : 50;
    const qmY = isLandscape ? fp.quoteMarkYModern : 260;
    const qmSize = isLandscape ? fp.quoteMarkSizeModern : 280;

    svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
    svg += `<rect width="${W}" height="${H}" fill="#fefefe"/>`;
    svg += `<rect x="0" y="0" width="14" height="${H}" fill="#0f172a"/>`;
    svg += `<rect x="14" y="0" width="6" height="${H}" fill="#2b6cb0"/>`;
    if (state.showQuote) svg += `<text x="${qmX}" y="${qmY}" font-family="-apple-system, system-ui, sans-serif" font-weight="bold" font-size="${qmSize}" fill="#0f172a" text-anchor="start">&#8220;</text>`;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i]; if (!line) continue;
      const y = startY + i * lineHeight + fontSize * 0.85;
      svg += `<text x="${cx}" y="${y}" font-family="${variant.font}" font-weight="800" font-size="${fontSize}" fill="${variant.textColor}" text-anchor="middle" direction="rtl">${escapeXml(line)}</text>`;
    }
    const fallbackY = isLandscape ? H - 200 : H - 300;
    const lineY = Math.min(startY + totalH + 80, fallbackY);
    svg += `<line x1="${isLandscape ? 60 : 80}" y1="${lineY}" x2="${W - (isLandscape ? 70 : 100)}" y2="${lineY}" stroke="#0f172a" stroke-width="3"/>`;
    svg += `<circle cx="${W - (isLandscape ? 70 : 100)}" cy="${lineY}" r="8" fill="#2b6cb0"/>`;
    const bookFs = isLandscape ? 30 : 32;
    const authorFs = isLandscape ? 24 : 26;
    if (state.showBook && bookName) svg += `<text x="${cx}" y="${lineY + (isLandscape ? 50 : 60)}" font-family="-apple-system, ${FONT_FAMILY}" font-weight="700" font-size="${bookFs}" fill="#0f172a" text-anchor="middle" direction="rtl">📖 ${escapeXml(bookName)}</text>`;
    if (state.showAuthor && authorName) svg += `<text x="${cx}" y="${lineY + (isLandscape ? 95 : 110)}" font-family="-apple-system, ${FONT_FAMILY}" font-size="${authorFs}" fill="#64748b" text-anchor="middle" direction="rtl">✍ ${escapeXml(authorName)}</text>`;
    const wm = [{x:W*0.25,y:H*0.18},{x:W*0.75,y:H*0.36},{x:W*0.28,y:H*0.58},{x:W*0.72,y:H*0.78}];
    const wmFs = isLandscape ? 28 : 34;
    for (const p of wm) svg += `<text transform="translate(${p.x.toFixed(0)} ${p.y.toFixed(0)}) rotate(-22)" font-family="-apple-system, system-ui" font-weight="700" font-size="${wmFs}" fill="#0f172a" opacity="0.07" text-anchor="middle">sab3-77</text>`;
    svg += `</svg>`;
  } else {
    svg = buildQuoteSVG({ W, H, lines, fontSize, lineHeight, startY, topDivider, bottomDivider, bookName, authorName, config, variant, showQuote: state.showQuote, showBook: state.showBook, showAuthor: state.showAuthor });
  }

  const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const svgUrl = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = () => { URL.revokeObjectURL(svgUrl); reject(new Error('فشل تحميل SVG')); };
    img.src = svgUrl;
  });
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, 0, 0, W, H);
  URL.revokeObjectURL(svgUrl);
  return new Promise(resolve => canvas.toBlob(b => resolve(b), 'image/png'));
}

function svgToImage(svg) {
  return new Promise((resolve, reject) => {
    const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('SVG load fail')); };
    img.src = url;
  });
}

async function showQuoteImage(text, style) {
  if (generateLock) return;
  generateLock = true;
  const myId = ++generateId;
  document.querySelectorAll('.style-chip').forEach(c => c.disabled = true);
  setStatus('جاري توليد الصورة...');
  try {
    state.currentImageText = text;
    state.editedText = text;
    state.editMode = false;
    state.currentVariantIdx = null;
    const useStyle = style || state.imageStyle;
    const blob = await generateQuoteImage(state.editedText, state.pdfName, state.authorName, useStyle);
    if (myId !== generateId) return;
    state.currentImageBlob = blob;
    const url = URL.createObjectURL(blob);
    document.getElementById('previewImg').src = url;
    document.getElementById('previewImg').classList.remove('hidden');
    document.getElementById('editPanel').classList.add('hidden');
    document.getElementById('editQuoteBtn').classList.remove('hidden');
    document.getElementById('videoBtn').classList.remove('hidden');
    document.getElementById('durationBtn').classList.remove('hidden');
    document.getElementById('animationBtn').classList.remove('hidden');
    document.getElementById('formatBtn').classList.remove('hidden');
    document.getElementById('regenBtn').classList.add('hidden');
    document.getElementById('imgPreview').classList.remove('hidden');
    document.getElementById('shareImgBtn').onclick = () => shareImage(blob);
    document.querySelectorAll('.style-chip').forEach(c => c.classList.toggle('active', c.dataset.style === useStyle));
    setStatus('تم توليد الصورة ✨', 'ok');
  } catch (e) {
    if (myId === generateId) { setStatus('فشل توليد الصورة', 'err'); toast('❌ ' + e.message); }
  } finally {
    generateLock = false;
    document.querySelectorAll('.style-chip').forEach(c => c.disabled = false);
  }
}

  state.editMode = true;

  document.getElementById('previewImg').classList.add('hidden');
  document.getElementById('editPanel').classList.remove('hidden');
  document.getElementById('editQuoteBtn').classList.add('hidden');
  document.getElementById('videoBtn').classList.add('hidden');
  document.getElementById('durationBtn').classList.add('hidden');

function updateToggleUI() {
  const q = document.getElementById('toggleQuoteBtn');
  const b = document.getElementById('toggleBookBtn');
  const a = document.getElementById('toggleAuthorBtn');
  q.classList.toggle('on', state.showQuote); q.classList.toggle('off', !state.showQuote);
  b.classList.toggle('on', state.showBook); b.classList.toggle('off', !state.showBook);
  a.classList.toggle('on', state.showAuthor); a.classList.toggle('off', !state.showAuthor);
  q.textContent = (state.showQuote ? '❝ ' : '🚫 ') + 'علامة';
  b.textContent = (state.showBook ? '📖 ' : '🚫 ') + 'الكتاب';
  a.textContent = (state.showAuthor ? '✍ ' : '🚫 ') + 'المؤلف';
}

async function regenerateCurrent() {
  if (state.busy) return;
  state.busy = true;
  const newText = (document.getElementById('editTextarea').value || '').trim();
  if (!newText) { toast('❌ النص فارغ'); state.busy = false; return; }
  state.editedText = newText;
  setStatus('جاري إعادة التوليد...');
  const tQ = document.getElementById('toggleQuoteBtn');
  const tB = document.getElementById('toggleBookBtn');
  const tA = document.getElementById('toggleAuthorBtn');
  const rB = document.getElementById('regenBtn');
  tQ.disabled = true; tB.disabled = true; tA.disabled = true; rB.disabled = true;
  rB.textContent = '⏳ جاري...';
  try {
    const blob = await generateQuoteImage(state.editedText, state.pdfName, state.authorName, state.imageStyle);
    state.currentImageBlob = blob;
    const url = URL.createObjectURL(blob);
    document.getElementById('previewImg').src = url;
    document.getElementById('previewImg').classList.remove('hidden');
    document.getElementById('editPanel').classList.add('hidden');
    document.getElementById('editQuoteBtn').classList.remove('hidden');
    document.getElementById('videoBtn').classList.remove('hidden');
    document.getElementById('durationBtn').classList.remove('hidden');
    document.getElementById('animationBtn').classList.remove('hidden');
    document.getElementById('formatBtn').classList.remove('hidden');
    document.getElementById('regenBtn').classList.add('hidden');
    document.getElementById('shareImgBtn').onclick = () => shareImage(blob);
    state.editMode = false;
    setStatus('تم التوليد ✨', 'ok');
  } catch (e) { setStatus('فشل', 'err'); toast('❌ ' + e.message); }
  finally {
    tQ.disabled = false; tB.disabled = false; tA.disabled = false; rB.disabled = false;
    rB.textContent = '🎨 توليد';
    state.busy = false;
  }
}

function updateVideoProgress(percent, statusText) {
  document.getElementById('videoProgressBar').style.width = (percent * 100).toFixed(1) + '%';
  document.getElementById('videoPercent').textContent = Math.round(percent * 100) + '%';
  if (statusText) document.getElementById('videoStatus').textContent = statusText;
}

function pickBestMimeType() {
  const candidates = [
    'video/mp4;codecs=avc1.64001E',
    'video/mp4;codecs=avc1.4D401E',
    'video/mp4;codecs=avc1.42E01E',
    'video/mp4;codecs=h264',
    'video/mp4;codecs=avc1',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
  ];
  for (const c of candidates) {
    try { if (MediaRecorder.isTypeSupported(c)) return c; } catch (e) {}
  }
  return 'video/webm';
}

function canPlayVideoType(mimeType) {
  const v = document.createElement('video');
  const result = v.canPlayType(mimeType);
  return result === 'probably' || result === 'maybe';
}

async function generateQuoteVideo(rawText, style) {
  await ensureFonts();
  const text = prepareQuoteText(rawText);
  const fp = getFormatParams();
  const W = fp.W, H = fp.H;
  const config = STYLE_CONFIGS[style] || STYLE_CONFIGS.naskh;
  const variant = config.variants[0];

  const layout = computeOptimalLayout(text, W, H, config, variant);

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الاقتباسات">
<title>مستخرج الاقتباسات الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'SF Arabic', system-ui, sans-serif; background: #f8f9fa; color: #1a1a1a; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); min-height: 100vh; }
.hidden { display: none !important; }
#errBanner { position: fixed; top: 0; left: 0; right: 0; background: #c53030; color: #fff; padding: 10px; font-size: 12px; z-index: 9999; display: none; white-space: pre-wrap; max-height: 200px; overflow-y: auto; font-family: monospace; direction: ltr; text-align: left; }
h1 { font-size: 18px; text-align: center; margin-bottom: 16px; font-weight: 700; }
.field { width: 100%; padding: 12px 14px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 10px; background: #fff; margin-bottom: 10px; font-family: inherit; direction: rtl; }
.field:focus { outline: 2px solid #2b6cb0; border-color: transparent; }
.row { display: flex; gap: 8px; margin-bottom: 10px; }
.btn { flex: 1; padding: 12px; font-size: 14px; font-weight: 700; border: none; border-radius: 10px; color: #fff; font-family: inherit; cursor: pointer; transition: transform 0.1s; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; }
.btn-dark { background: #4a5568; }
.btn-blue { background: #2b6cb0; }
.btn-purple { background: #805ad5; }
.btn-green { background: #2f855a; }
.btn-red { background: #c53030; }
.btn-gray { background: #718096; }
.btn-gold { background: #b8945a; }
.btn-pink { background: #b83280; }
.btn-teal { background: #2c7a7b; }
.btn-orange { background: #c05621; }
.status { text-align: center; font-size: 12px; color: #718096; padding: 8px; min-height: 30px; }
.status.ok { color: #2f855a; font-weight: 700; }
.status.err { color: #c53030; font-weight: 700; }
.quotes { margin-top: 12px; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.star { font-size: 24px; background: none; border: none; cursor: pointer; color: #a0aec0; padding: 0; line-height: 1; }
.star.on { color: #d69e2e; }
.q-num { font-weight: 700; font-size: 14px; color: #2b6cb0; }
.q-text { font-size: 15px; line-height: 1.9; text-align: right; color: #1a1a1a; margin-bottom: 12px; white-space: pre-wrap; }
.card-actions { display: flex; gap: 6px; }
.card-actions .btn { font-size: 12px; padding: 8px; }
.modal { position: fixed; inset: 0; background: #f8f9fa; z-index: 100; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); overflow-y: auto; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-head h2 { font-size: 18px; }
.filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
.filter-row .btn { padding: 10px; font-size: 13px; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.9); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px; z-index: 999; transition: transform 0.3s; max-width: 90%; text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); }
.progress { background: #e2e8f0; border-radius: 8px; height: 6px; overflow: hidden; margin: 8px 0; }
.progress-bar { background: #2b6cb0; height: 100%; width: 0; transition: width 0.3s; }
.img-preview { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 12px; flex-direction: column; gap: 12px; overflow-y: auto; }
.img-preview img { max-width: 100%; max-height: 38vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.img-preview .btn { max-width: 200px; }
.style-picker { display: flex; gap: 6px; max-width: 100%; flex-wrap: wrap; justify-content: center; }
.style-chip { padding: 6px 10px; border-radius: 20px; font-size: 11px; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; font-family: inherit; }
.style-chip.active { background: #b8945a; border-color: #b8945a; font-weight: 700; }
.style-chip:disabled { opacity: 0.5; cursor: wait; }
#editPanel { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
#editTextarea { width: 100%; height: 110px; padding: 12px; border-radius: 10px; border: 1px solid #4a5568; background: #1a202c; color: #fff; font-size: 15px; font-family: inherit; direction: rtl; line-height: 1.7; resize: vertical; }
.preview-actions { display: flex; gap: 8px; width: 100%; max-width: 500px; flex-wrap: wrap; justify-content: center; }
.preview-actions .btn { padding: 10px; font-size: 13px; flex: 1; min-width: 90px; }
.toggle-row { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; }

.toggle-btn {
  flex: 1; padding: 12px 6px; border-radius: 10px;
  border: 2px solid #718096; background: rgba(255,255,255,0.1);
  color: #cbd5e0; font-family: inherit; font-size: 12px; font-weight: 700;
  cursor: pointer; -webkit-appearance: none; appearance: none;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(255,255,255,0.2);
  transition: all 0.15s; position: relative; z-index: 10;
  min-height: 48px; min-width: 100px;
}
.toggle-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.2); }
.toggle-btn.on { background: #2f855a; border-color: #2f855a; color: #fff; box-shadow: 0 0 0 2px rgba(47,133,90,0.3); }
.toggle-btn.off { background: #718096; border-color: #718096; color: #fff; }
.toggle-btn:disabled { opacity: 0.5; }

/* ✅ شريط اتجاه الصورة */
.orientation-row { display: flex; gap: 6px; width: 100%; max-width: 420px; }
.orient-btn {
  flex: 1; padding: 10px 6px; border-radius: 10px;
  border: 2px solid #718096; background: rgba(255,255,255,0.05);
  color: #cbd5e0; font-family: inherit; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.orient-btn.on { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
.orient-btn:active { transform: scale(0.96); }

.video-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 400; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
.video-box { background: #1a202c; color: #fff; padding: 20px; border-radius: 16px; max-width: 400px; width: 100%; text-align: center; }
.video-box h3 { font-size: 16px; margin-bottom: 12px; }
.video-box p { font-size: 13px; opacity: 0.8; margin-bottom: 16px; line-height: 1.7; }
.video-progress { background: rgba(255,255,255,0.1); border-radius: 10px; height: 10px; overflow: hidden; margin: 16px 0; }
.video-progress-bar { background: linear-gradient(90deg, #b83280, #b8945a); height: 100%; width: 0; transition: width 0.3s; }
.video-percent { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #b8945a; }
.video-status { font-size: 12px; opacity: 0.7; }
#videoPlayer { width: 100%; max-height: 50vh; border-radius: 12px; margin-bottom: 14px; background: #000; }
#videoFallback { width: 100%; max-height: 50vh; border-radius: 12px; margin-bottom: 14px; object-fit: contain; }
.video-hint { font-size: 11px; opacity: 0.75; margin-top: 14px; line-height: 1.7; color: #cbd5e0; }
.video-btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.video-btn-row .btn { flex: 1; min-width: 110px; max-width: none; padding: 12px; font-size: 13px; }
.format-badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; margin-bottom: 10px; }
.format-badge.ok { background: rgba(47,133,90,0.2); color: #68d391; }
.format-badge.warn { background: rgba(214,158,46,0.2); color: #f6e05e; }
.duration-info { font-size: 12px; opacity: 0.75; margin-bottom: 12px; color: #cbd5e0; }
</style>
</head>
<body>

<div id="errBanner" onclick="this.style.display='none'">⚠️ خطأ: <span id="errText"></span></div>

<div id="main">
  <h1>✨ استخراج اقتباسات ذكي</h1>
  <input id="apiKey" class="field" type="password" placeholder="مفتاح OpenRouter (sk-or-v1-...)">
  <input id="bookName" class="field" type="text" placeholder="اسم الكتاب (اختياري)">
  <input id="authorName" class="field" type="text" placeholder="اسم المؤلف (اختياري)">
  <button id="pickPdfBtn" class="btn btn-dark" style="width:100%; margin-bottom:10px;">📕 اختيار ملف PDF</button>
  <input id="pdfInput" type="file" accept=".pdf" style="display:none;">
  <div class="row">
    <button id="countBtn" class="btn btn-gray">🔢 5</button>
    <button id="styleBtn" class="btn btn-gold">🎨 نسخي</button>
    <button id="libBtn" class="btn btn-purple">📚 المكتبة</button>
  </div>
  <button id="genBtn" class="btn btn-blue" style="width:100%;">استخراج ✨</button>
  <div id="status" class="status">ارفع ملف PDF للبدء</div>
  <div id="progressWrap" class="progress hidden"><div id="progressBar" class="progress-bar"></div></div>
  <div id="quotes" class="quotes"></div>
</div>

<div id="library" class="modal hidden">
  <div class="modal-head">
    <h2>📚 مكتبة الاقتباسات</h2>
    <button onclick="closeLibrary()" style="background:none;border:none;font-size:16px;color:#2b6cb0;cursor:pointer;">إغلاق</button>
  </div>
  <div class="filter-row">
    <button id="filterAll" class="btn btn-purple">الكل</button>
    <button id="filterFav" class="btn btn-gray">⭐ المفضلة</button>
  </div>
  <div id="libCount" style="text-align:center;font-size:12px;color:#718096;margin-bottom:12px;"></div>
  <div id="libList"></div>
</div>

<div id="imgPreview" class="img-preview hidden">
  <div class="style-picker">
    <button type="button" class="style-chip" data-style="naskh">📜 نسخي</button>
    <button type="button" class="style-chip" data-style="oriental">🌙 شرقي</button>
    <button type="button" class="style-chip" data-style="classic">🏛️ كلاسيكي</button>
    <button type="button" class="style-chip" data-style="modern">⚡ حديث</button>
    <button type="button" class="style-chip" data-style="islamic">🕌 إسلامي</button>
    <button type="button" class="style-chip" data-style="night">🌌 ليلي</button>
    <button type="button" class="style-chip" data-style="news">📰 خبر</button>
    <button type="button" class="style-chip" data-style="emerald">💡 نصيحة</button>
    <!-- ✅ الأنماط الجديدة -->
    <button type="button" class="style-chip" data-style="sunset">🌅 غروب</button>
    <button type="button" class="style-chip" data-style="ocean">🌊 محيط</button>
    <button type="button" class="style-chip" data-style="royal">👑 ملكي</button>
    <button type="button" class="style-chip" data-style="sand">🏜️ رملي</button>
  </div>

  <!-- ✅ شريط اتجاه الصورة -->
  <div class="orientation-row">
    <button type="button" id="orientPortrait" class="orient-btn on">📱 طولي</button>
    <button type="button" id="orientLandscape" class="orient-btn">🖥️ عرضي</button>
  </div>

  <img id="previewImg" alt="preview">
  <div id="editPanel" class="hidden">
    <textarea id="editTextarea" placeholder="عدّل النص هنا..."></textarea>
    <div class="toggle-row">
      <button type="button" id="toggleQuoteBtn" class="toggle-btn on">❝ علامة</button>
      <button type="button" id="toggleBookBtn" class="toggle-btn on">📖 الكتاب</button>
      <button type="button" id="toggleAuthorBtn" class="toggle-btn on">✍ المؤلف</button>
    </div>
  </div>
  <div class="preview-actions">
    <button type="button" id="editQuoteBtn" class="btn btn-purple">✏️ تعديل</button>
    <button type="button" id="durationBtn" class="btn btn-teal">⏱️ 10 ث</button>
    <button type="button" id="animationBtn" class="btn btn-orange">✍️ كلمة</button>
    <button type="button" id="videoBtn" class="btn btn-pink">🎬 فيديو</button>
    <button type="button" id="regenBtn" class="btn btn-green hidden">🎨 توليد</button>
    <button type="button" id="saveBothBtn" class="btn btn-gold">📐 حفظ الاثنين</button>
    <button type="button" id="shareImgBtn" class="btn btn-blue">📤 مشاركة</button>
    <button type="button" onclick="closePreview()" class="btn btn-red">إغلاق</button>
  </div>
</div>

<div id="videoOverlay" class="video-overlay hidden">
  <div class="video-box">
    <h3>🎬 جاري توليد الفيديو...</h3>
    <p id="videoDurationInfo" class="duration-info"></p>
    <div class="video-percent" id="videoPercent">0%</div>
    <div class="video-progress"><div class="video-progress-bar" id="videoProgressBar"></div></div>
    <div class="video-status" id="videoStatus">بدء...</div>
  </div>
</div>

<div id="videoPreview" class="video-overlay hidden">
  <div class="video-box">
    <h3>🎬 الفيديو جاهز</h3>
    <div id="formatBadge" class="format-badge ok"></div>
    <video id="videoPlayer" controls playsinline style="display:none;"></video>
    <img id="videoFallback" alt="preview" style="display:none;">
    <div class="video-btn-row">
      <button type="button" id="shareVideoBtn" class="btn btn-blue">📤 مشاركة</button>
      <button type="button" id="downloadVideoBtn" class="btn btn-gold">💾 حفظ في الملفات</button>
      <button type="button" id="closeVideoBtn" class="btn btn-red">إغلاق</button>
    </div>
    <p class="video-hint" id="videoHint"></p>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
function showErr(msg) {
  try {
    document.getElementById('errText').textContent = String(msg).substring(0, 500);
    document.getElementById('errBanner').style.display = 'block';
  } catch (e) {}
}
window.addEventListener('error', function(ev) { showErr((ev.message || 'unknown') + ' @ ' + (ev.filename || '') + ':' + (ev.lineno || '')); });
window.addEventListener('unhandledrejection', function(ev) { showErr('Promise: ' + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason)); });

'use strict';

let pdfjsReady = false;
try {
  if (typeof pdfjsLib !== 'undefined' && pdfjsLib.GlobalWorkerOptions) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfjsReady = true;
  }
} catch (e) { showErr('pdfjs init: ' + e.message); }

const STORAGE_KEY = 'quotes_library_v1';
const API_KEY_STORAGE = 'quotes_api_key';
const AUTHOR_STORAGE = 'quotes_author';
const STYLE_STORAGE = 'quotes_style';
const VARIANT_STORAGE = 'quotes_variant_index';
const DURATION_STORAGE = 'quotes_video_duration';
const ANIMATION_STORAGE = 'quotes_video_animation';
const ORIENTATION_STORAGE = 'quotes_orientation';

const STYLE_NAMES = {
  naskh: '📜 نسخي فاخر', oriental: '🌙 شرقي', classic: '🏛️ كلاسيكي', modern: '⚡ حديث',
  islamic: '🕌 إسلامي مزخرف', night: '🌌 ليلي بنجوم', news: '📰 خبر عاجل', emerald: '💡 نصيحة زمردي',
  // ✅ أنماط جديدة
  sunset: '🌅 غروب ذهبي', ocean: '🌊 محيط عميق', royal: '👑 ملكي فاخر', sand: '🏜️ رملي دافئ',
};
const STYLE_ORDER = ['naskh', 'oriental', 'classic', 'modern', 'islamic', 'night', 'news', 'emerald', 'sunset', 'ocean', 'royal', 'sand'];

const DURATION_OPTIONS = [5, 10, 15, 20, 30];

const ANIM_WORD = 'word';
const ANIM_LINE = 'line';
const ANIM_FADE = 'fade';
const ANIMATION_OPTIONS = [ANIM_WORD, ANIM_LINE, ANIM_FADE];
const ANIMATION_LABELS = {
  [ANIM_WORD]: '✍️ كلمة',
  [ANIM_LINE]: '📝 سطر',
  [ANIM_FADE]: '✨ تدريجي',
};
const ANIMATION_NAMES = {
  [ANIM_WORD]: 'كلمة بكلمة',
  [ANIM_LINE]: 'سطر بسطر',
  [ANIM_FADE]: 'تدريجي كامل',
};

const FONT_FAMILY = "Amiri, 'Noto Naskh Arabic', 'Scheherazade New', Georgia, serif";
const FONT_FAMILY_B = "'Aref Ruqaa', Amiri, 'Scheherazade New', Georgia, serif";
const FONT_FAMILY_C = "'Scheherazade New', Amiri, Georgia, serif";

// ✅ أبعاد الصور
const SIZE_PORTRAIT = { W: 1080, H: 1920 };
const SIZE_LANDSCAPE = { W: 1920, H: 1080 };

let variantCounter = 0;
try { variantCounter = parseInt(localStorage.getItem(VARIANT_STORAGE) || '0', 10); } catch (e) {}
function nextVariant(total) {
  variantCounter = (variantCounter + 1) % (total * 1000);
  try { localStorage.setItem(VARIANT_STORAGE, String(variantCounter)); } catch (e) {}
  return variantCounter % total;
}

let generateLock = false;
let generateId = 0;
let videoLock = false;

let state = {
  pdfFile: null, pdfText: '', pdfName: '', authorName: '',
  quotes: [], quoteCount: 5, library: [], currentHeader: '',
  busy: false, imageStyle: 'naskh',
  currentImageText: '', currentImageBlob: null,
  editMode: false, editedText: '',
  showQuote: true, showBook: true, showAuthor: true,
  currentVariantIdx: null,
  currentVideoBlob: null, currentVideoMime: '', currentVideoUrl: '',
  lastFrameDataUrl: '',
  videoDuration: 10,
  animationType: ANIM_WORD,
  // ✅ جديد: اتجاه الصورة + تخزين مؤقت للنسختين
  orientation: 'portrait',
  imageBlobCache: { portrait: null, landscape: null },
};

let fontsReady = false;
async function ensureFonts() {
  if (fontsReady) return;
  try {
    if (typeof document.fonts === 'undefined' || !document.fonts.load) { fontsReady = true; return; }
    await Promise.all([
      document.fonts.load('400 40px Amiri').catch(() => null),
      document.fonts.load('700 40px Amiri').catch(() => null),
      document.fonts.load('400 40px "Noto Naskh Arabic"').catch(() => null),
      document.fonts.load('700 40px "Noto Naskh Arabic"').catch(() => null),
      document.fonts.load('400 40px "Aref Ruqaa"').catch(() => null),
      document.fonts.load('700 40px "Aref Ruqaa"').catch(() => null),
      document.fonts.load('400 40px "Scheherazade New"').catch(() => null),
      document.fonts.load('700 40px "Scheherazade New"').catch(() => null),
    ]);
    try { await document.fonts.ready; } catch (e) {}
    await new Promise(r => setTimeout(r, 300));
    fontsReady = true;
  } catch (e) { fontsReady = true; }
}

function loadLibrary() { try { const d = localStorage.getItem(STORAGE_KEY); state.library = d ? JSON.parse(d) : []; } catch (e) { state.library = []; } }
function saveLibrary() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.library)); } catch (e) {} }
function toast(msg, ms) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms || 2200); }
function setStatus(t, c) { const el = document.getElementById('status'); el.textContent = t; el.className = 'status' + (c ? ' ' + c : ''); }
function showProgress(s, p) { const w = document.getElementById('progressWrap'); const b = document.getElementById('progressBar'); w.classList.toggle('hidden', !s); if (p !== undefined) b.style.width = p + '%'; }

function loadApiKey() {
  try {
    const k = localStorage.getItem(API_KEY_STORAGE); if (k) document.getElementById('apiKey').value = k;
    const a = localStorage.getItem(AUTHOR_STORAGE); if (a) { document.getElementById('authorName').value = a; state.authorName = a; }
    const s = localStorage.getItem(STYLE_STORAGE);
    if (s && STYLE_NAMES[s]) { state.imageStyle = s; document.getElementById('styleBtn').textContent = '🎨 ' + STYLE_NAMES[s].split(' ').slice(1).join(' '); }
    const d = parseInt(localStorage.getItem(DURATION_STORAGE) || '0', 10);
    if (DURATION_OPTIONS.includes(d)) { state.videoDuration = d; }
    const an = localStorage.getItem(ANIMATION_STORAGE);
    if (an && ANIMATION_OPTIONS.includes(an)) { state.animationType = an; }
    const or = localStorage.getItem(ORIENTATION_STORAGE);
    if (or === 'portrait' || or === 'landscape') { state.orientation = or; }
    updateDurationButton();
    updateAnimationButton();
    updateOrientationUI();
  } catch (e) {}
}
function saveApiKey(k) { try { localStorage.setItem(API_KEY_STORAGE, k); } catch (e) {} }
function saveAuthor(a) { try { localStorage.setItem(AUTHOR_STORAGE, a); } catch (e) {} }
function saveStyle(s) { try { localStorage.setItem(STYLE_STORAGE, s); } catch (e) {} }
function saveDuration(d) { try { localStorage.setItem(DURATION_STORAGE, String(d)); } catch (e) {} }
function saveAnimation(a) { try { localStorage.setItem(ANIMATION_STORAGE, a); } catch (e) {} }
function saveOrientation(o) { try { localStorage.setItem(ORIENTATION_STORAGE, o); } catch (e) {} }

function updateDurationButton() {
  const btn = document.getElementById('durationBtn');

async function extractPdfText(file) {
  if (!pdfjsReady) throw new Error('pdf.js لم يُحمّل');
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const totalPages = pdf.numPages;
  const MAX = 30;
  let start = 1;
  if (totalPages > MAX) start = Math.floor(Math.random() * (totalPages - MAX)) + 1;
  const end = Math.min(start + MAX - 1, totalPages);
  let text = '';
  for (let i = start; i <= end; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(item => item.str).join(' ');
    text += `[صفحة ${i}]\n${pageText.trim()}\n\n`;
    showProgress(true, Math.round(((i - start + 1) / (end - start + 1)) * 100));
  }
  showProgress(false);
  return { text, totalPages };
}

function cleanPdfText(text) {
  text = text.replace(/[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]+/g, '');
  text = text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
  text = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '');
  text = text.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n');
  return text.trim();
}

function cleanOutputText(text) {
  text = text.replace(/<unk>/g, '').replace(/\[UNK\]/g, '');
  if (text.includes('```')) text = text.replace(/```[a-zA-Z]*\n/g, '').replace(/```/g, '');
  text = text.replace(/[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]+/g, '');
  text = text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
  const lines = text.split('\n');
  const out = [];
  for (const line of lines) {
    const s = line.trim();
    if (!s) { out.push(''); continue; }
    if (/[\u0600-\u06FF]/.test(s) || /^\[?صفحة|^\d+\s*[\-\.\]\)]|^\d+$/.test(s)) out.push(line);
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function parseQuotes(text) {
  text = text.trim();
  if (!text) return [];
  const parts = ('\n' + text).split(/\n(?=\s*\d+\s*[\.\-–—\)])/);
  const quotes = [];
  for (let p of parts) {
    p = p.trim(); if (!p) continue;
    p = p.replace(/^\s*\d+\s*[\.\-–—\)]\s*/, '');
    if (p && p.length > 20) quotes.push(p);
  }
  if (quotes.length <= 1 && text.length > 400) {
    const chunks = text.split(/\n\n+/).map(c => c.trim()).filter(c => c);
    if (chunks.length > 1) return chunks;
  }
  return quotes.length ? quotes : [text];
}

function truncateAtLine(text, maxChars) {
  if (text.length <= maxChars) return text;
  const cut = text.lastIndexOf('\n', maxChars);
  return text.substring(0, cut > 0 ? cut : maxChars);
}

function prepareQuoteText(text) {
  let t = String(text || '');
  t = t.replace(/\s*\[صفحة\s*\d+\]\s*/g, ' ');
  t = t.replace(/\[\s*\]/g, ' ');
  t = t.replace(/[\s،؛:\.\!\?؟\u060C\u061B\u061F\u066A-\u066D]+$/g, '');
  t = t.replace(/\s+/g, ' ').trim();
  if (t.length) t = t + '.';
  return t;
}

const MODELS = ['openai/gpt-oss-120b', 'google/gemini-2.5-flash', 'meta-llama/llama-3.3-70b-instruct'];

async function callOpenRouter(apiKey, bookName, bookText, count) {
  const seed = Math.floor(Math.random() * 9000) + 1000;
  const prompt = `أنت مساعد متخصص في استخراج الاقتباسات الفكرية من الكتب العربية.

تعليمات مهمة جداً:
- النص المرفق قد يحتوي على رموز غريبة أو أحرف صينية أو unk — تجاهلها.
- اكتب بالعربية الفصحى فقط.

اسم الكتاب: ${bookName || 'غير مذكور'}
رمز التنويع: ${seed}

⚠️ الأهم في هذه المهمة: أن يكون كل اقتباس **فقرة كاملة** تنقل فكرة متكاملة للقارئ.

الشروط:
1. كل اقتباس يجب أن يتكون من **3 إلى 5 جمل مترابطة** (40-90 كلمة).
2. الاقتباس يجب أن ينقل **فكرة كاملة** يفهمها القارئ بدون الرجوع للكتاب.
3. اختر مقاطع تبدأ بجملة تمهيدية وتنتهي بخاتمة أو نتيجة.
4. ركّز على الأفكار القوية: النفسية، الفلسفية، الاجتماعية، التطويرية.
5. عربي فقط، طابق النص حرفياً بدون اختلاق.

المطلوب: استخرج ${count} اقتباسات فكرية طويلة من النص المرفق.

تعليمات الإخراج:
- ابدأ القائمة مباشرة.
- رقّم من 1 إلى ${count}.
- ضع سطراً فارغاً بين كل اقتباسين.
- لا تكتب أي شيء آخر غير الاقتباسات.

نص الكتاب:
${bookText}`;
  const errors = [];
  for (const model of MODELS) {
    setStatus(`(${model.split('/').pop()}) جاري الاتصال...`);
    try {
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json', 'HTTP-Referer': location.origin, 'X-Title': 'Arabic Quotes Extractor' },
        body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], temperature: 0.85, max_tokens: 4000 }),
      });
      if (res.status === 200) {
        const data = await res.json();
        let answer = cleanOutputText(data.choices?.[0]?.message?.content || '');
        if ((answer.match(/[\u0600-\u06FF]/g) || []).length < 100) { errors.push(`${model}: غير عربية`); continue; }
        return { text: answer, model };
      }
      const errData = await res.json().catch(() => ({}));
      errors.push(`${model}: ${(errData.error?.message || 'HTTP ' + res.status).substring(0, 100)}`);
      if ([429, 500, 502, 503].includes(res.status)) await new Promise(r => setTimeout(r, 3000));
    } catch (e) { errors.push(`${model}: ${e.message}`); }
  }
  throw new Error('فشلت المحاولات:\n' + errors.join('\n'));
}

function escapeXml(s) {
  return String(s).replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]));
}

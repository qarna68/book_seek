<head>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'SF Arabic', system-ui, sans-serif; background: #f8f9fa; color: #1a1a1a; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); min-height: 100vh; }
.hidden { display: none !important; }
#errBanner { position: fixed; top: 0; left: 0; right: 0; background: #c53030; color: #fff; padding: 10px; font-size: 12px; z-index: 9999; display: none; white-space: pre-wrap; max-height: 200px; overflow-y: auto; font-family: monospace; direction: ltr; text-align: left; }
h1 { font-size: 18px; text-align: center; margin-bottom: 16px; font-weight: 700; }
.field { width: 100%; padding: 12px 14px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 10px; background: #fff; margin-bottom: 10px; font-family: inherit; direction: rtl; }
.field:focus { outline: 2px solid #2b6cb0; border-color: transparent; }
.row { display: flex; gap: 8px; margin-bottom: 10px; }
.btn { flex: 1; padding: 12px; font-size: 14px; font-weight: 700; border: none; border-radius: 10px; color: #fff; font-family: inherit; cursor: pointer; transition: transform 0.1s; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; }
.btn-dark { background: #4a5568; }
.btn-blue { background: #2b6cb0; }
.btn-purple { background: #805ad5; }

.btn-red { background: #c53030; }
.btn-gray { background: #718096; }
.btn-gold { background: #b8945a; }
.status { text-align: center; font-size: 12px; color: #718096; padding: 8px; min-height: 30px; }
.status.ok { color: #2f855a; font-weight: 700; }
.status.err { color: #c53030; font-weight: 700; }
.quotes { margin-top: 12px; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.star { font-size: 24px; background: none; border: none; cursor: pointer; color: #a0aec0; padding: 0; line-height: 1; }
.star.on { color: #d69e2e; }
.q-num { font-weight: 700; font-size: 14px; color: #2b6cb0; }
.q-text { font-size: 15px; line-height: 1.9; text-align: right; color: #1a1a1a; margin-bottom: 12px; white-space: pre-wrap; }

.filter-row { display: flex; gap: 8px; margin-bottom: 12px; }

.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.9); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px; z-index: 200; transition: transform 0.3s; max-width: 90%; text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); }
.progress { background: #e2e8f0; border-radius: 8px; height: 6px; overflow: hidden; margin: 8px 0; }
.progress-bar { background: #2b6cb0; height: 100%; width: 0; transition: width 0.3s; }
.img-preview { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 12px; flex-direction: column; gap: 12px; overflow-y: auto; }
.img-preview img { max-width: 100%; max-height: 58vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.img-preview .btn { max-width: 200px; }
.style-picker { display: flex; gap: 6px; max-width: 100%; flex-wrap: wrap; justify-content: center; }

.style-chip.active { background: #b8945a; border-color: #b8945a; font-weight: 700; }
</style>

<body>

<div id="errBanner" onclick="this.style.display='none'">⚠️ خطأ: <span id="errText"></span></div>

<div id="main">
  <h1>✨ استخراج اقتباسات ذكي</h1>
  <input id="apiKey" class="field" type="password" placeholder="مفتاح OpenRouter (sk-or-v1-...)">
  <input id="bookName" class="field" type="text" placeholder="اسم الكتاب (اختياري)">

  <div class="row">
    <button id="countBtn" class="btn btn-gray">🔢 10</button>

  </div>
  <button id="genBtn" class="btn btn-blue" style="width:100%;">استخراج ✨</button>

<div id="library" class="modal hidden">

    <h2>📚 مكتبة الاقتباسات</h2>

  </div>
  <div class="filter-row">
    <button id="filterAll" class="btn btn-purple">الكل</button>

  </div>

  <div id="libList"></div>
</div>

<div id="imgPreview" class="img-preview hidden">
  <div class="style-picker">
    <button class="style-chip" data-style="naskh">📜 نسخي فاخر</button>
    <button class="style-chip" data-style="oriental">🌙 شرقي</button>
    <button class="style-chip" data-style="classic">🏛️ كلاسيكي</button>
    <button class="style-chip" data-style="modern">⚡ حديث</button>
  </div>
  <img id="previewImg" alt="preview">
  <div class="row" style="width:100%;max-width:400px;">
    <button id="shareImgBtn" class="btn btn-blue">📤 مشاركة</button>
    <button onclick="closePreview()" class="btn btn-red">إغلاق</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ✅ عرض أي خطأ مباشرة على الصفحة
function showErr(msg) {
  try {
    document.getElementById('errText').textContent = String(msg).substring(0, 500);
    document.getElementById('errBanner').style.display = 'block';
  } catch (e) {}
}
window.addEventListener('error', function(ev) {
  showErr((ev.message || 'unknown') + ' @ ' + (ev.filename || '') + ':' + (ev.lineno || ''));
});
window.addEventListener('unhandledrejection', function(ev) {
  showErr('Promise: ' + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason));
});

'use strict';

// ✅ حماية pdfjsLib من الفشل
let pdfjsReady = false;
try {
  if (typeof pdfjsLib !== 'undefined' && pdfjsLib.GlobalWorkerOptions) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfjsReady = true;
  } else {
    showErr('pdf.js لم يُحمّل — تحقق من الإنترنت');
  }
} catch (e) { showErr('pdfjs init: ' + e.message); }

const STORAGE_KEY = 'quotes_library_v1';
const API_KEY_STORAGE = 'quotes_api_key';
const AUTHOR_STORAGE = 'quotes_author';
const STYLE_STORAGE = 'quotes_style';

const STYLE_NAMES = { naskh: '📜 نسخي فاخر', oriental: '🌙 شرقي', classic: '🏛️ كلاسيكي', modern: '⚡ حديث' };

const ARABIC_FONT_STACK = '"Amiri", "Noto Naskh Arabic", "Scheherazade New", Georgia, serif';

let state = {
  pdfFile: null, pdfText: '', pdfName: '', authorName: '',
  quotes: [], quoteCount: 10, library: [], currentHeader: '',
  busy: false, imageStyle: 'naskh',
  currentImageText: '', currentImageBlob: null,
};

let fontsReady = false;
let warmupDone = false;

async function ensureFonts() {
  if (fontsReady && warmupDone) return;
  try {
    if (typeof document.fonts === 'undefined' || !document.fonts.load) {
      fontsReady = true; warmupDone = true;
      return;
    }
    const tasks = [
      document.fonts.load('400 40px Amiri').catch(() => null),
      document.fonts.load('700 40px Amiri').catch(() => null),
      document.fonts.load('400 40px "Noto Naskh Arabic"').catch(() => null),
      document.fonts.load('700 40px "Noto Naskh Arabic"').catch(() => null),
      document.fonts.load('400 40px "Aref Ruqaa"').catch(() => null),
      document.fonts.load('700 40px "Aref Ruqaa"').catch(() => null),
      document.fonts.load('400 40px "Scheherazade New"').catch(() => null),
    ];
    await Promise.all(tasks);
    try { await document.fonts.ready; } catch (e) {}

    if (!warmupDone) {
      const wc = document.createElement('canvas');
      wc.width = 800; wc.height = 200;
      const wx = wc.getContext('2d');
      wx.direction = 'rtl';
      wx.textAlign = 'right';
      wx.textBaseline = 'top';
      wx.font = `700 40px ${ARABIC_FONT_STACK}`;
      const tests = [
        'الاستمرارية أهم من الشغف',
        'الحمد لله رب العالمين',
        'محمد عبد الله الرحمن الرحيم',
      ];
      for (const t of tests) {
        try { wx.fillText(t, 780, 40, 760); } catch (e) {}
        try { wx.measureText(t); } catch (e) {}
      }
      await new Promise(r => setTimeout(r, 400));
      warmupDone = true;
    }
    fontsReady = true;
  } catch (e) { console.warn('fonts', e); fontsReady = true; warmupDone = true; }
}

function loadLibrary() { try { const d = localStorage.getItem(STORAGE_KEY); state.library = d ? JSON.parse(d) : []; } catch (e) { state.library = []; } }
function saveLibrary() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.library)); } catch (e) {} }
function toast(msg, ms) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms || 2200); }
function setStatus(t, c) { const el = document.getElementById('status'); el.textContent = t; el.className = 'status' + (c ? ' ' + c : ''); }
function showProgress(s, p) { const w = document.getElementById('progressWrap'); const b = document.getElementById('progressBar'); w.classList.toggle('hidden', !s); if (p !== undefined) b.style.width = p + '%'; }

function loadApiKey() {
  try {
    const k = localStorage.getItem(API_KEY_STORAGE); if (k) document.getElementById('apiKey').value = k;
    const a = localStorage.getItem(AUTHOR_STORAGE); if (a) { document.getElementById('authorName').value = a; state.authorName = a; }
    const s = localStorage.getItem(STYLE_STORAGE);
    if (s && STYLE_NAMES[s]) { state.imageStyle = s; document.getElementById('styleBtn').textContent = '🎨 ' + STYLE_NAMES[s].split(' ').slice(1).join(' '); }
  } catch (e) {}
}
function saveApiKey(k) { try { localStorage.setItem(API_KEY_STORAGE, k); } catch (e) {} }
function saveAuthor(a) { try { localStorage.setItem(AUTHOR_STORAGE, a); } catch (e) {} }
function saveStyle(s) { try { localStorage.setItem(STYLE_STORAGE, s); } catch (e) {} }

async function extractPdfText(file) {
  if (!pdfjsReady) throw new Error('pdf.js لم يُحمّل');
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const totalPages = pdf.numPages;
  const MAX = 30;
  let start = 1;
  if (totalPages > MAX) start = Math.floor(Math.random() * (totalPages - MAX)) + 1;
  const end = Math.min(start + MAX - 1, totalPages);
  let text = '';
  for (let i = start; i <= end; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(item => item.str).join(' ');
    text += `[صفحة ${i}]\n${pageText.trim()}\n\n`;
    showProgress(true, Math.round(((i - start + 1) / (end - start + 1)) * 100));
  }
  showProgress(false);
  return { text, totalPages };
}

function cleanPdfText(text) {
  text = text.replace(/[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]+/g, '');
  text = text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
  text = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '');
  text = text.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n');
  return text.trim();
}

function cleanOutputText(text) {
  text = text.replace(/<unk>/g, '').replace(/\[UNK\]/g, '');
  if (text.includes('```')) text = text.replace(/```[a-zA-Z]*\n/g, '').replace(/```/g, '');
  text = text.replace(/[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]+/g, '');
  text = text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
  const lines = text.split('\n');
  const out = [];
  for (const line of lines) {
    const s = line.trim();
    if (!s) { out.push(''); continue; }
    if (/[\u0600-\u06FF]/.test(s) || /^\[?صفحة|^\d+\s*[\-\.\]\)]|^\d+$/.test(s)) out.push(line);
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function parseQuotes(text) {
  text = text.trim();
  if (!text) return [];
  const parts = ('\n' + text).split(/\n(?=\s*\d+\s*[\.\-–—\)])/);
  const quotes = [];
  for (let p of parts) {
    p = p.trim(); if (!p) continue;
    p = p.replace(/^\s*\d+\s*[\.\-–—\)]\s*/, '');
    if (p && p.length > 20) quotes.push(p);
  }
  if (quotes.length <= 1 && text.length > 400) {
    const chunks = text.split(/\n\n+/).map(c => c.trim()).filter(c => c);
    if (chunks.length > 1) return chunks;
  }
  return quotes.length ? quotes : [text];
}

function truncateAtLine(text, maxChars) {
  if (text.length <= maxChars) return text;
  const cut = text.lastIndexOf('\n', maxChars);
  return text.substring(0, cut > 0 ? cut : maxChars);
}

const MODELS = ['openai/gpt-oss-120b', 'google/gemini-2.5-flash', 'meta-llama/llama-3.3-70b-instruct'];

async function callOpenRouter(apiKey, bookName, bookText, count) {
  const seed = Math.floor(Math.random() * 9000) + 1000;
  const prompt = `أنت مساعد متخصص في استخراج الاقتباسات الحرفية من الكتب العربية.

تحذيرات مهمة:
- النص المرفق قد يحتوي على رموز غريبة أو أحرف صينية أو unk.
- تجاهل تماماً أي محتوى غير عربي.
- اكتب بالعربية الفصحى فقط.

اسم الكتاب: ${bookName || 'غير مذكور'}
رمز التنويع: ${seed}

المطلوب: استخرج ${count} اقتباسات قصيرة وعميقة ومختلفة.

تعليمات الإخراج الصارمة:
1. ابدأ القائمة مباشرة بالاقتباس الأول.
2. عربي فقط.
3. طابق النص حرفياً.
4. رقّم من 1 إلى ${count}.
5. اذكر رقم الصفحة بصيغة [صفحة X].

نص الكتاب:
${bookText}`;
  const errors = [];
  for (const model of MODELS) {
    setStatus(`(${model.split('/').pop()}) جاري الاتصال...`);
    try {
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json', 'HTTP-Referer': location.origin, 'X-Title': 'Arabic Quotes Extractor' },
        body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], temperature: 0.85, max_tokens: 2500 }),
      });
      if (res.status === 200) {
        const data = await res.json();
        let answer = cleanOutputText(data.choices?.[0]?.message?.content || '');
        if ((answer.match(/[\u0600-\u06FF]/g) || []).length < 50) { errors.push(`${model}: غير عربية`); continue; }
        return { text: answer, model };
      }
      const errData = await res.json().catch(() => ({}));
      errors.push(`${model}: ${(errData.error?.message || 'HTTP ' + res.status).substring(0, 100)}`);
      if ([429, 500, 502, 503].includes(res.status)) await new Promise(r => setTimeout(r, 3000));
    } catch (e) { errors.push(`${model}: ${e.message}`); }
  }
  throw new Error('فشلت المحاولات:\n' + errors.join('\n'));
}

// ============== أدوات الرسم ==============
function stripPageNumbers(text) {
  let t = text.replace(/\s*\[صفحة\s*\d+\]\s*/g, ' ').replace(/\[\s*\]/g, ' ');
  return t.replace(/\s+/g, ' ').trim();
}

function wrapText(ctx, text, maxWidth) {
  const lines = [];
  for (const para of text.split('\n')) {
    if (!para.trim()) { lines.push(''); continue; }
    const words = para.split(/\s+/);
    let current = '';
    for (const word of words) {
      const test = current ? current + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && current) { lines.push(current); current = word; }
      else current = test;
    }
    if (current) lines.push(current);
  }
  return lines;
}

function adaptiveFontSize(len, base, min) {
  if (len < 80) return base;
  if (len < 140) return base - 4;
  if (len < 220) return base - 10;
  if (len < 320) return base - 16;
  if (len < 420) return base - 22;
  return min;
}

function drawDiamond(ctx, cx, cy, size, color) {
  ctx.save(); ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy - size); ctx.lineTo(cx + size, cy);
  ctx.lineTo(cx, cy + size); ctx.lineTo(cx - size, cy);
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function drawFlourishCorner(ctx, cx, cy, dirX, dirY, size, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const L = size;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + L * dirX, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + L * dirY); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + L * dirX, cy, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy + L * dirY, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + 40 * dirX, cy);
  ctx.bezierCurveTo(cx + 70 * dirX, cy + 25 * dirY, cx + 100 * dirX, cy + 10 * dirY, cx + 85 * dirX, cy + 35 * dirY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + 55 * dirX, cy + 5 * dirY);
  ctx.quadraticCurveTo(cx + 75 * dirX, cy - 15 * dirY, cx + 90 * dirX, cy + 5 * dirY);
  ctx.quadraticCurveTo(cx + 75 * dirX, cy + 15 * dirY, cx + 55 * dirX, cy + 5 * dirY);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx, cy + 40 * dirY);
  ctx.bezierCurveTo(cx + 25 * dirX, cy + 70 * dirY, cx + 10 * dirX, cy + 100 * dirY, cx + 35 * dirX, cy + 85 * dirY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + 5 * dirX, cy + 55 * dirY);
  ctx.quadraticCurveTo(cx - 15 * dirX, cy + 75 * dirY, cx + 5 * dirX, cy + 90 * dirY);
  ctx.quadraticCurveTo(cx + 15 * dirX, cy + 75 * dirY, cx + 5 * dirX, cy + 55 * dirY);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawOrnamentLine(ctx, cx, y, width, color, withDiamond) {
  const half = width / 2;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx - half, y); ctx.lineTo(cx - 15, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 15, y); ctx.lineTo(cx + half, y); ctx.stroke();
  if (withDiamond) drawDiamond(ctx, cx, y, 6, color);
  drawDiamond(ctx, cx - half - 6, y, 3, color);
  drawDiamond(ctx, cx + half + 6, y, 3, color);
  ctx.restore();
}

function fillText3D(ctx, text, x, y, color, highlight, shadow, maxWidth) {
  const mw = maxWidth || (ctx.measureText(text).width + 200);
  ctx.save();
  ctx.fillStyle = shadow;
  ctx.fillText(text, x + 2, y + 3, mw);
  ctx.fillStyle = highlight;
  ctx.fillText(text, x - 1, y - 1, mw);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y, mw);
  ctx.restore();
}

function setArabicContext(ctx) {
  ctx.direction = 'rtl';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
}

function drawWatermark(ctx, W, H, color) {
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = color;
  ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold 32px ${ARABIC_FONT_STACK}`;
  const positions = [
    { x: W * 0.25, y: H * 0.20, rot: -22 },
    { x: W * 0.75, y: H * 0.38, rot: -22 },
    { x: W * 0.28, y: H * 0.60, rot: -22 },
    { x: W * 0.72, y: H * 0.80, rot: -22 },
  ];
  for (const p of positions) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
    ctx.fillText('تصميم / sab3-77', 0, 0); ctx.restore();
  }
  ctx.restore();
}

function layoutTextBlock(H, totalTextHeight) {
  const topDivider = 245;
  const bottomDivider = H - 380;
  const centerY = (topDivider + bottomDivider) / 2;
  let startY = centerY - totalTextHeight / 2;
  if (startY < topDivider + 50) startY = topDivider + 50;
  if (startY + totalTextHeight > bottomDivider - 50) startY = bottomDivider - 50 - totalTextHeight;
  return { startY, topDivider, bottomDivider };
}

// ============== النمط 1: نسخي فاخر ==============
function drawNaskh(ctx, W, H, text, bookName, authorName) {
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#0a1a30'); bg.addColorStop(0.5, '#0f2542'); bg.addColorStop(1, '#071224');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  const vg = ctx.createRadialGradient(W/2, H/2, W*0.15, W/2, H/2, W*0.9);
  vg.addColorStop(0, 'rgba(70, 110, 170, 0.22)');
  vg.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  ctx.save(); ctx.globalAlpha = 0.18;
  for (let i = 0; i < 400; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? '#c9a961' : '#e8d5a8';
    ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);
  }
  ctx.restore();

  const gold = '#c9a961', goldDark = '#8a6d2f', goldLight = '#e8d5a8', goldBright = '#f5e6b8';
  const textColor = '#e8d5a8';
  const textHighlight = 'rgba(255, 245, 200, 0.85)';
  const textShadow = 'rgba(0, 0, 0, 0.85)';

  ctx.strokeStyle = gold; ctx.lineWidth = 5;
  ctx.strokeRect(38, 38, W - 76, H - 76);
  ctx.strokeStyle = goldDark; ctx.lineWidth = 1.5;
  ctx.strokeRect(58, 58, W - 116, H - 116);
  ctx.strokeStyle = 'rgba(201,169,97,0.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(66, 66, W - 132, H - 132);

  const cs = 130;
  drawFlourishCorner(ctx, 66, 66, 1, 1, cs, gold);
  drawFlourishCorner(ctx, W - 66, 66, -1, 1, cs, gold);
  drawFlourishCorner(ctx, 66, H - 66, 1, -1, cs, gold);
  drawFlourishCorner(ctx, W - 66, H - 66, -1, -1, cs, gold);

  ctx.direction = 'ltr'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = goldBright;
  ctx.font = 'bold 200px "Aref Ruqaa", Georgia, serif';
  ctx.fillText('\u201C', 90, 15);

  const len = text.length;
  const fontSize = adaptiveFontSize(len, 74, 46);
  const lineHeight = Math.round(fontSize * 1.75);
  setArabicContext(ctx);
  ctx.font = `700 ${fontSize}px ${ARABIC_FONT_STACK}`;
  const maxWidth = W - 200;
  const lines = wrapText(ctx, text, maxWidth);
  const totalTextHeight = lines.length * lineHeight;

  const { startY, topDivider, bottomDivider } = layoutTextBlock(H, totalTextHeight);

  drawOrnamentLine(ctx, W/2, topDivider, 300, gold, true);

  let y = startY;
  for (const line of lines) {
    fillText3D(ctx, line, W - 100, y, textColor, textHighlight, textShadow, maxWidth);
    y += lineHeight;
  }

  drawOrnamentLine(ctx, W/2, bottomDivider, 240, gold, true);

  setArabicContext(ctx);
  ctx.textAlign = 'center';
  if (bookName) {
    ctx.font = `700 34px ${ARABIC_FONT_STACK}`;
    const bookText = '📖 ﴿ ' + bookName + ' ﴾';
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(bookText, W/2 + 2, H - 235 + 3, W - 200);
    ctx.fillStyle = goldBright;
    ctx.fillText(bookText, W/2, H - 235, W - 200);
    ctx.restore();
  }
  if (authorName) {
    ctx.font = `italic 400 26px ${ARABIC_FONT_STACK}`;
    ctx.fillStyle = gold;
    ctx.fillText('✍ ' + authorName, W/2, H - 180, W - 200);
  }

  drawWatermark(ctx, W, H, goldLight);
}

// ============== النمط 2: شرقي ==============
function drawOriental(ctx, W, H, text, bookName, authorName) {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#14213d'); bg.addColorStop(0.5, '#1a2b4a'); bg.addColorStop(1, '#0d1b2f');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.save(); ctx.globalAlpha = 0.06; ctx.strokeStyle = '#c9a961'; ctx.lineWidth = 1.2;
  const spacing = 90;
  for (let yy = -spacing; yy < H + spacing; yy += spacing) {
    for (let xx = -spacing; xx < W + spacing; xx += spacing) {
      ctx.save(); ctx.translate(xx, yy); ctx.strokeRect(-26, -26, 52, 52);
      ctx.rotate(Math.PI/4); ctx.strokeRect(-26, -26, 52, 52); ctx.restore();
      ctx.save(); ctx.translate(xx + spacing/2, yy + spacing/2); ctx.strokeRect(-26, -26, 52, 52);
      ctx.rotate(Math.PI/4); ctx.strokeRect(-26, -26, 52, 52); ctx.restore();
    }
  }
  ctx.restore();

  ctx.strokeStyle = 'rgba(201,169,97,0.9)'; ctx.lineWidth = 3;
  ctx.strokeRect(50, 50, W - 100, H - 100);
  ctx.strokeStyle = 'rgba(201,169,97,0.35)'; ctx.lineWidth = 1;
  ctx.strokeRect(70, 70, W - 140, H - 140);

  const cs = 120;
  drawFlourishCorner(ctx, 70, 70, 1, 1, cs, 'rgba(201,169,97,0.85)');
  drawFlourishCorner(ctx, W - 70, 70, -1, 1, cs, 'rgba(201,169,97,0.85)');
  drawFlourishCorner(ctx, 70, H - 70, 1, -1, cs, 'rgba(201,169,97,0.85)');
  drawFlourishCorner(ctx, W - 70, H - 70, -1, -1, cs, 'rgba(201,169,97,0.85)');

  ctx.direction = 'ltr'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(201,169,97,0.9)';
  ctx.font = 'bold 220px "Aref Ruqaa", Georgia, serif';
  ctx.fillText('\u201C', 80, 10);

  const len = text.length;
  const fontSize = adaptiveFontSize(len, 70, 42);
  const lineHeight = Math.round(fontSize * 1.75);
  setArabicContext(ctx);
  ctx.font = `700 ${fontSize}px ${ARABIC_FONT_STACK}`;
  const maxWidth = W - 220;
  const lines = wrapText(ctx, text, maxWidth);
  const totalTextHeight = lines.length * lineHeight;

  const { startY, topDivider, bottomDivider } = layoutTextBlock(H, totalTextHeight);

  drawOrnamentLine(ctx, W/2, topDivider, 300, 'rgba(201,169,97,0.75)', true);

  let y = startY;
  for (const line of lines) {
    fillText3D(ctx, line, W - 110, y, '#f5ecd9', 'rgba(255,255,255,0.35)', 'rgba(0,0,0,0.55)', maxWidth);
    y += lineHeight;
  }

  drawOrnamentLine(ctx, W/2, bottomDivider, 220, 'rgba(201,169,97,0.6)', true);

  setArabicContext(ctx);
  ctx.textAlign = 'center';
  if (bookName) {
    ctx.fillStyle = '#e8d5a8';
    ctx.font = `700 32px ${ARABIC_FONT_STACK}`;
    ctx.fillText('📖 ﴿ ' + bookName + ' ﴾', W/2, H - 230, W - 200);
  }
  if (authorName) {
    ctx.fillStyle = '#c9a961';
    ctx.font = `italic 400 26px ${ARABIC_FONT_STACK}`;
    ctx.fillText('✍ ' + authorName, W/2, H - 180, W - 200);
  }
  drawWatermark(ctx, W, H, '#c9a961');
}

// ============== النمط 3: كلاسيكي ==============

  const positions = [
    { x: W * 0.25, y: H * 0.20, rot: -22 }, { x: W * 0.75, y: H * 0.38, rot: -22 },

// ============== النمط 4: حديث ==============
function drawModern(ctx, W, H, text, bookName, authorName) {
  ctx.fillStyle = '#fefefe'; ctx.fillRect(0, 0, W, H);
  const accent = '#0f172a'; const accentColor = '#2b6cb0';

  ctx.fillStyle = accent; ctx.fillRect(0, 0, 14, H);
  ctx.fillStyle = accentColor; ctx.fillRect(14, 0, 6, H);

  ctx.direction = 'ltr'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = accent;
  ctx.font = 'bold 260px -apple-system, system-ui, sans-serif';
  ctx.fillText('\u201C', 50, -30);

  const len = text.length;
  const fontSize = adaptiveFontSize(len, 74, 46);
  const lineHeight = Math.round(fontSize * 1.55);
  setArabicContext(ctx);
  ctx.font = `800 ${fontSize}px -apple-system, "SF Arabic", ${ARABIC_FONT_STACK}`;
  const maxWidth = W - 200;
  const lines = wrapText(ctx, text, maxWidth);
  const totalTextHeight = lines.length * lineHeight;

  const centerY = H / 2 - 40;
  let y = centerY - totalTextHeight / 2;

  for (const line of lines) {
    ctx.fillStyle = accent;
    ctx.fillText(line, W - 100, y, maxWidth);
    y += lineHeight;
  }

  const lineY = Math.min(y + 70, H - 250);
  ctx.strokeStyle = accent; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(80, lineY); ctx.lineTo(W - 100, lineY); ctx.stroke();
  ctx.fillStyle = accentColor;
  ctx.beginPath(); ctx.arc(W - 100, lineY, 8, 0, Math.PI * 2); ctx.fill();

  setArabicContext(ctx);
  ctx.textAlign = 'left';
  if (bookName) {
    ctx.fillStyle = accent;
    ctx.font = `700 28px -apple-system, "SF Arabic", ${ARABIC_FONT_STACK}`;
    ctx.fillText('📖 ' + bookName, 100, lineY + 30, W - 200);
  }
  if (authorName) {
    ctx.fillStyle = '#64748b';
    ctx.font = `400 22px -apple-system, "SF Arabic", ${ARABIC_FONT_STACK}`;
    ctx.fillText('✍ ' + authorName, 100, lineY + 80, W - 200);
  }
  ctx.save(); ctx.globalAlpha = 0.07; ctx.fillStyle = '#0f172a';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold 32px ${ARABIC_FONT_STACK}`;
  const positions = [
    { x: W * 0.25, y: H * 0.20, rot: -22 }, { x: W * 0.75, y: H * 0.38, rot: -22 },
    { x: W * 0.28, y: H * 0.60, rot: -22 }, { x: W * 0.72, y: H * 0.80, rot: -22 },
  ];
  for (const p of positions) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
    ctx.fillText('sab3-77', 0, 0); ctx.restore();
  }
  ctx.restore();
}

// ============== توليد الصورة ==============
async function generateQuoteImage(rawText, bookName, authorName, style) {
  await ensureFonts();
  const text = stripPageNumbers(rawText);
  const W = 1080, H = 1350;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  if (style === 'modern') drawModern(ctx, W, H, text, bookName, authorName);
  else if (style === 'oriental') drawOriental(ctx, W, H, text, bookName, authorName);
  else if (style === 'classic') drawClassic(ctx, W, H, text, bookName, authorName);
  else drawNaskh(ctx, W, H, text, bookName, authorName);

  return new Promise(resolve => canvas.toBlob(b => resolve(b), 'image/png'));
}

async function showQuoteImage(text, style) {
  setStatus('جاري توليد الصورة...');
  try {
    state.currentImageText = text;
    const useStyle = style || state.imageStyle;
    const blob = await generateQuoteImage(text, state.pdfName, state.authorName, useStyle);
    state.currentImageBlob = blob;
    const url = URL.createObjectURL(blob);
    document.getElementById('previewImg').src = url;
    document.getElementById('imgPreview').classList.remove('hidden');
    document.getElementById('shareImgBtn').onclick = () => shareImage(blob);
    document.querySelectorAll('.style-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.style === useStyle);
    });
    setStatus('تم توليد الصورة ✨', 'ok');
  } catch (e) {
    setStatus('فشل توليد الصورة', 'err');
    toast('❌ ' + e.message);
  }
}

function closePreview() { document.getElementById('imgPreview').classList.add('hidden'); }

async function shareImage(blob) {
  const file = new File([blob], 'quote.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); }
    catch (e) { if (e.name !== 'AbortError') toast('تعذرت المشاركة'); }
  } else {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'quote.png'; a.click();
    toast('تم تحميل الصورة');
  }
}

// ============== المكتبة ==============
function findQuote(text, book) { return state.library.find(q => q.text === text && q.book === book); }
function isFavorite(text, book) { const q = findQuote(text, book); return !!(q && q.favorite); }
function ensureInLibrary(text, book) {
  let q = findQuote(text, book);
  if (!q) {
    q = { id: (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now() + Math.random()), text, book, favorite: false, date: new Date().toISOString() };
    state.library.push(q); saveLibrary();
  }
  return q;
}
function toggleFavorite(text, book) { const q = ensureInLibrary(text, book); q.favorite = !q.favorite; saveLibrary(); }
function openLibrary() { document.getElementById('library').classList.remove('hidden'); renderLibrary('all'); }
function closeLibrary() { document.getElementById('library').classList.add('hidden'); }

function renderLibrary(filter) {
  const list = document.getElementById('libList'); list.innerHTML = '';
  let items = filter === 'fav' ? state.library.filter(q => q.favorite) : [...state.library];
  items.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  document.getElementById('libCount').textContent = items.length + ' اقتباس';
  document.getElementById('filterAll').className = 'btn ' + (filter === 'all' ? 'btn-purple' : 'btn-gray');
  document.getElementById('filterFav').className = 'btn ' + (filter === 'fav' ? 'btn-purple' : 'btn-gray');
  if (!items.length) { list.innerHTML = '<div style="text-align:center;color:#a0aec0;padding:30px;">لا توجد اقتباسات بعد</div>'; return; }
  items.forEach(q => {
    const card = document.createElement('div');
    card.className = 'card';
    const dateStr = (q.date || '').substring(0, 10);
    card.innerHTML = `
      <div class="card-head">
        <button class="star ${q.favorite ? 'on' : ''}">${q.favorite ? '★' : '☆'}</button>
        <span style="font-size:11px;color:#4a5568;">📕 ${escapeHtml(q.book || '')} · ${dateStr}</span>
      </div>
      <div class="q-text">${escapeHtml(q.text)}</div>
      <div class="card-actions">
        <button class="btn btn-green" data-act="copy">📋</button>
        <button class="btn btn-blue" data-act="share">📤</button>
        <button class="btn btn-purple" data-act="image">📸</button>
        <button class="btn btn-red" data-act="del">🗑</button>
      </div>`;
    card.querySelector('.star').addEventListener('click', () => { q.favorite = !q.favorite; saveLibrary(); renderLibrary(filter); });
    card.querySelector('[data-act="copy"]').addEventListener('click', () => copyQuote(q.text));
    card.querySelector('[data-act="share"]').addEventListener('click', () => shareQuote(q.text));
    card.querySelector('[data-act="image"]').addEventListener('click', () => showQuoteImage(q.text));
    card.querySelector('[data-act="del"]').addEventListener('click', () => {
      if (confirm('حذف؟')) { state.library = state.library.filter(x => x.id !== q.id); saveLibrary(); renderLibrary(filter); }
    });
    list.appendChild(card);
  });
}

// ============== عرض البطاقات ==============
function renderQuotes() {
  const container = document.getElementById('quotes');
  container.innerHTML = '';
  if (!state.quotes.length) return;
  const header = document.createElement('div');
  header.style.cssText = 'font-size:13px;color:#4a5568;text-align:right;padding:8px;margin-bottom:8px;line-height:1.7;';
  header.textContent = state.currentHeader;
  container.appendChild(header);
  state.quotes.forEach((quote, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const isFav = isFavorite(quote, state.pdfName);
    card.innerHTML = `
      <div class="card-head">
        <button class="star ${isFav ? 'on' : ''}" data-idx="${i}">${isFav ? '★' : '☆'}</button>
        <span class="q-num">❝ اقتباس ${i + 1}</span>
      </div>
      <div class="q-text">${escapeHtml(quote)}</div>
      <div class="card-actions">
        <button class="btn btn-green" data-action="copy" data-idx="${i}">📋 نسخ</button>
        <button class="btn btn-blue" data-action="share" data-idx="${i}">📤 مشاركة</button>
        <button class="btn btn-purple" data-action="image" data-idx="${i}">📸 صورة</button>
      </div>`;
    container.appendChild(card);
  });
  container.querySelectorAll('.star').forEach(b => b.addEventListener('click', () => {
    toggleFavorite(state.quotes[parseInt(b.dataset.idx)], state.pdfName); renderQuotes();
  }));
  container.querySelectorAll('[data-action]').forEach(b => b.addEventListener('click', () => {
    const idx = parseInt(b.dataset.idx);
    const t = state.quotes[idx];
    if (b.dataset.action === 'copy') copyQuote(t);
    else if (b.dataset.action === 'share') shareQuote(t);
    else showQuoteImage(t);
  }));
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
async function copyQuote(text) { try { await navigator.clipboard.writeText(text); toast('✅ تم النسخ'); } catch (e) { toast('❌ فشل النسخ'); } }
async function shareQuote(text) {
  if (navigator.share) { try { await navigator.share({ text }); } catch (e) { if (e.name !== 'AbortError') copyQuote(text); } }
  else copyQuote(text);
}

// ============== الاستخراج ==============
async function generate() {
  if (state.busy) return;
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { toast('❌ أدخل مفتاح OpenRouter'); return; }
  if (!state.pdfFile) { toast('❌ اختر PDF أولاً'); return; }
  saveApiKey(apiKey);
  state.busy = true;
  const genBtn = document.getElementById('genBtn');
  genBtn.disabled = true; genBtn.textContent = '⏳ جاري الاستخراج...';
  try {
    setStatus('جاري قراءة PDF...'); showProgress(true, 0);
    const { text } = await extractPdfText(state.pdfFile);
    let cleaned = truncateAtLine(cleanPdfText(text), 12000);
    if (!cleaned.trim()) { setStatus('لم يُعثر على نص', 'err'); return; }
    setStatus('جاري الاتصال بالنموذج...');
    const { text: answer, model } = await callOpenRouter(apiKey, state.pdfName, cleaned, state.quoteCount);
    const quotes = parseQuotes(answer);
    state.quotes = quotes;
    state.currentHeader = '📕 ' + state.pdfName + '\n🤖 ' + model.split('/').pop();
    quotes.forEach(q => ensureInLibrary(q, state.pdfName));
    renderQuotes();
    setStatus(`✓ ${quotes.length} اقتباسات — اضغط مجدداً`, 'ok');
    genBtn.textContent = '🔄 اقتباسات جديدة';
  } catch (e) {
    setStatus('حدث خطأ', 'err');
    document.getElementById('quotes').innerHTML = '<div class="card" style="color:#c53030;text-align:center;padding:20px;">حدث خطأ:<br><br>' + escapeHtml(e.message) + '</div>';
  } finally {
    state.busy = false; genBtn.disabled = false; showProgress(false);
  }
}

// ============== الأحداث ==============
function initApp() {
  try {
    loadLibrary(); loadApiKey();
    // ✅ لا ننتظر الخطوط هنا لتفادي تعليق الواجهة
    ensureFonts().catch(() => {});

    const pickBtn = document.getElementById('pickPdfBtn');
    const pdfIn = document.getElementById('pdfInput');
    const genBtn = document.getElementById('genBtn');
    const countBtn = document.getElementById('countBtn');
    const styleBtn = document.getElementById('styleBtn');
    const libBtn = document.getElementById('libBtn');

    pickBtn.addEventListener('click', () => pdfIn.click());
    pdfIn.addEventListener('change', (e) => {
      const f = e.target.files[0]; if (!f) return;
      state.pdfFile = f; state.pdfName = f.name;
      if (!document.getElementById('bookName').value) {
        document.getElementById('bookName').value = f.name.replace(/\.pdf$/i, '');
        state.pdfName = f.name.replace(/\.pdf$/i, '');
      }
      setStatus('✓ ' + f.name, 'ok');
      state.quotes = []; document.getElementById('quotes').innerHTML = '';
    });

    genBtn.addEventListener('click', generate);

    countBtn.addEventListener('click', function() {
      const opts = [5, 10, 15, 20];
      let idx = opts.indexOf(state.quoteCount);
      idx = (idx + 1) % opts.length;
      state.quoteCount = opts[idx];
      this.textContent = '🔢 ' + state.quoteCount;
    });

    styleBtn.addEventListener('click', function() {
      const order = ['naskh', 'oriental', 'classic', 'modern'];
      let i = order.indexOf(state.imageStyle);
      i = (i + 1) % order.length;
      state.imageStyle = order[i];
      saveStyle(state.imageStyle);
      this.textContent = '🎨 ' + STYLE_NAMES[state.imageStyle].split(' ').slice(1).join(' ');
      toast('النمط: ' + STYLE_NAMES[state.imageStyle]);
    });

    libBtn.addEventListener('click', openLibrary);
    document.getElementById('filterAll').addEventListener('click', () => renderLibrary('all'));
    document.getElementById('filterFav').addEventListener('click', () => renderLibrary('fav'));

    document.getElementById('bookName').addEventListener('input', e => state.pdfName = e.target.value || 'كتاب');
    document.getElementById('authorName').addEventListener('input', e => { state.authorName = e.target.value; saveAuthor(e.target.value); });

    document.querySelectorAll('.style-chip').forEach(chip => {
      chip.addEventListener('click', async () => {
        state.imageStyle = chip.dataset.style;
        saveStyle(state.imageStyle);
        document.getElementById('styleBtn').textContent = '🎨 ' + STYLE_NAMES[state.imageStyle].split(' ').slice(1).join(' ');
        await showQuoteImage(state.currentImageText, state.imageStyle);
      });
    });
  } catch (e) {
    showErr('init: ' + e.message);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>

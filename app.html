<script>
function showErr(msg) {
  try {
    document.getElementById('errText').textContent = String(msg).substring(0, 500);
    document.getElementById('errBanner').style.display = 'block';
  } catch (e) {}
}
window.addEventListener('error', function(ev) { showErr((ev.message || 'unknown') + ' @ ' + (ev.filename || '') + ':' + (ev.lineno || '')); });
window.addEventListener('unhandledrejection', function(ev) { showErr('Promise: ' + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason)); });

'use strict';

let pdfjsReady = false;
try {
  if (typeof pdfjsLib !== 'undefined' && pdfjsLib.GlobalWorkerOptions) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfjsReady = true;
  }
} catch (e) { showErr('pdfjs init: ' + e.message); }

const STORAGE_KEY = 'quotes_library_v1';
const API_KEY_STORAGE = 'quotes_api_key';
const AUTHOR_STORAGE = 'quotes_author';
const STYLE_STORAGE = 'quotes_style';
const VARIANT_STORAGE = 'quotes_variant_index';

const STYLE_NAMES = {
  naskh: '📜 نسخي فاخر',
  oriental: '🌙 شرقي',
  classic: '🏛️ كلاسيكي',
  modern: '⚡ حديث',
  islamic: '🕌 إسلامي مزخرف',
  night: '🌌 ليلي بنجوم',
  news: '📰 خبر عاجل',
  emerald: '💡 نصيحة زمردي',
};
const STYLE_ORDER = ['naskh', 'oriental', 'classic', 'modern', 'islamic', 'night', 'news', 'emerald'];

const FONT_FAMILY = "Amiri, 'Noto Naskh Arabic', 'Scheherazade New', Georgia, serif";
const FONT_FAMILY_B = "'Aref Ruqaa', Amiri, 'Scheherazade New', Georgia, serif";
const FONT_FAMILY_C = "'Scheherazade New', Amiri, Georgia, serif";

let variantCounter = 0;
try { variantCounter = parseInt(localStorage.getItem(VARIANT_STORAGE) || '0', 10); } catch (e) {}
function nextVariant(total) {
  variantCounter = (variantCounter + 1) % (total * 1000);
  try { localStorage.setItem(VARIANT_STORAGE, String(variantCounter)); } catch (e) {}
  return variantCounter % total;
}

let state = {
  pdfFile: null, pdfText: '', pdfName: '', authorName: '',
  quotes: [], quoteCount: 5, library: [], currentHeader: '',
  busy: false, imageStyle: 'naskh',
  currentImageText: '', currentImageBlob: null,
  editMode: false, editedText: '',
  showQuote: true, showBook: true, showAuthor: true,
  currentVariantIdx: null,
};

let fontsReady = false;
async function ensureFonts() {
  if (fontsReady) return;
  try {
    if (typeof document.fonts === 'undefined' || !document.fonts.load) { fontsReady = true; return; }
    await Promise.all([
      document.fonts.load('400 40px Amiri').catch(() => null),
      document.fonts.load('700 40px Amiri').catch(() => null),
      document.fonts.load('400 40px "Noto Naskh Arabic"').catch(() => null),
      document.fonts.load('700 40px "Noto Naskh Arabic"').catch(() => null),
      document.fonts.load('400 40px "Aref Ruqaa"').catch(() => null),
      document.fonts.load('700 40px "Aref Ruqaa"').catch(() => null),
      document.fonts.load('400 40px "Scheherazade New"').catch(() => null),
      document.fonts.load('700 40px "Scheherazade New"').catch(() => null),
    ]);
    try { await document.fonts.ready; } catch (e) {}
    await new Promise(r => setTimeout(r, 300));
    fontsReady = true;
  } catch (e) { fontsReady = true; }
}

function loadLibrary() { try { const d = localStorage.getItem(STORAGE_KEY); state.library = d ? JSON.parse(d) : []; } catch (e) { state.library = []; } }
function saveLibrary() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.library)); } catch (e) {} }
function toast(msg, ms) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms || 2200); }
function setStatus(t, c) { const el = document.getElementById('status'); el.textContent = t; el.className = 'status' + (c ? ' ' + c : ''); }
function showProgress(s, p) { const w = document.getElementById('progressWrap'); const b = document.getElementById('progressBar'); w.classList.toggle('hidden', !s); if (p !== undefined) b.style.width = p + '%'; }

function loadApiKey() {
  try {
    const k = localStorage.getItem(API_KEY_STORAGE); if (k) document.getElementById('apiKey').value = k;
    const a = localStorage.getItem(AUTHOR_STORAGE); if (a) { document.getElementById('authorName').value = a; state.authorName = a; }
    const s = localStorage.getItem(STYLE_STORAGE);
    if (s && STYLE_NAMES[s]) {
      state.imageStyle = s;
      document.getElementById('styleBtn').textContent = '🎨 ' + STYLE_NAMES[s].split(' ').slice(1).join(' ');
    }
  } catch (e) {}
}
function saveApiKey(k) { try { localStorage.setItem(API_KEY_STORAGE, k); } catch (e) {} }
function saveAuthor(a) { try { localStorage.setItem(AUTHOR_STORAGE, a); } catch (e) {} }
function saveStyle(s) { try { localStorage.setItem(STYLE_STORAGE, s); } catch (e) {} }

async function extractPdfText(file) {
  if (!pdfjsReady) throw new Error('pdf.js لم يُحمّل');
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const totalPages = pdf.numPages;
  const MAX = 30;
  let start = 1;
  if (totalPages > MAX) start = Math.floor(Math.random() * (totalPages - MAX)) + 1;
  const end = Math.min(start + MAX - 1, totalPages);
  let text = '';
  for (let i = start; i <= end; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(item => item.str).join(' ');
    text += `[صفحة ${i}]\n${pageText.trim()}\n\n`;
    showProgress(true, Math.round(((i - start + 1) / (end - start + 1)) * 100));
  }
  showProgress(false);
  return { text, totalPages };
}

function cleanPdfText(text) {
  text = text.replace(/[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]+/g, '');
  text = text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
  text = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '');
  text = text.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n');
  return text.trim();
}

function cleanOutputText(text) {
  text = text.replace(/<unk>/g, '').replace(/\[UNK\]/g, '');
  if (text.includes('```')) text = text.replace(/```[a-zA-Z]*\n/g, '').replace(/```/g, '');
  text = text.replace(/[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]+/g, '');
  text = text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
  const lines = text.split('\n');
  const out = [];
  for (const line of lines) {
    const s = line.trim();
    if (!s) { out.push(''); continue; }
    if (/[\u0600-\u06FF]/.test(s) || /^\[?صفحة|^\d+\s*[\-\.\]\)]|^\d+$/.test(s)) out.push(line);
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function parseQuotes(text) {
  text = text.trim();
  if (!text) return [];
  const parts = ('\n' + text).split(/\n(?=\s*\d+\s*[\.\-–—\)])/);
  const quotes = [];
  for (let p of parts) {
    p = p.trim(); if (!p) continue;
    p = p.replace(/^\s*\d+\s*[\.\-–—\)]\s*/, '');
    if (p && p.length > 20) quotes.push(p);
  }
  if (quotes.length <= 1 && text.length > 400) {
    const chunks = text.split(/\n\n+/).map(c => c.trim()).filter(c => c);
    if (chunks.length > 1) return chunks;
  }
  return quotes.length ? quotes : [text];
}

function truncateAtLine(text, maxChars) {
  if (text.length <= maxChars) return text;
  const cut = text.lastIndexOf('\n', maxChars);
  return text.substring(0, cut > 0 ? cut : maxChars);
}

function prepareQuoteText(text) {
  let t = String(text || '');
  t = t.replace(/\s*\[صفحة\s*\d+\]\s*/g, ' ');
  t = t.replace(/\[\s*\]/g, ' ');
  t = t.replace(/[\s،؛:\.\!\?؟\u060C\u061B\u061F\u066A-\u066D]+$/g, '');
  t = t.replace(/\s+/g, ' ').trim();
  if (t.length) t = t + '.';
  return t;
}

const MODELS = ['openai/gpt-oss-120b', 'google/gemini-2.5-flash', 'meta-llama/llama-3.3-70b-instruct'];

async function callOpenRouter(apiKey, bookName, bookText, count) {
  const seed = Math.floor(Math.random() * 9000) + 1000;
  const prompt = `أنت مساعد متخصص في استخراج الاقتباسات الفكرية من الكتب العربية.

تعليمات مهمة جداً:
- النص المرفق قد يحتوي على رموز غريبة أو أحرف صينية أو unk — تجاهلها.
- اكتب بالعربية الفصحى فقط.

اسم الكتاب: ${bookName || 'غير مذكور'}
رمز التنويع: ${seed}

⚠️ الأهم في هذه المهمة: أن يكون كل اقتباس **فقرة كاملة** تنقل فكرة متكاملة للقارئ.

الشروط:
1. كل اقتباس يجب أن يتكون من **3 إلى 5 جمل مترابطة** (40-90 كلمة).
2. الاقتباس يجب أن ينقل **فكرة كاملة** يفهمها القارئ بدون الرجوع للكتاب.
3. اختر مقاطع تبدأ بجملة تمهيدية وتنتهي بخاتمة أو نتيجة.
4. ركّز على الأفكار القوية: النفسية، الفلسفية، الاجتماعية، التطويرية.
5. عربي فقط، طابق النص حرفياً بدون اختلاق.

المطلوب: استخرج ${count} اقتباسات فكرية طويلة من النص المرفق.

تعليمات الإخراج:
- ابدأ القائمة مباشرة.
- رقّم من 1 إلى ${count}.
- ضع سطراً فارغاً بين كل اقتباسين.
- لا تكتب أي شيء آخر غير الاقتباسات.

نص الكتاب:
${bookText}`;
  const errors = [];
  for (const model of MODELS) {
    setStatus(`(${model.split('/').pop()}) جاري الاتصال...`);
    try {
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json', 'HTTP-Referer': location.origin, 'X-Title': 'Arabic Quotes Extractor' },
        body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], temperature: 0.85, max_tokens: 4000 }),
      });
      if (res.status === 200) {
        const data = await res.json();
        let answer = cleanOutputText(data.choices?.[0]?.message?.content || '');
        if ((answer.match(/[\u0600-\u06FF]/g) || []).length < 100) { errors.push(`${model}: غير عربية`); continue; }
        return { text: answer, model };
      }
      const errData = await res.json().catch(() => ({}));
      errors.push(`${model}: ${(errData.error?.message || 'HTTP ' + res.status).substring(0, 100)}`);
      if ([429, 500, 502, 503].includes(res.status)) await new Promise(r => setTimeout(r, 3000));
    } catch (e) { errors.push(`${model}: ${e.message}`); }
  }
  throw new Error('فشلت المحاولات:\n' + errors.join('\n'));
}

// ============== SVG Helpers ==============
function escapeXml(s) {
  return String(s).replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]));
}

let _measureSvg = null, _measureText = null;
function measureSvgTextWidth(text, fontSize, fontWeight, fontFamily) {
  const svgNS = 'http://www.w3.org/2000/svg';
  if (!_measureSvg) {
    _measureSvg = document.createElementNS(svgNS, 'svg');
    _measureSvg.setAttribute('xmlns', svgNS);
    _measureSvg.style.cssText = 'position:absolute;width:0;height:0;visibility:hidden;top:-9999px;';
    _measureText = document.createElementNS(svgNS, 'text');
    _measureSvg.appendChild(_measureText);
    document.body.appendChild(_measureSvg);
  }
  _measureText.setAttribute('font-family', fontFamily || FONT_FAMILY);
  _measureText.setAttribute('font-size', String(fontSize));
  _measureText.setAttribute('font-weight', String(fontWeight || 700));
  _measureText.setAttribute('direction', 'rtl');
  _measureText.setAttribute('text-anchor', 'middle');
  _measureText.setAttribute('x', '500');
  _measureText.setAttribute('y', '100');
  _measureText.textContent = text;
  let w = 0;
  try { w = _measureText.getComputedTextLength(); } catch (e) {
    try { w = _measureText.getBBox().width; } catch (e2) { w = text.length * fontSize * 0.5; }
  }
  return w;
}

function wrapArabicText(text, maxWidth, fontSize, fontFamily) {
  const lines = [];
  const paragraphs = text.split('\n');
  for (const para of paragraphs) {
    if (!para.trim()) { lines.push(''); continue; }
    const words = para.split(/\s+/);
    let current = '';
    for (const word of words) {
      const test = current ? current + ' ' + word : word;
      const w = measureSvgTextWidth(test, fontSize, 700, fontFamily);
      if (w > maxWidth && current) { lines.push(current); current = word; }
      else { current = test; }
    }
    if (current) lines.push(current);
  }
  return lines;
}

function computeOptimalLayout(text, W, H, config, variant) {
  const len = text.length;
  const topDivider = config.isModern || config.isNews ? 200 : 340;
  const bottomDivider = config.isModern || config.isNews ? H - 320 : H - 400;
  const availableHeight = bottomDivider - topDivider - 80;
  const ABSOLUTE_MAX_WIDTH = W - 400;

  let fontSize;
  if (len < 120) fontSize = 70;
  else if (len < 180) fontSize = 62;
  else if (len < 260) fontSize = 56;
  else if (len < 360) fontSize = 50;
  else if (len < 480) fontSize = 44;
  else fontSize = 40;

  let maxTextWidth = ABSOLUTE_MAX_WIDTH;
  let lineHeight = Math.round(fontSize * 1.85);
  let lines = wrapArabicText(text, maxTextWidth, fontSize, variant.font);

  function hasAnyOverflow(lns, fs) {
    for (const ln of lns) {
      const w = measureSvgTextWidth(ln, fs, 700, variant.font);
      if (w > ABSOLUTE_MAX_WIDTH + 30) return true;
    }
    return false;
  }

  let safety = 0;
  while (safety < 60) {
    const tooTall = (lines.length * lineHeight) > availableHeight;
    const tooWide = hasAnyOverflow(lines, fontSize);
    if (!tooTall && !tooWide) break;
    fontSize -= 2;
    lineHeight = Math.round(fontSize * 1.85);
    lines = wrapArabicText(text, maxTextWidth, fontSize, variant.font);
    safety++;
    if (fontSize <= 30) break;
  }

  safety = 0;
  while (lines.length < 4 && fontSize < 90 && safety < 20) {
    const nextFs = fontSize + 3;
    const testLines = wrapArabicText(text, maxTextWidth, nextFs, variant.font);
    if (hasAnyOverflow(testLines, nextFs)) break;
    if (testLines.length * Math.round(nextFs * 1.85) > availableHeight) break;
    fontSize = nextFs;
    lineHeight = Math.round(fontSize * 1.85);
    lines = testLines;
    safety++;
  }

  return { fontSize, maxTextWidth, lines, lineHeight, topDivider, bottomDivider, availableHeight };
}

function buildCornerSVG(cx, cy, dirX, dirY, size, color) {
  const L = size;
  let g = `<g stroke="${color}" fill="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">`;
  g += `<line x1="${cx}" y1="${cy}" x2="${cx + L*dirX}" y2="${cy}"/>`;
  g += `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy + L*dirY}"/>`;
  g += `<circle cx="${cx + L*dirX}" cy="${cy}" r="3"/>`;
  g += `<circle cx="${cx}" cy="${cy + L*dirY}" r="3"/>`;
  g += `<path d="M ${cx + 40*dirX} ${cy} C ${cx + 70*dirX} ${cy + 25*dirY}, ${cx + 100*dirX} ${cy + 10*dirY}, ${cx + 85*dirX} ${cy + 35*dirY}" fill="none"/>`;
  g += `<path d="M ${cx + 55*dirX} ${cy + 5*dirY} Q ${cx + 75*dirX} ${cy - 15*dirY} ${cx + 90*dirX} ${cy + 5*dirY} Q ${cx + 75*dirX} ${cy + 15*dirY} ${cx + 55*dirX} ${cy + 5*dirY} Z" stroke="none"/>`;
  g += `<path d="M ${cx} ${cy + 40*dirY} C ${cx + 25*dirX} ${cy + 70*dirY}, ${cx + 10*dirX} ${cy + 100*dirY}, ${cx + 35*dirX} ${cy + 85*dirY}" fill="none"/>`;
  g += `<path d="M ${cx + 5*dirX} ${cy + 55*dirY} Q ${cx - 15*dirX} ${cy + 75*dirY} ${cx + 5*dirX} ${cy + 90*dirY} Q ${cx + 15*dirX} ${cy + 75*dirY} ${cx + 5*dirX} ${cy + 55*dirY} Z" stroke="none"/>`;
  g += '</g>';
  return g;
}

function buildDividerSVG(cx, y, width, color) {
  if (!width) return '';
  const half = width / 2;
  let g = `<g stroke="${color}" fill="${color}" stroke-width="1.5">`;
  g += `<line x1="${cx - half}" y1="${y}" x2="${cx - 15}" y2="${y}"/>`;
  g += `<line x1="${cx + 15}" y1="${y}" x2="${cx + half}" y2="${y}"/>`;
  g += `<polygon points="${cx},${y-6} ${cx+6},${y} ${cx},${y+6} ${cx-6},${y}" stroke="none"/>`;
  g += `<polygon points="${cx-half-6},${y-3} ${cx-half},${y} ${cx-half-6},${y+3} ${cx-half-12},${y}" stroke="none"/>`;
  g += `<polygon points="${cx+half+6},${y-3} ${cx+half},${y} ${cx+half+6},${y+3} ${cx+half+12},${y}" stroke="none"/>`;
  g += '</g>';
  return g;
}

// ✅ زخرفة إسلامية (نجمة ثمانية - خاتم)
function buildKhatimPatternSVG(W, H, color, opacity) {
  const spacing = 110;
  let s = `<g stroke="${color}" fill="none" stroke-width="1.5" opacity="${opacity}">`;
  for (let y = -spacing; y < H + spacing; y += spacing) {
    for (let x = -spacing; x < W + spacing; x += spacing) {
      s += `<rect x="${x-32}" y="${y-32}" width="64" height="64"/>`;
      s += `<rect x="${x-32}" y="${y-32}" width="64" height="64" transform="rotate(45 ${x} ${y})"/>`;
      const ox = x + spacing/2, oy = y + spacing/2;
      s += `<rect x="${ox-32}" y="${oy-32}" width="64" height="64"/>`;
      s += `<rect x="${ox-32}" y="${oy-32}" width="64" height="64" transform="rotate(45 ${ox} ${oy})"/>`;
    }
  }
  s += `</g>`;
  return s;
}

// ✅ طبقة نجوم عشوائية
function buildStarsLayerSVG(W, H, count) {
  let s = '<g>';
  for (let i = 0; i < count; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H * 0.9;
    const r = Math.random() * 2 + 0.8;
    const opacity = Math.random() * 0.6 + 0.3;
    s += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(1)}" fill="#ffffff" opacity="${opacity.toFixed(2)}"/>`;
  }
  s += '</g>';
  return s;
}

// ✅ هلال القمر
function buildMoonSVG(W, H, color) {
  const cx = W - 200;
  const cy = 230;
  const r = 90;
  return `<g>
    <defs>
      <mask id="moonMask">
        <rect x="0" y="0" width="${W}" height="${H}" fill="white"/>
        <circle cx="${cx + 45}" cy="${cy - 25}" r="${r * 0.85}" fill="black"/>
      </mask>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" opacity="0.9" mask="url(#moonMask)"/>
  </g>`;
}

// ✅ شارة "عاجل" للخبر
function buildNewsBadgeSVG() {
  return `<g>
    <rect x="80" y="90" width="220" height="80" rx="12" fill="#c53030"/>
    <text x="190" y="145" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle">عاجل</text>
  </g>`;
}

// ✅ نمط معينات خفيف
function buildDiamondPatternSVG(W, H, color, opacity) {
  const spacing = 130;
  let s = `<g stroke="${color}" fill="none" stroke-width="0.8" opacity="${opacity}">`;
  for (let y = 0; y < H + spacing; y += spacing) {
    for (let x = 0; x < W + spacing; x += spacing) {
      s += `<polygon points="${x},${y-22} ${x+22},${y} ${x},${y+22} ${x-22},${y}"/>`;
      const ox = x + spacing/2, oy = y + spacing/2;
      s += `<polygon points="${ox},${oy-15} ${ox+15},${oy} ${ox},${oy+15} ${ox-15},${oy}"/>`;
    }
  }
  s += `</g>`;
  return s;
}

function buildQuoteSVG(opts) {
  const { W, H, lines, fontSize, lineHeight, startY, topDivider, bottomDivider, bookName, authorName, config, variant, showQuote, showBook, showAuthor } = opts;
  const NS = 'xmlns="http://www.w3.org/2000/svg"';
  const font = variant.font;
  const textColor = variant.textColor;
  const textShadow = variant.textShadow;
  const textHighlight = variant.textHighlight;
  const cx = W / 2;

  let s = `<svg ${NS} width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;

  s += `<defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      ${config.bgColors.map((c, i) => `<stop offset="${(i / (config.bgColors.length - 1) * 100).toFixed(1)}%" stop-color="${c}"/>`).join('')}
    </linearGradient>
    <radialGradient id="vgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="${config.vignette[0]}"/>
      <stop offset="100%" stop-color="${config.vignette[1]}"/>
    </radialGradient>
  </defs>`;

  s += `<rect width="${W}" height="${H}" fill="url(#bgGrad)"/>`;
  s += `<rect width="${W}" height="${H}" fill="url(#vgGrad)"/>`;

  // ✅ أنماط خاصة بالخلفية
  if (config.khatimPattern) {
    s += buildKhatimPatternSVG(W, H, config.khatimColor, 0.07);
  }
  if (config.starsLayer) {
    s += buildStarsLayerSVG(W, H, config.starsCount || 100);
  }
  if (config.diamondPattern) {
    s += buildDiamondPatternSVG(W, H, config.diamondColor, 0.06);
  }
  if (config.moon) {
    s += buildMoonSVG(W, H, config.moonColor || '#e8eef8');
  }

  if (config.stars && !config.starsLayer) {
    s += `<g fill="${config.starsColor}" opacity="0.18">`;
    for (let i = 0; i < 300; i++) {
      const x = (Math.random() * W).toFixed(0);
      const y = (Math.random() * H).toFixed(0);
      s += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
    s += `</g>`;
  }

  for (const f of config.frames) {
    s += `<rect x="${f.inset}" y="${f.inset}" width="${W - f.inset*2}" height="${H - f.inset*2}" fill="none" stroke="${f.color}" stroke-width="${f.width}"/>`;
  }

  if (config.cornerColor) {
    const c = config.cornerInset || 66;
    s += buildCornerSVG(c, c, 1, 1, config.cornerSize, config.cornerColor);
    s += buildCornerSVG(W - c, c, -1, 1, config.cornerSize, config.cornerColor);
    s += buildCornerSVG(c, H - c, 1, -1, config.cornerSize, config.cornerColor);
    s += buildCornerSVG(W - c, H - c, -1, -1, config.cornerSize, config.cornerColor);
  }

  // ✅ شارة عاجل للخبر
  if (config.newsBadge) {
    s += buildNewsBadgeSVG();
  }

  // ✅ علامة الاقتباس (مشروطة)
  if (showQuote) {
    s += `<text x="90" y="230" font-family="Aref Ruqaa, Georgia, serif" font-weight="bold" font-size="220" fill="${config.quoteMarkColor}" text-anchor="start">&#8220;</text>`;
  }

  s += buildDividerSVG(cx, topDivider, config.topDividerWidth || 300, config.ornamentColor);

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line) continue;
    const baselineY = startY + i * lineHeight + fontSize * 0.85;
    const common = `font-family="${font}" font-weight="700" font-size="${fontSize}" text-anchor="middle" direction="rtl"`;
    s += `<text x="${cx + 2}" y="${baselineY + 3}" ${common} fill="${textShadow}">${escapeXml(line)}</text>`;
    s += `<text x="${cx - 1}" y="${baselineY - 1}" ${common} fill="${textHighlight}">${escapeXml(line)}</text>`;
    s += `<text x="${cx}" y="${baselineY}" ${common} fill="${textColor}">${escapeXml(line)}</text>`;
  }

  s += buildDividerSVG(cx, bottomDivider, config.bottomDividerWidth || 240, config.ornamentColor);

  if (showBook && bookName) {
    const bookText = '\u{1F4D6} \uFD3F ' + bookName + ' \uFD3E';
    s += `<text x="${cx}" y="${H - 200}" font-family="${FONT_FAMILY}" font-weight="700" font-size="36" fill="${config.bookColor}" text-anchor="middle" direction="rtl">${escapeXml(bookText)}</text>`;
  }
  if (showAuthor && authorName) {
    const authorText = '\u270D ' + authorName;
    s += `<text x="${cx}" y="${H - 150}" font-family="${FONT_FAMILY}" font-weight="400" font-style="italic" font-size="28" fill="${config.authorColor}" text-anchor="middle" direction="rtl">${escapeXml(authorText)}</text>`;
  }

  const wmPositions = [
    { x: W * 0.25, y: H * 0.16 },
    { x: W * 0.75, y: H * 0.34 },
    { x: W * 0.28, y: H * 0.56 },
    { x: W * 0.72, y: H * 0.76 },
  ];
  for (const p of wmPositions) {
    s += `<text transform="translate(${p.x.toFixed(0)} ${p.y.toFixed(0)}) rotate(-22)" font-family="${FONT_FAMILY}" font-weight="700" font-size="34" fill="${config.watermarkColor}" opacity="0.12" text-anchor="middle" direction="rtl">تصميم / sab3-77</text>`;
  }

  s += `</svg>`;
  return s;
}

async function generateQuoteImage(rawText, bookName, authorName, style, forceVariantIdx) {
  await ensureFonts();
  const text = prepareQuoteText(rawText);
  const W = 1080, H = 1920;
  const config = STYLE_CONFIGS[style] || STYLE_CONFIGS.naskh;
  const totalVariants = config.variants.length;

  let variantIdx;
  if (typeof forceVariantIdx === 'number') {
    variantIdx = forceVariantIdx % totalVariants;
  } else if (typeof state.currentVariantIdx === 'number' && state.currentVariantIdx !== null) {
    variantIdx = state.currentVariantIdx % totalVariants;
  } else {
    variantIdx = nextVariant(totalVariants);
  }
  state.currentVariantIdx = variantIdx;
  const variant = config.variants[variantIdx];

  const layout = computeOptimalLayout(text, W, H, config, variant);
  const fontSize = layout.fontSize;
  const lines = layout.lines;
  const lineHeight = layout.lineHeight;
  const topDivider = layout.topDivider;
  const bottomDivider = layout.bottomDivider;

  const totalH = lines.length * lineHeight;
  const centerY = (topDivider + bottomDivider) / 2;
  let startY = centerY - totalH / 2;
  if (startY < topDivider + 30) startY = topDivider + 30;
  if (startY + totalH > bottomDivider - 30) startY = bottomDivider - 30 - totalH;

  const cx = W / 2;
  let svg;
  if (config.isModern) {
    svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
    svg += `<rect width="${W}" height="${H}" fill="#fefefe"/>`;
    svg += `<rect x="0" y="0" width="14" height="${H}" fill="#0f172a"/>`;
    svg += `<rect x="14" y="0" width="6" height="${H}" fill="#2b6cb0"/>`;
    if (state.showQuote) {
      svg += `<text x="50" y="260" font-family="-apple-system, system-ui, sans-serif" font-weight="bold" font-size="280" fill="#0f172a" text-anchor="start">&#8220;</text>`;
    }
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i]; if (!line) continue;
      const y = startY + i * lineHeight + fontSize * 0.85;
      svg += `<text x="${cx}" y="${y}" font-family="${variant.font}" font-weight="800" font-size="${fontSize}" fill="${variant.textColor}" text-anchor="middle" direction="rtl">${escapeXml(line)}</text>`;
    }
    const lineY = Math.min(startY + totalH + 80, H - 300);
    svg += `<line x1="80" y1="${lineY}" x2="${W - 100}" y2="${lineY}" stroke="#0f172a" stroke-width="3"/>`;
    svg += `<circle cx="${W - 100}" cy="${lineY}" r="8" fill="#2b6cb0"/>`;
    if (state.showBook && bookName) svg += `<text x="${cx}" y="${lineY + 60}" font-family="-apple-system, ${FONT_FAMILY}" font-weight="700" font-size="32" fill="#0f172a" text-anchor="middle" direction="rtl">📖 ${escapeXml(bookName)}</text>`;
    if (state.showAuthor && authorName) svg += `<text x="${cx}" y="${lineY + 110}" font-family="-apple-system, ${FONT_FAMILY}" font-size="26" fill="#64748b" text-anchor="middle" direction="rtl">✍ ${escapeXml(authorName)}</text>`;
    const wm = [{x:W*0.25,y:H*0.18},{x:W*0.75,y:H*0.36},{x:W*0.28,y:H*0.58},{x:W*0.72,y:H*0.78}];
    for (const p of wm) {
      svg += `<text transform="translate(${p.x.toFixed(0)} ${p.y.toFixed(0)}) rotate(-22)" font-family="-apple-system, system-ui" font-weight="700" font-size="34" fill="#0f172a" opacity="0.07" text-anchor="middle">sab3-77</text>`;
    }
    svg += `</svg>`;
  } else {
    svg = buildQuoteSVG({
      W, H, lines, fontSize, lineHeight,
      startY, topDivider, bottomDivider,
      bookName, authorName, config, variant,
      showQuote: state.showQuote,
      showBook: state.showBook,
      showAuthor: state.showAuthor,
    });
  }

  const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const svgUrl = URL.createObjectURL(svgBlob);

  const img = new Image();
  img.crossOrigin = 'anonymous';

  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = () => reject(new Error('فشل تحميل SVG'));
    img.src = svgUrl;
  });

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, 0, 0, W, H);
  URL.revokeObjectURL(svgUrl);

  return new Promise(resolve => canvas.toBlob(b => resolve(b), 'image/png'));
}

async function showQuoteImage(text, style) {
  setStatus('جاري توليد الصورة...');
  try {
    state.currentImageText = text;
    state.editedText = text;
    state.editMode = false;
    state.currentVariantIdx = null;
    const useStyle = style || state.imageStyle;
    const blob = await generateQuoteImage(state.editedText, state.pdfName, state.authorName, useStyle);
    state.currentImageBlob = blob;
    const url = URL.createObjectURL(blob);
    document.getElementById('previewImg').src = url;
    document.getElementById('previewImg').classList.remove('hidden');
    document.getElementById('editPanel').classList.add('hidden');
    document.getElementById('editQuoteBtn').classList.remove('hidden');
    document.getElementById('regenBtn').classList.add('hidden');
    document.getElementById('imgPreview').classList.remove('hidden');
    document.getElementById('shareImgBtn').onclick = () => shareImage(blob);
    document.querySelectorAll('.style-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.style === useStyle);
    });
    setStatus('تم توليد الصورة ✨', 'ok');
  } catch (e) {
    setStatus('فشل توليد الصورة', 'err');
    toast('❌ ' + e.message);
    showErr('image: ' + e.message);
  }
}

function enterEditMode() {
  state.editMode = true;
  state.editedText = state.editedText || state.currentImageText;
  const ta = document.getElementById('editTextarea');
  ta.value = state.editedText;
  document.getElementById('previewImg').classList.add('hidden');
  document.getElementById('editPanel').classList.remove('hidden');
  document.getElementById('editQuoteBtn').classList.add('hidden');
  document.getElementById('regenBtn').classList.remove('hidden');
  updateToggleUI();
}

function updateToggleUI() {
  const q = document.getElementById('toggleQuoteBtn');
  const b = document.getElementById('toggleBookBtn');
  const a = document.getElementById('toggleAuthorBtn');
  q.classList.toggle('on', state.showQuote);
  q.classList.toggle('off', !state.showQuote);
  b.classList.toggle('on', state.showBook);
  b.classList.toggle('off', !state.showBook);
  a.classList.toggle('on', state.showAuthor);
  a.classList.toggle('off', !state.showAuthor);
  q.textContent = (state.showQuote ? '❝ ' : '🚫 ') + 'علامة';
  b.textContent = (state.showBook ? '📖 ' : '🚫 ') + 'الكتاب';
  a.textContent = (state.showAuthor ? '✍ ' : '🚫 ') + 'المؤلف';
}

async function regenerateCurrent() {
  if (state.busy) return;
  state.busy = true;
  const ta = document.getElementById('editTextarea');
  const newText = (ta.value || '').trim();
  if (!newText) { toast('❌ النص فارغ'); state.busy = false; return; }
  state.editedText = newText;

  setStatus('جاري إعادة التوليد...');
  const tQ = document.getElementById('toggleQuoteBtn');
  const tB = document.getElementById('toggleBookBtn');
  const tA = document.getElementById('toggleAuthorBtn');
  const rB = document.getElementById('regenBtn');
  tQ.disabled = true; tB.disabled = true; tA.disabled = true; rB.disabled = true;
  rB.textContent = '⏳ جاري...';

  try {
    const blob = await generateQuoteImage(state.editedText, state.pdfName, state.authorName, state.imageStyle);
    state.currentImageBlob = blob;
    const url = URL.createObjectURL(blob);
    document.getElementById('previewImg').src = url;
    document.getElementById('previewImg').classList.remove('hidden');
    document.getElementById('editPanel').classList.add('hidden');
    document.getElementById('editQuoteBtn').classList.remove('hidden');
    document.getElementById('regenBtn').classList.add('hidden');
    document.getElementById('shareImgBtn').onclick = () => shareImage(blob);
    state.editMode = false;
    setStatus('تم التوليد ✨', 'ok');
  } catch (e) {
    setStatus('فشل', 'err');
    toast('❌ ' + e.message);
    showErr('regen: ' + e.message);
  } finally {
    tQ.disabled = false; tB.disabled = false; tA.disabled = false; rB.disabled = false;
    rB.textContent = '🎨 توليد';
    state.busy = false;
  }
}

function closePreview() { document.getElementById('imgPreview').classList.add('hidden'); }

async function shareImage(blob) {
  const file = new File([blob], 'quote.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); }
    catch (e) { if (e.name !== 'AbortError') toast('تعذرت المشاركة'); }
  } else {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'quote.png'; a.click();
    toast('تم تحميل الصورة');
  }
}

function findQuote(text, book) { return state.library.find(q => q.text === text && q.book === book); }
function isFavorite(text, book) { const q = findQuote(text, book); return !!(q && q.favorite); }
function ensureInLibrary(text, book) {
  let q = findQuote(text, book);
  if (!q) {
    q = { id: (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now() + Math.random()), text, book, favorite: false, date: new Date().toISOString() };
    state.library.push(q); saveLibrary();
  }
  return q;
}
function toggleFavorite(text, book) { const q = ensureInLibrary(text, book); q.favorite = !q.favorite; saveLibrary(); }
function openLibrary() { document.getElementById('library').classList.remove('hidden'); renderLibrary('all'); }
function closeLibrary() { document.getElementById('library').classList.add('hidden'); }

function renderLibrary(filter) {
  const list = document.getElementById('libList'); list.innerHTML = '';
  let items = filter === 'fav' ? state.library.filter(q => q.favorite) : [...state.library];
  items.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  document.getElementById('libCount').textContent = items.length + ' اقتباس';
  document.getElementById('filterAll').className = 'btn ' + (filter === 'all' ? 'btn-purple' : 'btn-gray');
  document.getElementById('filterFav').className = 'btn ' + (filter === 'fav' ? 'btn-purple' : 'btn-gray');
  if (!items.length) { list.innerHTML = '<div style="text-align:center;color:#a0aec0;padding:30px;">لا توجد اقتباسات بعد</div>'; return; }
  items.forEach(q => {
    const card = document.createElement('div');
    card.className = 'card';
    const dateStr = (q.date || '').substring(0, 10);
    card.innerHTML = `
      <div class="card-head">
        <button class="star ${q.favorite ? 'on' : ''}">${q.favorite ? '★' : '☆'}</button>
        <span style="font-size:11px;color:#4a5568;">📕 ${escapeHtml(q.book || '')} · ${dateStr}</span>
      </div>
      <div class="q-text">${escapeHtml(q.text)}</div>
      <div class="card-actions">
        <button class="btn btn-green" data-act="copy">📋</button>
        <button class="btn btn-blue" data-act="share">📤</button>
        <button class="btn btn-purple" data-act="image">📸</button>
        <button class="btn btn-red" data-act="del">🗑</button>
      </div>`;
    card.querySelector('.star').addEventListener('click', () => { q.favorite = !q.favorite; saveLibrary(); renderLibrary(filter); });
    card.querySelector('[data-act="copy"]').addEventListener('click', () => copyQuote(q.text));
    card.querySelector('[data-act="share"]').addEventListener('click', () => shareQuote(q.text));
    card.querySelector('[data-act="image"]').addEventListener('click', () => showQuoteImage(q.text));
    card.querySelector('[data-act="del"]').addEventListener('click', () => {
      if (confirm('حذف؟')) { state.library = state.library.filter(x => x.id !== q.id); saveLibrary(); renderLibrary(filter); }
    });
    list.appendChild(card);
  });
}

function renderQuotes() {
  const container = document.getElementById('quotes');
  container.innerHTML = '';
  if (!state.quotes.length) return;
  const header = document.createElement('div');
  header.style.cssText = 'font-size:13px;color:#4a5568;text-align:right;padding:8px;margin-bottom:8px;line-height:1.7;';
  header.textContent = state.currentHeader;
  container.appendChild(header);
  state.quotes.forEach((quote, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const isFav = isFavorite(quote, state.pdfName);
    card.innerHTML = `
      <div class="card-head">
        <button class="star ${isFav ? 'on' : ''}" data-idx="${i}">${isFav ? '★' : '☆'}</button>
        <span class="q-num">❝ اقتباس ${i + 1}</span>
      </div>
      <div class="q-text">${escapeHtml(quote)}</div>
      <div class="card-actions">
        <button class="btn btn-green" data-action="copy" data-idx="${i}">📋 نسخ</button>
        <button class="btn btn-blue" data-action="share" data-idx="${i}">📤 مشاركة</button>
        <button class="btn btn-purple" data-action="image" data-idx="${i}">📸 صورة</button>
      </div>`;
    container.appendChild(card);
  });
  container.querySelectorAll('.star').forEach(b => b.addEventListener('click', () => {
    toggleFavorite(state.quotes[parseInt(b.dataset.idx)], state.pdfName); renderQuotes();
  }));
  container.querySelectorAll('[data-action]').forEach(b => b.addEventListener('click', () => {
    const idx = parseInt(b.dataset.idx);
    const t = state.quotes[idx];
    if (b.dataset.action === 'copy') copyQuote(t);
    else if (b.dataset.action === 'share') shareQuote(t);
    else showQuoteImage(t);
  }));
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
async function copyQuote(text) { try { await navigator.clipboard.writeText(text); toast('✅ تم النسخ'); } catch (e) { toast('❌ فشل النسخ'); } }
async function shareQuote(text) {
  if (navigator.share) { try { await navigator.share({ text }); } catch (e) { if (e.name !== 'AbortError') copyQuote(text); } }
  else copyQuote(text);
}

async function generate() {
  if (state.busy) return;
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { toast('❌ أدخل مفتاح OpenRouter'); return; }
  if (!state.pdfFile) { toast('❌ اختر PDF أولاً'); return; }
  saveApiKey(apiKey);
  state.busy = true;
  const genBtn = document.getElementById('genBtn');
  genBtn.disabled = true; genBtn.textContent = '⏳ جاري الاستخراج...';
  try {
    setStatus('جاري قراءة PDF...'); showProgress(true, 0);
    const { text } = await extractPdfText(state.pdfFile);
    let cleaned = truncateAtLine(cleanPdfText(text), 12000);
    if (!cleaned.trim()) { setStatus('لم يُعثر على نص', 'err'); return; }
    setStatus('جاري الاتصال بالنموذج...');
    const { text: answer, model } = await callOpenRouter(apiKey, state.pdfName, cleaned, state.quoteCount);
    const quotes = parseQuotes(answer);
    state.quotes = quotes;
    state.currentHeader = '📕 ' + state.pdfName + '\n🤖 ' + model.split('/').pop();
    quotes.forEach(q => ensureInLibrary(q, state.pdfName));
    renderQuotes();
    setStatus(`✓ ${quotes.length} اقتباسات — اضغط مجدداً`, 'ok');
    genBtn.textContent = '🔄 اقتباسات جديدة';
  } catch (e) {
    setStatus('حدث خطأ', 'err');
    document.getElementById('quotes').innerHTML = '<div class="card" style="color:#c53030;text-align:center;padding:20px;">حدث خطأ:<br><br>' + escapeHtml(e.message) + '</div>';
  } finally {
    state.busy = false; genBtn.disabled = false; showProgress(false);
  }
}

function initApp() {
  try {
    loadLibrary(); loadApiKey();
    ensureFonts().catch(() => {});

    document.getElementById('pickPdfBtn').addEventListener('click', () => document.getElementById('pdfInput').click());
    document.getElementById('pdfInput').addEventListener('change', (e) => {
      const f = e.target.files[0]; if (!f) return;
      state.pdfFile = f; state.pdfName = f.name;
      if (!document.getElementById('bookName').value) {
        document.getElementById('bookName').value = f.name.replace(/\.pdf$/i, '');
        state.pdfName = f.name.replace(/\.pdf$/i, '');
      }
      setStatus('✓ ' + f.name, 'ok');
      state.quotes = []; document.getElementById('quotes').innerHTML = '';
    });
    document.getElementById('genBtn').addEventListener('click', generate);

    document.getElementById('countBtn').addEventListener('click', function() {
      const opts = [3, 5, 7, 10];
      let idx = opts.indexOf(state.quoteCount);
      idx = (idx + 1) % opts.length;
      state.quoteCount = opts[idx];
      this.textContent = '🔢 ' + state.quoteCount;
    });

    document.getElementById('styleBtn').addEventListener('click', function() {
      let i = STYLE_ORDER.indexOf(state.imageStyle);
      i = (i + 1) % STYLE_ORDER.length;
      state.imageStyle = STYLE_ORDER[i];
      saveStyle(state.imageStyle);
      this.textContent = '🎨 ' + STYLE_NAMES[state.imageStyle].split(' ').slice(1).join(' ');
      toast('النمط: ' + STYLE_NAMES[state.imageStyle]);
    });

    document.getElementById('libBtn').addEventListener('click', openLibrary);
    document.getElementById('filterAll').addEventListener('click', () => renderLibrary('all'));
    document.getElementById('filterFav').addEventListener('click', () => renderLibrary('fav'));

    document.getElementById('bookName').addEventListener('input', e => state.pdfName = e.target.value || 'كتاب');
    document.getElementById('authorName').addEventListener('input', e => { state.authorName = e.target.value; saveAuthor(e.target.value); });

    document.querySelectorAll('.style-chip').forEach(chip => {
      chip.addEventListener('click', async () => {
        state.imageStyle = chip.dataset.style;
        saveStyle(state.imageStyle);
        state.currentVariantIdx = null;
        document.getElementById('styleBtn').textContent = '🎨 ' + STYLE_NAMES[state.imageStyle].split(' ').slice(1).join(' ');
        await showQuoteImage(state.editedText || state.currentImageText, state.imageStyle);
      });
    });

    document.getElementById('editQuoteBtn').addEventListener('click', enterEditMode);
    document.getElementById('regenBtn').addEventListener('click', regenerateCurrent);

    document.getElementById('toggleQuoteBtn').addEventListener('click', async () => {
      state.showQuote = !state.showQuote;
      updateToggleUI();
      toast(state.showQuote ? '❝ إظهار علامة الاقتباس' : '🚫 إخفاء علامة الاقتباس', 1200);
      await regenerateCurrent();
    });
    document.getElementById('toggleBookBtn').addEventListener('click', async () => {
      state.showBook = !state.showBook;
      updateToggleUI();
      toast(state.showBook ? '📖 إظهار اسم الكتاب' : '🚫 إخفاء اسم الكتاب', 1200);
      await regenerateCurrent();
    });
    document.getElementById('toggleAuthorBtn').addEventListener('click', async () => {
      state.showAuthor = !state.showAuthor;
      updateToggleUI();
      toast(state.showAuthor ? '✍ إظهار المؤلف' : '🚫 إخفاء المؤلف', 1200);
      await regenerateCurrent();
    });

    updateToggleUI();
  } catch (e) {
    showErr('init: ' + e.message);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
